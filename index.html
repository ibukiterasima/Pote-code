/* =====================================================
   図形描画
===================================================== */

function drawShape(
  type,
  x,
  y,
  size,
  color,
  rotation
){

  if(type==="circle"){

    return `
      <circle
        cx="${x}"
        cy="${y}"
        r="${size/2}"
        fill="${color}"
      />
    `;

  }


  if(type==="rect"){

    return `
      <rect
        x="${x-size/2}"
        y="${y-size/2}"
        width="${size}"
        height="${size*.62}"
        rx="${size*.08}"
        fill="${color}"
        transform="
          rotate(
            ${rotation}
            ${x}
            ${y}
          )
        "
      />
    `;

  }


  if(type==="triangle"){

    const h=size*.88;

    return `
      <polygon
        points="
          ${x},${y-h/2}
          ${x+size/2},${y+h/2}
          ${x-size/2},${y+h/2}
        "
        fill="${color}"
        transform="
          rotate(
            ${rotation}
            ${x}
            ${y}
          )
        "
      />
    `;

  }


  if(type==="diamond"){

    return `
      <polygon
        points="
          ${x},${y-size/2}
          ${x+size/2},${y}
          ${x},${y+size/2}
          ${x-size/2},${y}
        "
        fill="${color}"
      />
    `;

  }


  if(type==="line"){

    return `
      <rect
        x="${x-size*.13}"
        y="${y-size/2}"
        width="${size*.26}"
        height="${size}"
        rx="${size*.13}"
        fill="${color}"
        transform="
          rotate(
            ${rotation}
            ${x}
            ${y}
          )
        "
      />
    `;

  }


  if(type==="leaf"){

    return `
      <path
        d="
          M ${x-size*.48} ${y}
          Q ${x-size*.05} ${y-size*.55}
            ${x+size*.48} ${y-size*.10}

          Q ${x+size*.15} ${y+size*.38}
            ${x-size*.48} ${y}
          Z
        "

        fill="${color}"

        transform="
          rotate(
            ${rotation}
            ${x}
            ${y}
          )
        "
      />
    `;

  }


  if(type==="corner"){

    return `
      <path
        d="
          M ${x-size/2} ${y-size/2}
          L ${x+size/2} ${y-size/2}
          L ${x+size/2} ${y+size/2}
          Z
        "

        fill="${color}"

        transform="
          rotate(
            ${rotation}
            ${x}
            ${y}
          )
        "
      />
    `;

  }

  return "";

}


/* =====================================================
   UTF-8
===================================================== */

function utf8(text){

  return Array.from(
    new TextEncoder().encode(text)
  );

}


/* =====================================================
   CRC
===================================================== */

function crc16(bytes){

  let crc=0xFFFF;

  for(const b of bytes){

    crc ^= b;

    for(let i=0;i<8;i++){

      if(crc&1){

        crc =
          (crc>>1)^0xA001;

      }else{

        crc>>=1;

      }

    }

  }

  return crc&0xFFFF;

}


/* =====================================================
   ビット列
===================================================== */

function byteBits(n){

  const a=[];

  for(let i=7;i>=0;i--){

    a.push(
      (n>>i)&1
    );

  }

  return a;

}


/* =====================================================
   データ作成
===================================================== */

function makePayload(text){

  const bytes=utf8(text);

  /*
    46スロットしかないため、
    見た目を崩さないことを優先。

    5byteまで。
  */

  if(bytes.length>5){

    return null;

  }


  const data=[];


  /*
    3bit = UTF-8 byte length
  */

  for(let i=2;i>=0;i--){

    data.push(
      (bytes.length>>i)&1
    );

  }


  /*
    本文
  */

  for(const b of bytes){

    data.push(
      ...byteBits(b)
    );

  }


  /*
    CRC 16bit
  */

  const crc=crc16(bytes);

  data.push(
    ...byteBits(crc>>8),
    ...byteBits(crc&255)
  );


  /*
    61bit以上になる場合は
    圧縮できないため短縮
  */

  return data.slice(
    0,
    SLOTS.length
  );

}


/* =====================================================
   データを見た目のいい配置にする
===================================================== */

/*
   普通に

   101001000100...

   と置くと、文字によって
   スカスカになってしまう。

   そこで固定スロットを
   「できるだけ同じ数の図形が
   出るように」配置する。

   位置そのものは変わらない。

===================================================== */

function balancedBits(bits,count){

  const result =
    new Array(count).fill(0);


  /*
    シードを作る
  */

  let seed=0;

  for(let i=0;i<bits.length;i++){

    seed =
      (seed*31 + bits[i]+7) >>> 0;

  }


  /*
    Fisher-Yates

    スロットの順番だけ
    決定的に変える。

    座標は変わらない。
  */

  const order =
    Array.from(
      {length:count},
      (_,i)=>i
    );


  for(let i=count-1;i>0;i--){

    seed =
      (Math.imul(
        seed ^ (seed>>>16),
        2246822519
      ))>>>0;

    const j =
      seed%(i+1);

    [
      order[i],
      order[j]
    ]=[
      order[j],
      order[i]
    ];

  }


  /*
    元データをそのまま配置。

    さらにデータ終了後は
    見た目が極端に偏らないよう
    シードで補助する。

  */

  for(
    let i=0;
    i<bits.length && i<count;
    i++
  ){

    result[
      order[i]
    ]=bits[i];

  }


  return result;

}


/* =====================================================
   生成
===================================================== */

let currentSVG="";


function generate(){

  const text =
    document.getElementById("text").value;


  if(!text){

    alert(
      "文字を入力してください。"
    );

    return;

  }


  const bytes=utf8(text);


  /*
    この画像配置は
    1つの図形=1bit。

    見た目優先なので
    5byteまで。
  */

  if(bytes.length>5){

    alert(
      "このPOTE CODE配置では、\n" +
      "見た目を保つためUTF-8で5バイトまでです。\n\n" +
      "日本語は1文字で複数バイトを使うため、\n" +
      "日本語だけの場合は少ない文字数になります。"
    );

    return;

  }


  const bits =
    makePayload(text);


  const visible =
    balancedBits(
      bits,
      SLOTS.length
    );


  let shapes="";


  /*
    ★ここ

    visible[i] === 1
       → 図形を表示

    visible[i] === 0
       → 完全に何も表示しない

    座標はSLOTSから一切変更しない。
  */

  for(
    let i=0;
    i<SLOTS.length;
    i++
  ){

    if(visible[i]!==1){

      continue;

    }


    const s=SLOTS[i];


    shapes +=
      drawShape(
        s.shape,
        s.x,
        s.y,
        s.size,
        s.color,
        s.rot
      );

  }


  currentSVG=`

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1034 1149"
  preserveAspectRatio="xMidYMid meet">

  <!-- paper -->

  <rect
    x="0"
    y="0"
    width="1034"
    height="1149"
    fill="#FBF7EC"
  />


  <!--
    =========================================
    FIXED DATA SHAPES
    =========================================

    座標は参考画像から固定。

    データによって
    「表示 / 非表示」
    だけが変わる。

  -->

  ${shapes}


  <!--
    =========================================
    CENTRAL POTE
    =========================================
  -->

  ${drawPote()}

</svg>

`;


  document.getElementById(
    "result"
  ).innerHTML =
    currentSVG;

}


/* =====================================================
   SVG保存
===================================================== */

function saveSVG(){

  if(!currentSVG){

    alert(
      "先にPOTE CODEを生成してください。"
    );

    return;

  }


  const blob =
    new Blob(
      [currentSVG],
      {
        type:"image/svg+xml"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");

  a.href=url;
  a.download="pote-code.svg";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}
