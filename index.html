<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>POTE CODE</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f2e3;
  color:#66584d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.wrap{
  width:min(1000px,96vw);
  margin:auto;
  padding:30px 12px 50px;
}

.title{
  text-align:center;
  font-size:46px;
  font-weight:800;
  letter-spacing:.24em;
  margin-left:.24em;
}

.subtitle{
  text-align:center;
  margin-top:8px;
  font-size:14px;
  letter-spacing:.32em;
  opacity:.72;
}

.controls{
  width:min(700px,100%);
  margin:25px auto 10px;
  padding:16px;
  background:rgba(255,255,255,.55);
  border-radius:18px;
}

textarea{
  width:100%;
  min-height:70px;
  resize:vertical;
  border:1px solid #d8cdb9;
  border-radius:12px;
  padding:12px;
  background:#fffdf7;
  color:#5d5147;
  font-size:16px;
  outline:none;
}

button{
  border:0;
  border-radius:999px;
  padding:11px 18px;
  margin-top:9px;
  background:#71866c;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.info{
  margin-top:8px;
  font-size:12px;
  line-height:1.7;
}

.codebox{
  width:min(900px,100%);
  margin:auto;
}

svg{
  display:block;
  width:100%;
  height:auto;
}

.test{
  margin-top:10px;
  text-align:center;
  font-size:13px;
  line-height:1.8;
}

.good{
  color:#58734e;
  font-weight:700;
}

.version{
  margin-top:4px;
  text-align:center;
  font-size:9px;
  opacity:.42;
  letter-spacing:.08em;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="title">POTE CODE</div>

  <div class="subtitle">
    COLORFUL GEOMETRIC CODE
  </div>

  <div class="controls">

    <textarea
      id="text"
      maxlength="30"
    >ポテちゃん大冒険2026</textarea>

    <button onclick="generate()">
      ポテコードを生成
    </button>

    <button onclick="sample()">
      別の文字でテスト
    </button>

    <div
      class="info"
      id="info">
    </div>

  </div>

  <div class="codebox">

    <svg
      id="svg"
      viewBox="0 0 1500 1500"
      xmlns="http://www.w3.org/2000/svg">
    </svg>

    <div
      class="test"
      id="test">
    </div>

  </div>

  <div class="version">
    POTE CODE ver 1.2
  </div>

</div>


<script>

/* =========================================================
   POTE CODE ver 1.2

   30文字
   UTF-16 480bit
   文字数 5bit
   CRC8 8bit

   合計 493bit

   32スロット × 17グループ
   = 544スロット

   各グループは必ず16個ON。

   データ：
   図形あり = 1
   図形なし = 0

   色・図形種類・大きさはデータではない。

   ver 1.2 調整点：

   ・図形を少し大きくした
   ・図形同士の間隔を拡大
   ・重なりを防止
   ・色を少しだけ濃くした
   ・配置方式は従来と同じ
========================================================= */


/* =========================================================
   基本
========================================================= */

const SVG =
  document.getElementById("svg");

const CENTER = 750;

const SLOT_COUNT = 544;


/* =========================================================
   色

   元の雰囲気を維持しながら
   カメラで認識しやすいよう少しだけ濃く。
========================================================= */

const COLORS = [
  "#789B69",
  "#D89D32",
  "#CE7E3F",
  "#4F858F",
  "#939B54",
  "#668D67"
];


/* =========================================================
   固定乱数
========================================================= */

let seed = 9283746;

function random(){

  seed =
    (seed * 1664525 + 1013904223)
    >>> 0;

  return seed / 4294967296;

}


/* =========================================================
   固定スロット

   円形に自然に散らす。

   ver 1.2
   MIN_DISTANCEを大きくして
   図形同士の重なりを防止。
========================================================= */

const DATA_SLOTS = [];

function createSlots(){

  seed = 9283746;

  const result = [];

  const MIN_R = 175;

  const MAX_R = 640;

  /*
    最大図形の幅を考慮して
    中心同士を十分離す。
  */
  const MIN_DISTANCE = 48;

  const marks = [
    {x:255,y:275},
    {x:1245,y:275},
    {x:255,y:1245}
  ];

  let safety = 0;


  while(
    result.length < SLOT_COUNT &&
    safety < 2000000
  ){

    safety++;


    const r =
      Math.sqrt(
        random() *
        (
          MAX_R * MAX_R -
          MIN_R * MIN_R
        ) +
        MIN_R * MIN_R
      );


    const angle =
      random() * Math.PI * 2;


    const x =
      CENTER +
      Math.cos(angle) * r;


    const y =
      CENTER +
      Math.sin(angle) * r;


    let ok = true;


    /*
      他のスロットとの距離
    */

    for(
      const p of result
    ){

      const dx = x - p.x;

      const dy = y - p.y;


      if(
        dx * dx +
        dy * dy <
        MIN_DISTANCE * MIN_DISTANCE
      ){

        ok = false;

        break;

      }

    }


    if(!ok){
      continue;
    }


    /*
      角度合わせマーク周辺を空ける
    */

    for(
      const m of marks
    ){

      const dx = x - m.x;

      const dy = y - m.y;


      if(
        dx * dx +
        dy * dy <
        105 * 105
      ){

        ok = false;

        break;

      }

    }


    if(ok){

      result.push({
        x:x,
        y:y
      });

    }

  }


  return result;

}


DATA_SLOTS.push(
  ...createSlots()
);


/* =========================================================
   SVG要素
========================================================= */

function el(
  name,
  attrs={}
){

  const e =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      name
    );


  for(
    const key in attrs
  ){

    e.setAttribute(
      key,
      attrs[key]
    );

  }


  return e;

}


/* =========================================================
   文字 → bits
========================================================= */

function textBits(text){

  const bits = [];


  for(
    let i = 0;
    i < 30;
    i++
  ){

    const code =
      i < text.length
      ? text.charCodeAt(i)
      : 0;


    for(
      let b = 15;
      b >= 0;
      b--
    ){

      bits.push(
        (code >> b) & 1
      );

    }

  }


  return bits;

}


/* =========================================================
   CRC8
========================================================= */

function crc8(bits){

  let crc = 0;


  for(
    const bit of bits
  ){

    const mix =
      ((crc >> 7) & 1) ^ bit;


    crc =
      (crc << 1) & 255;


    if(mix){

      crc ^= 0x07;

    }

  }


  return crc;

}


/* =========================================================
   bits → number
========================================================= */

function bitsToNumber(bits){

  let n = 0;


  for(
    const b of bits
  ){

    n = n * 2 + b;

  }


  return n;

}


/* =========================================================
   組み合わせ
========================================================= */

function C(n,k){

  if(
    k < 0 ||
    k > n
  ){

    return 0;

  }


  k =
    Math.min(
      k,
      n-k
    );


  let r = 1;


  for(
    let i = 1;
    i <= k;
    i++
  ){

    r =
      r * (n-k+i) / i;

  }


  return Math.round(r);

}


/* =========================================================
   29bit → 32スロット
========================================================= */

function unrank(rank){

  const bits = [];

  let ones = 16;

  let r = rank;


  for(
    let i = 0;
    i < 32;
    i++
  ){

    if(ones === 0){

      bits.push(0);

      continue;

    }


    if(
      ones === 32-i
    ){

      bits.push(1);

      ones--;

      continue;

    }


    const zeroCount =
      C(
        31-i,
        ones
      );


    if(
      r < zeroCount
    ){

      bits.push(0);

    }
    else{

      bits.push(1);

      r -= zeroCount;

      ones--;

    }

  }


  return bits;

}


/* =========================================================
   パケット
========================================================= */

function makePacket(text){

  const body =
    textBits(text);


  const bits = [];


  const length =
    text.length;


  /*
    文字数5bit
  */

  for(
    let i = 4;
    i >= 0;
    i--
  ){

    bits.push(
      (length >> i) & 1
    );

  }


  /*
    本文480bit
  */

  bits.push(...body);


  /*
    CRC8
  */

  const crc =
    crc8(body);


  for(
    let i = 7;
    i >= 0;
    i--
  ){

    bits.push(
      (crc >> i) & 1
    );

  }


  return bits;

}


/* =========================================================
   encode
========================================================= */

function encode(text){

  const packet =
    makePacket(text);


  const groups = [];


  for(
    let g = 0;
    g < 17;
    g++
  ){

    const chunk =
      packet.slice(
        g * 29,
        g * 29 + 29
      );


    while(
      chunk.length < 29
    ){

      chunk.push(0);

    }


    const value =
      bitsToNumber(chunk);


    groups.push(
      unrank(value)
    );

  }


  return groups.flat();

}


/* =========================================================
   図形

   ver 1.2
   少しだけ大きくして読み取りやすくする。

   形そのものは変更しない。
========================================================= */

function drawShape(
  x,
  y,
  size,
  type,
  color
){

  let shape;


  if(type === 0){

    shape =
      el(
        "circle",
        {
          cx:x,
          cy:y,
          r:size,
          fill:color
        }
      );

  }

  else if(type === 1){

    shape =
      el(
        "rect",
        {
          x:x-size,
          y:y-size*.82,
          width:size*2,
          height:size*1.64,
          rx:size*.45,
          fill:color
        }
      );

  }

  else if(type === 2){

    shape =
      el(
        "polygon",
        {
          points:
            `${x},${y-size*1.15} `+
            `${x+size},${y+size*.75} `+
            `${x-size},${y+size*.75}`,
          fill:color
        }
      );

  }

  else if(type === 3){

    shape =
      el(
        "polygon",
        {
          points:
            `${x},${y-size} `+
            `${x+size},${y} `+
            `${x},${y+size} `+
            `${x-size},${y}`,
          fill:color
        }
      );

  }

  else{

    shape =
      el(
        "rect",
        {
          x:x-size*1.30,
          y:y-size*.62,
          width:size*2.60,
          height:size*1.24,
          rx:size*.45,
          fill:color
        }
      );

  }


  return shape;

}


/* =========================================================
   角度合わせマーク
========================================================= */

function drawAlignmentMark(
  x,
  y
){

  const g =
    el(
      "g",
      {
        "data-alignment":"true"
      }
    );


  /*
    外側
  */

  g.appendChild(
    el(
      "circle",
      {
        cx:x,
        cy:y,
        r:38,
        fill:"#FFFDF5",
        stroke:"#51483F",
        "stroke-width":"7"
      }
    )
  );


  /*
    内側
  */

  g.appendChild(
    el(
      "circle",
      {
        cx:x,
        cy:y,
        r:18,
        fill:"none",
        stroke:"#51483F",
        "stroke-width":"6"
      }
    )
  );


  /*
    中央
  */

  g.appendChild(
    el(
      "circle",
      {
        cx:x,
        cy:y,
        r:5,
        fill:"#51483F"
      }
    )
  );


  SVG.appendChild(g);

}


/* =========================================================
   POTE CODE描画
========================================================= */

function drawCode(text){

  while(
    SVG.firstChild
  ){

    SVG.removeChild(
      SVG.firstChild
    );

  }


  /*
    背景
  */

  SVG.appendChild(
    el(
      "rect",
      {
        x:0,
        y:0,
        width:1500,
        height:1500,
        fill:"#FFFDF5"
      }
    )
  );


  /*
    データ
  */

  const bits =
    encode(text);


  let onCount = 0;


  for(
    let i = 0;
    i < SLOT_COUNT;
    i++
  ){

    if(bits[i] !== 1){

      continue;

    }


    onCount++;


    const p =
      DATA_SLOTS[i];


    /*
      5種類の形
    */

    const type =
      i % 5;


    /*
      ver 1.2

      元より少し大きくする。

      小さい：
      11～13

      中：
      14～16

      特殊：
      18～20

      ただし最大でも
      スロット間隔48以内に
      収まるようにしている。
    */

    let size;


    if(i % 23 === 0){

      size = 18;

    }
    else if(i % 13 === 0){

      size = 16;

    }
    else if(i % 7 === 0){

      size = 15;

    }
    else{

      size = 11 + (i % 3);

    }


    /*
      色
    */

    const color =
      COLORS[
        (i * 7) % COLORS.length
      ];


    const shape =
      drawShape(
        p.x,
        p.y,
        size,
        type,
        color
      );


    shape.dataset.slot = i;

    shape.dataset.bit = "1";


    SVG.appendChild(shape);

  }


  /*
    =======================================================
    3つの角度合わせマーク
    =======================================================
  */

  drawAlignmentMark(
    255,
    275
  );


  drawAlignmentMark(
    1245,
    275
  );


  drawAlignmentMark(
    255,
    1245
  );


  /*
    =======================================================
    中央POTEマーク
    =======================================================
  */

  const pote =
    el(
      "g",
      {
        "data-fixed":"pote-mark"
      }
    );


  /*
    本体
  */

  pote.appendChild(
    el(
      "circle",
      {
        cx:750,
        cy:750,
        r:78,
        fill:"#D99A3D"
      }
    )
  );


  /*
    左側の模様
  */

  pote.appendChild(
    el(
      "path",
      {
        d:
          "M704 708 Q682 750 704 792",
        fill:"none",
        stroke:"#C88340",
        "stroke-width":"7",
        "stroke-linecap":"round",
        opacity:.65
      }
    )
  );


  /*
    目
  */

  pote.appendChild(
    el(
      "circle",
      {
        cx:724,
        cy:742,
        r:7,
        fill:"#51483F"
      }
    )
  );


  pote.appendChild(
    el(
      "circle",
      {
        cx:776,
        cy:742,
        r:7,
        fill:"#51483F"
      }
    )
  );


  /*
    口
  */

  pote.appendChild(
    el(
      "path",
      {
        d:
          "M736 766 Q750 778 764 766",
        fill:"none",
        stroke:"#51483F",
        "stroke-width":"5",
        "stroke-linecap":"round"
      }
    )
  );


  SVG.appendChild(pote);


  /*
    =======================================================
    外周
    =======================================================
  */

  SVG.appendChild(
    el(
      "circle",
      {
        cx:750,
        cy:750,
        r:680,
        fill:"none",
        stroke:"#D7CAB0",
        "stroke-width":"2",
        opacity:.3
      }
    )
  );


  /*
    情報
  */

  document.getElementById("info").innerHTML =
    `文字数：${text.length} / 30<br>`+
    `固定スロット：544個<br>`+
    `表示図形：${onCount}個 / 544個<br>`+
    `データ判定：図形の「ある・ない」のみ`;


  document.getElementById("test").innerHTML =
    `<span class="good">✓ POTE CODE生成成功</span><br>`+
    `読み取り用に図形サイズ・色・間隔を最適化しています。`;

}


/* =========================================================
   サンプル
========================================================= */

function sample(){

  const samples = [
    "ポテちゃん",
    "ポテちゃん大冒険",
    "こんにちはポテちゃん！",
    "POTE CODE",
    "POTE CODE 2026",
    "森のカフェへようこそ",
    "ポテちゃんの世界",
    "ゲームを作っています",
    "1234567890 ABCDEFGHI",
    "ポテゲーム研究部"
  ];


  const value =
    samples[
      Math.floor(
        Math.random() * samples.length
      )
    ];


  document.getElementById("text").value =
    value;


  generate();

}


/* =========================================================
   生成
========================================================= */

function generate(){

  const text =
    document.getElementById("text").value;


  if(!text){

    alert(
      "文字を入力してください。"
    );

    return;

  }


  if(text.length > 30){

    alert(
      "30文字まで入力できます。"
    );

    return;

  }


  if(DATA_SLOTS.length < SLOT_COUNT){

    alert(
      "スロット生成に失敗しました。"
    );

    return;

  }


  drawCode(text);

}


/* =========================================================
   初期表示
========================================================= */

generate();

</script>

</body>
</html>
