<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>POTE CODE Generator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#faf7ee;
  color:#51483d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.app{
  width:min(720px,100%);
  margin:auto;
  padding:28px 18px 50px;
}

h1{
  text-align:center;
  letter-spacing:4px;
  margin:10px 0 4px;
  font-size:32px;
}

.sub{
  text-align:center;
  opacity:.55;
  font-size:13px;
  margin-bottom:25px;
}

.panel{
  background:#fffdf8;
  border:2px solid #e2d8c6;
  border-radius:28px;
  padding:18px;
  box-shadow:0 10px 35px rgba(70,50,25,.08);
}

input[type="text"]{
  width:100%;
  border:2px solid #ded4c2;
  border-radius:15px;
  padding:15px;
  font-size:16px;
  outline:none;
  background:#fffefa;
  color:#51483d;
}

input[type="text"]:focus{
  border-color:#739b78;
}

button{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:16px;
  padding:15px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  background:#739b78;
  color:white;
}

button.secondary{
  background:#e7dfd0;
  color:#51483d;
}

#codeArea{
  margin-top:20px;
  width:100%;
  display:flex;
  justify-content:center;
}

svg{
  width:100%;
  max-width:620px;
  height:auto;
  border-radius:25px;
}

.info{
  text-align:center;
  margin-top:14px;
  font-size:12px;
  opacity:.55;
}
</style>
</head>

<body>

<div class="app">

<h1>POTE CODE</h1>

<div class="sub">
GENERATOR
</div>

<div class="panel">

<input
  id="text"
  type="text"
  placeholder="読み取りたい文字を入力"
/>

<button onclick="generate()">
POTE CODEを生成
</button>

<button
  class="secondary"
  onclick="saveSVG()">
SVGを保存
</button>

<div id="codeArea"></div>

<div class="info">
このPOTE CODEは読み取り対応規格です。
</div>

</div>

</div>


<script>

/* =========================================
   POTE CODE v1
   ========================================= */

const SIZE = 1000;

const COLORS = [
  "#79a978",
  "#91b87b",
  "#e4a52f",
  "#d38d45",
  "#5c8fa2",
  "#76a38a",
  "#b78a50",
  "#6d9072"
];

let currentSVG = "";


/* =========================================
   UTF-8
   ========================================= */

function textToBytes(text){

  return Array.from(
    new TextEncoder().encode(text)
  );
}


/* =========================================
   CRC
   ========================================= */

function crc8(bytes){

  let crc = 0;

  for(const byte of bytes){

    crc ^= byte;

    for(let i=0;i<8;i++){

      if(crc & 0x80){

        crc =
          ((crc << 1) ^ 0x07) &
          255;

      }else{

        crc =
          (crc << 1) &
          255;

      }
    }
  }

  return crc;
}


/* =========================================
   POTE CODE DATA
   ========================================= */

function makeData(text){

  const payload =
    textToBytes(text);

  /*
    POTE
    version
    length
    data
    CRC
  */

  if(payload.length > 180){

    alert(
      "文字が長すぎます。\n180バイト以内にしてください。"
    );

    return null;
  }

  const data = [

    80, // P
    79, // O
    84, // T
    69, // E

    1,  // version

    payload.length,

    ...payload

  ];

  data.push(
    crc8(data)
  );

  return data;
}


/* =========================================
   byte → 2bit
   ========================================= */

function bytesToSymbols(bytes){

  const symbols = [];

  for(const byte of bytes){

    symbols.push(
      (byte >> 6) & 3
    );

    symbols.push(
      (byte >> 4) & 3
    );

    symbols.push(
      (byte >> 2) & 3
    );

    symbols.push(
      byte & 3
    );
  }

  return symbols;
}


/* =========================================
   固定スロット
   ========================================= */

function getSlots(){

  const slots = [];

  const rings = [

    {
      radius:270,
      count:20
    },

    {
      radius:340,
      count:24
    },

    {
      radius:400,
      count:24
    }

  ];

  for(const ring of rings){

    for(let i=0;i<ring.count;i++){

      const angle =
        -Math.PI/2 +
        Math.PI*2*i/ring.count;

      slots.push({

        x:
          500 +
          Math.cos(angle) *
          ring.radius,

        y:
          500 +
          Math.sin(angle) *
          ring.radius

      });

    }

  }

  return slots;
}


/* =========================================
   SVG
   ========================================= */

function esc(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}


function circle(x,y,r,color){

  return `
    <circle
      cx="${x}"
      cy="${y}"
      r="${r}"
      fill="${color}"
    />
  `;
}


function square(x,y,s,color){

  return `
    <rect
      x="${x-s/2}"
      y="${y-s/2}"
      width="${s}"
      height="${s}"
      rx="5"
      fill="${color}"
    />
  `;
}


function diamond(x,y,s,color){

  return `
    <polygon
      points="
        ${x},${y-s/2}
        ${x+s/2},${y}
        ${x},${y+s/2}
        ${x-s/2},${y}
      "
      fill="${color}"
    />
  `;
}


function triangle(x,y,s,color){

  const h =
    s * 0.866;

  return `
    <polygon
      points="
        ${x},${y-h/2}
        ${x+s/2},${y+h/2}
        ${x-s/2},${y+h/2}
      "
      fill="${color}"
    />
  `;
}


/* =========================================
   ポテちゃんマーク
   ========================================= */

function drawPote(){

  return `

    <!-- Pote -->
    <g>

      <ellipse
        cx="500"
        cy="500"
        rx="105"
        ry="125"
        fill="#b77b42"
      />

      <ellipse
        cx="465"
        cy="475"
        rx="12"
        ry="17"
        fill="#51483d"
      />

      <ellipse
        cx="535"
        cy="475"
        rx="12"
        ry="17"
        fill="#51483d"
      />

      <path
        d="
          M465 530
          Q500 555 535 530
        "
        fill="none"
        stroke="#51483d"
        stroke-width="8"
        stroke-linecap="round"
      />

    </g>
  `;
}


/* =========================================
   右下Finder
   ========================================= */

function drawFinder(){

  return `

    <g>

      <polygon
        points="
          850,810
          890,850
          850,890
          810,850
        "
        fill="#79a978"
      />

      <circle
        cx="850"
        cy="850"
        r="10"
        fill="#e4a52f"
      />

    </g>

  `;
}


/* =========================================
   データ図形
   ========================================= */

function drawSymbol(symbol,x,y){

  const size = 44;

  const color =
    COLORS[
      (x+y)%COLORS.length
    ];

  switch(symbol){

    case 0:
      return circle(
        x,
        y,
        size/2,
        color
      );

    case 1:
      return triangle(
        x,
        y,
        size,
        color
      );

    case 2:
      return square(
        x,
        y,
        size,
        color
      );

    case 3:
      return diamond(
        x,
        y,
        size,
        color
      );

  }

}


/* =========================================
   生成
   ========================================= */

function generate(){

  const text =
    document.getElementById("text")
      .value;

  if(!text){

    alert(
      "文字を入力してください。"
    );

    return;
  }

  const data =
    makeData(text);

  if(!data) return;

  const symbols =
    bytesToSymbols(data);

  const slots =
    getSlots();

  let shapes = "";

  /*
    未使用スロットも
    見た目を自然にするため
    薄い図形を配置
  */

  for(let i=0;i<slots.length;i++){

    const slot =
      slots[i];

    let symbol;

    if(i < symbols.length){

      symbol =
        symbols[i];

    }else{

      /*
        未使用部分
        → 装飾として固定パターン
      */

      symbol =
        (i * 7 + 3) % 4;

    }

    shapes +=
      drawSymbol(
        symbol,
        slot.x,
        slot.y
      );
  }


  currentSVG = `

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 1000">

  <rect
    width="1000"
    height="1000"
    rx="50"
    fill="#fffaf0"
  />

  <!-- 外側の円 -->
  <circle
    cx="500"
    cy="500"
    r="450"
    fill="none"
    stroke="#eadfcb"
    stroke-width="4"
  />

  <!-- データ -->
  ${shapes}

  <!-- 中央POTE -->
  ${drawPote()}

  <!-- 右下Finder -->
  ${drawFinder()}

</svg>
`;


  document.getElementById(
    "codeArea"
  ).innerHTML =
    currentSVG;

}


/* =========================================
   SVG保存
   ========================================= */

function saveSVG(){

  if(!currentSVG){

    alert(
      "先にPOTE CODEを生成してください。"
    );

    return;
  }

  const blob =
    new Blob(
      [currentSVG],
      {
        type:"image/svg+xml"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "pote-code.svg";

  a.click();

  URL.revokeObjectURL(url);
}

</script>

</body>
</html>
