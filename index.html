<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>POTE CODE Generator v2.2</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#f7f1e5;
  color:#51483f;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  padding:22px 14px 35px;
}

.app{
  width:min(680px,100%);
}

h1{
  margin:0 0 5px;
  text-align:center;
  font-size:25px;
  letter-spacing:.08em;
}

.sub{
  text-align:center;
  font-size:12px;
  opacity:.65;
  margin-bottom:18px;
}

.card{
  background:rgba(255,255,255,.72);
  border-radius:22px;
  padding:18px;
  box-shadow:0 8px 30px rgba(80,65,45,.08);
}

textarea{
  width:100%;
  min-height:110px;
  resize:vertical;
  border:1px solid #d9cdb9;
  border-radius:15px;
  background:#fffdf8;
  color:#51483f;
  padding:14px;
  font-size:16px;
  outline:none;
}

textarea:focus{
  border-color:#789B69;
}

button{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:15px;
  padding:14px;
  font-size:16px;
  font-weight:700;
  background:#789B69;
  color:white;
  cursor:pointer;
}

button:active{
  transform:scale(.985);
}

.canvasWrap{
  margin-top:18px;
  width:100%;
  aspect-ratio:1;
  background:#fffdf7;
  border-radius:22px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

svg{
  width:100%;
  height:100%;
  display:block;
}

.status{
  margin-top:12px;
  text-align:center;
  font-size:13px;
  min-height:20px;
}

.info{
  margin-top:8px;
  text-align:center;
  font-size:10px;
  opacity:.5;
  line-height:1.5;
}

.ver{
  text-align:center;
  margin-top:14px;
  font-size:10px;
  opacity:.42;
  letter-spacing:.08em;
}
</style>
</head>

<body>

<div class="app">

<h1>POTE CODE</h1>

<div class="sub">
見た目を保ったまま文字をコード化
</div>

<div class="card">

<textarea
  id="text"
  maxlength="30"
  placeholder="ここに文字を入力（30文字まで）"
></textarea>

<button id="generate">
POTE CODEを生成
</button>

<div class="canvasWrap">

<svg
  id="svg"
  viewBox="0 0 1500 1500"
  xmlns="http://www.w3.org/2000/svg">
</svg>

</div>

<div id="status" class="status"></div>

<div class="info">
UTF-8最大60バイトまで
</div>

</div>

<div class="ver">
POTE CODE ver 2.2
</div>

</div>


<script>

/* =========================================================
   POTE CODE v2.2
========================================================= */


/* =========================================================
   共通仕様
========================================================= */

const SIZE = 1500;

const CENTER = 750;

const PACKET_BITS = 493;

const GROUP_BITS = 29;

const GROUP_COUNT = 17;

const SLOT_BITS = 544;

const MAX_UTF8_BYTES = 60;

const MAX_CHARS = 30;


/*
  493bit

  5bit  : 文字数
  480bit: UTF-8データ領域
  8bit  : CRC

  合計493bit

  493 / 29 = 17
*/


/* =========================================================
   スロット設定
========================================================= */

const SLOT_COUNT = 544;

const MIN_R = 175;

const MAX_R = 640;

const DISTANCES = [
  42,
  40,
  39,
  38,
  37,
  36
];

const MARKER_EXCLUSION = 105;


/* =========================================================
   色
========================================================= */

const COLORS = [
  "#789B69",
  "#D89D32",
  "#CE7E3F",
  "#4F858F",
  "#939B54",
  "#668D67"
];


/* =========================================================
   固定乱数
========================================================= */

let seed = 9283746;

function random(){

  seed =
    (seed * 1664525 + 1013904223)
    >>> 0;

  return seed / 4294967296;

}


/* =========================================================
   UTF-8
========================================================= */

function encodeUTF8(text){

  return new TextEncoder().encode(text);

}


/* =========================================================
   文字数
========================================================= */

function characterCount(text){

  return Array.from(text).length;

}


/* =========================================================
   CRC8
========================================================= */

function crc8(bits){

  let crc = 0;

  for(const bit of bits){

    const mix =
      ((crc >> 7) & 1) ^ bit;

    crc =
      (crc << 1) & 255;

    if(mix){

      crc ^= 0x07;

    }

  }

  return crc;

}


/* =========================================================
   組み合わせ
========================================================= */

function C(n,k){

  if(k < 0 || k > n){

    return 0;

  }

  k =
    Math.min(k,n-k);

  let result = 1;

  for(let i=1;i<=k;i++){

    result =
      result *
      (n-k+i) /
      i;

  }

  return Math.round(result);

}


/* =========================================================
   bits → number
========================================================= */

function bitsToNumber(bits){

  let value = 0;

  for(const bit of bits){

    value =
      value * 2 +
      bit;

  }

  return value;

}


/* =========================================================
   29bit → 32bit / 16ON
========================================================= */

function unrank(rank){

  if(
    rank < 0 ||
    rank >= Math.pow(2,29)
  ){

    throw new Error(
      "29bit値が範囲外です"
    );

  }

  const result = [];

  let remaining = 16;

  let r = rank;


  for(let i=0;i<32;i++){

    if(remaining === 0){

      result.push(0);

      continue;

    }


    if(remaining === 32-i){

      result.push(1);

      remaining--;

      continue;

    }


    const zeroCount =
      C(
        31-i,
        remaining
      );


    if(r < zeroCount){

      result.push(0);

    }
    else{

      result.push(1);

      r -= zeroCount;

      remaining--;

    }

  }


  if(
    result.filter(v=>v===1).length !== 16
  ){

    throw new Error(
      "16/32変換エラー"
    );

  }


  return result;

}


/* =========================================================
   UTF-8 body
========================================================= */

function makeBody(text){

  const bytes =
    encodeUTF8(text);


  if(
    bytes.length >
    MAX_UTF8_BYTES
  ){

    throw new Error(
      "UTF-8データが60バイトを超えています"
    );

  }


  const padded =
    new Uint8Array(
      MAX_UTF8_BYTES
    );


  padded.set(bytes);


  const bits=[];


  for(
    let i=0;
    i<padded.length;
    i++
  ){

    for(
      let b=7;
      b>=0;
      b--
    ){

      bits.push(
        (padded[i] >> b) & 1
      );

    }

  }


  return bits;

}


/* =========================================================
   パケット
========================================================= */

function makePacket(text){

  const count =
    characterCount(text);


  if(count > MAX_CHARS){

    throw new Error(
      "30文字を超えています"
    );

  }


  const body =
    makeBody(text);


  const lengthBits=[];


  for(let b=4;b>=0;b--){

    lengthBits.push(
      (count >> b) & 1
    );

  }


  const crc =
    crc8(body);


  const crcBits=[];


  for(let b=7;b>=0;b--){

    crcBits.push(
      (crc >> b) & 1
    );

  }


  const packet=[
    ...lengthBits,
    ...body,
    ...crcBits
  ];


  if(
    packet.length !== PACKET_BITS
  ){

    throw new Error(
      "493bitパケットになっていません"
    );

  }


  return packet;

}


/* =========================================================
   エンコード
========================================================= */

function encode(text){

  const packet =
    makePacket(text);


  const output=[];


  for(
    let group=0;
    group<GROUP_COUNT;
    group++
  ){

    const chunk =
      packet.slice(
        group * GROUP_BITS,
        group * GROUP_BITS + GROUP_BITS
      );


    const value =
      bitsToNumber(chunk);


    const groupBits =
      unrank(value);


    output.push(
      ...groupBits
    );

  }


  if(
    output.length !== SLOT_BITS
  ){

    throw new Error(
      "544bitになっていません"
    );

  }


  return output;

}


/* =========================================================
   図形
========================================================= */

function getShape(i){

  let size;

  if(i % 23 === 0){

    size=18;

  }
  else if(i % 13 === 0){

    size=16;

  }
  else if(i % 7 === 0){

    size=15;

  }
  else{

    size=
      11 + (i % 3);

  }

  return {
    type:i%5,
    size
  };

}


/* =========================================================
   マーカー
========================================================= */

const MARKERS = [

  {
    x:255,
    y:275
  },

  {
    x:1245,
    y:275
  },

  {
    x:255,
    y:1245
  }

];


/* =========================================================
   マーカーとの距離
========================================================= */

function tooCloseToMarker(x,y){

  for(const m of MARKERS){

    const dx =
      x-m.x;

    const dy =
      y-m.y;


    if(
      Math.sqrt(
        dx*dx+dy*dy
      ) <
      MARKER_EXCLUSION
    ){

      return true;

    }

  }

  return false;

}


/* =========================================================
   固定スロット
========================================================= */

function createSlots(){

  seed=9283746;


  for(
    const minDistance of DISTANCES
  ){

    const candidates=[];


    for(let i=0;i<30000;i++){

      const angle =
        random() *
        Math.PI * 2;


      const radius =
        Math.sqrt(random()) *
        (MAX_R-MIN_R) +
        MIN_R;


      const x =
        CENTER +
        Math.cos(angle) *
        radius;


      const y =
        CENTER +
        Math.sin(angle) *
        radius;


      const dx =
        x-CENTER;

      const dy =
        y-CENTER;


      const r =
        Math.sqrt(
          dx*dx+dy*dy
        );


      if(
        r < MIN_R ||
        r > MAX_R
      ){

        continue;

      }


      if(
        tooCloseToMarker(x,y)
      ){

        continue;

      }


      candidates.push({
        x,
        y,
        angle,
        radius
      });

    }


    for(
      let i=candidates.length-1;
      i>0;
      i--
    ){

      const j =
        Math.floor(
          random()*(i+1)
        );


      [
        candidates[i],
        candidates[j]
      ]=[
        candidates[j],
        candidates[i]
      ];

    }


    const selected=[];


    for(
      const p of candidates
    ){

      let valid=true;


      for(
        const q of selected
      ){

        const dx =
          p.x-q.x;

        const dy =
          p.y-q.y;


        if(
          dx*dx+dy*dy <
          minDistance*minDistance
        ){

          valid=false;

          break;

        }

      }


      if(!valid){

        continue;

      }


      selected.push(p);


      if(
        selected.length >=
        SLOT_COUNT
      ){

        break;

      }

    }


    if(
      selected.length >=
      SLOT_COUNT
    ){

      selected.length =
        SLOT_COUNT;


      return selected.map(
        (p,i)=>({

          x:p.x,
          y:p.y,

          type:
            getShape(i).type,

          size:
            getShape(i).size,

          color:
            COLORS[
              i%COLORS.length
            ]

        })
      );

    }

  }


  throw new Error(
    "スロットを作成できませんでした"
  );

}


/* =========================================================
   スロットは一度だけ生成
========================================================= */

let SLOTS;

try{

  SLOTS =
    createSlots();

}
catch(error){

  console.error(error);

}


/* =========================================================
   SVG
========================================================= */

function svgElement(name){

  return document.createElementNS(
    "http://www.w3.org/2000/svg",
    name
  );

}


/* =========================================================
   図形描画
========================================================= */

function drawShape(svg,s){

  const g =
    svgElement("g");


  const size =
    s.size;

  const color =
    s.color;


  if(s.type===0){

    const e =
      svgElement("circle");

    e.setAttribute(
      "cx",s.x
    );

    e.setAttribute(
      "cy",s.y
    );

    e.setAttribute(
      "r",size
    );

    e.setAttribute(
      "fill",color
    );

    g.appendChild(e);

  }


  else if(s.type===1){

    const e =
      svgElement("rect");

    e.setAttribute(
      "x",
      s.x-size
    );

    e.setAttribute(
      "y",
      s.y-size*.72
    );

    e.setAttribute(
      "width",
      size*2
    );

    e.setAttribute(
      "height",
      size*1.44
    );

    e.setAttribute(
      "rx",
      size*.5
    );

    e.setAttribute(
      "fill",color
    );

    g.appendChild(e);

  }


  else if(s.type===2){

    const e =
      svgElement("polygon");

    const h =
      size*1.35;


    e.setAttribute(
      "points",
      [
        `${s.x},${s.y-h}`,
        `${s.x-size},${s.y+h*.65}`,
        `${s.x+size},${s.y+h*.65}`
      ].join(" ")
    );

    e.setAttribute(
      "fill",color
    );

    g.appendChild(e);

  }


  else if(s.type===3){

    const e =
      svgElement("polygon");

    e.setAttribute(
      "points",
      [
        `${s.x},${s.y-size}`,
        `${s.x+size},${s.y}`,
        `${s.x},${s.y+size}`,
        `${s.x-size},${s.y}`
      ].join(" ")
    );

    e.setAttribute(
      "fill",color
    );

    g.appendChild(e);

  }


  else{

    const e =
      svgElement("rect");

    e.setAttribute(
      "x",
      s.x-size*1.25
    );

    e.setAttribute(
      "y",
      s.y-size*.55
    );

    e.setAttribute(
      "width",
      size*2.5
    );

    e.setAttribute(
      "height",
      size*1.1
    );

    e.setAttribute(
      "rx",
      size*.5
    );

    e.setAttribute(
      "fill",color
    );

    g.appendChild(e);

  }


  svg.appendChild(g);

}


/* =========================================================
   マーカー描画
========================================================= */

function drawMarkers(svg){

  for(
    const m of MARKERS
  ){

    const ring =
      svgElement("circle");


    ring.setAttribute(
      "cx",m.x
    );

    ring.setAttribute(
      "cy",m.y
    );

    ring.setAttribute(
      "r","38"
    );

    ring.setAttribute(
      "fill","#FFFDF5"
    );

    ring.setAttribute(
      "stroke","#51483F"
    );

    ring.setAttribute(
      "stroke-width","7"
    );


    svg.appendChild(ring);


    const inner =
      svgElement("circle");


    inner.setAttribute(
      "cx",m.x
    );

    inner.setAttribute(
      "cy",m.y
    );

    inner.setAttribute(
      "r","18"
    );

    inner.setAttribute(
      "fill","none"
    );

    inner.setAttribute(
      "stroke","#51483F"
    );

    inner.setAttribute(
      "stroke-width","6"
    );


    svg.appendChild(inner);


    const dot =
      svgElement("circle");


    dot.setAttribute(
      "cx",m.x
    );

    dot.setAttribute(
      "cy",m.y
    );

    dot.setAttribute(
      "r","5"
    );

    dot.setAttribute(
      "fill","#51483F"
    );


    svg.appendChild(dot);

  }

}


/* =========================================================
   中央ポテちゃん
========================================================= */

function drawPote(svg){

  const pote =
    svgElement("g");


  const body =
    svgElement("circle");


  body.setAttribute(
    "cx","750"
  );

  body.setAttribute(
    "cy","750"
  );

  body.setAttribute(
    "r","78"
  );

  body.setAttribute(
    "fill","#D99A3D"
  );


  pote.appendChild(body);


  for(
    const x of [725,775]
  ){

    const eye =
      svgElement("circle");


    eye.setAttribute(
      "cx",x
    );

    eye.setAttribute(
      "cy","748"
    );

    eye.setAttribute(
      "r","5"
    );

    eye.setAttribute(
      "fill","#51483F"
    );


    pote.appendChild(eye);

  }


  const mouth =
    svgElement("path");


  mouth.setAttribute(
    "d",
    "M735 770 Q750 782 765 770"
  );

  mouth.setAttribute(
    "fill","none"
  );

  mouth.setAttribute(
    "stroke","#51483F"
  );

  mouth.setAttribute(
    "stroke-width","5"
  );

  mouth.setAttribute(
    "stroke-linecap","round"
  );


  pote.appendChild(mouth);


  svg.appendChild(pote);

}


/* =========================================================
   SVG生成
========================================================= */

function createSVG(text){

  const bits =
    encode(text);


  const svg =
    document.getElementById("svg");


  svg.innerHTML="";


  const bg =
    svgElement("rect");


  bg.setAttribute(
    "x","0"
  );

  bg.setAttribute(
    "y","0"
  );

  bg.setAttribute(
    "width",SIZE
  );

  bg.setAttribute(
    "height",SIZE
  );

  bg.setAttribute(
    "fill","#FFFDF7"
  );


  svg.appendChild(bg);


  const outer =
    svgElement("circle");


  outer.setAttribute(
    "cx",CENTER
  );

  outer.setAttribute(
    "cy",CENTER
  );

  outer.setAttribute(
    "r","680"
  );

  outer.setAttribute(
    "fill","none"
  );

  outer.setAttribute(
    "stroke","#D7CAB0"
  );

  outer.setAttribute(
    "stroke-width","2"
  );

  outer.setAttribute(
    "opacity",".3"
  );


  svg.appendChild(outer);


  for(
    let i=0;
    i<SLOT_COUNT;
    i++
  ){

    if(bits[i]!==1){

      continue;

    }


    drawShape(
      svg,
      SLOTS[i]
    );

  }


  drawMarkers(svg);

  drawPote(svg);

}


/* =========================================================
   生成ボタン
========================================================= */

document
.getElementById("generate")
.addEventListener(
  "click",
  ()=>{

    const text =
      document.getElementById("text").value;

    const status =
      document.getElementById("status");


    if(!text){

      status.textContent =
        "文字を入力してください";

      return;

    }


    if(
      characterCount(text)>MAX_CHARS
    ){

      status.textContent =
        "30文字以内で入力してください";

      return;

    }


    try{

      const bytes =
        encodeUTF8(text);


      if(
        bytes.length>
        MAX_UTF8_BYTES
      ){

        status.textContent =
          "UTF-8データが60バイトを超えています";

        return;

      }


      createSVG(text);


      status.textContent =
        "生成しました";

    }
    catch(error){

      console.error(error);

      status.textContent =
        error.message ||
        "生成に失敗しました";

    }

  }
);


/* =========================================================
   初期表示
========================================================= */

try{

  createSVG("POTE");

}
catch(error){

  console.error(error);

  document
    .getElementById("status")
    .textContent =
      "生成に失敗しました";

}

</script>

</body>
</html>
