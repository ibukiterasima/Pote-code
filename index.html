<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポテコード</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#eee4d0;
  color:#49372a;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

.wrap{
  width:min(720px,94vw);
  margin:auto;
  padding:24px 0 50px;
}

h1{
  text-align:center;
  margin:0 0 6px;
  font-size:32px;
}

.subtitle{
  text-align:center;
  margin-bottom:20px;
  opacity:.65;
}

textarea{
  width:100%;
  height:120px;
  resize:vertical;
  border:3px solid #76543b;
  border-radius:18px;
  background:#fffaf0;
  padding:15px;
  font-size:17px;
  color:#49372a;
  outline:none;
}

button{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:16px;
  background:#76543b;
  color:#fff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.card{
  margin-top:22px;
  padding:16px;
  border-radius:25px;
  background:#fffaf0;
  box-shadow:0 8px 25px #0002;
}

/* =================================
   ポテコード
================================= */

#code{
  position:relative;
  width:100%;
  max-width:600px;
  aspect-ratio:1;
  margin:auto;

  background:#ead8b8;

  border-radius:50%;

  overflow:hidden;

  box-shadow:
    inset 0 0 0 7px #d0b58c,
    inset 0 0 35px #0001;
}

/* =================================
   基準マーク
================================= */

.marker{
  position:absolute;
  width:27px;
  height:27px;
  background:#3d3027;
  z-index:4;
}

.marker.m1{
  left:7%;
  top:7%;
  border-radius:7px;
}

.marker.m2{
  right:7%;
  top:7%;
  border-radius:50%;
}

.marker.m3{
  left:7%;
  bottom:7%;

  clip-path:polygon(
    50% 0,
    100% 50%,
    50% 100%,
    0 50%
  );
}

.marker.m4{
  right:7%;
  bottom:7%;
  border-radius:7px;
  transform:rotate(45deg);
}

/* =================================
   データ図形
================================= */

.shape{
  position:absolute;
  transform:translate(-50%,-50%);
  z-index:2;
}

/* 丸 */
.circle{
  border-radius:50%;
}

/* 四角 */
.square{
  border-radius:5px;
}

/* ひし形 */
.diamond{
  border-radius:4px;
  transform:
    translate(-50%,-50%)
    rotate(45deg);
}

/* 六角形 */
.hex{
  clip-path:polygon(
    25% 0,
    75% 0,
    100% 50%,
    75% 100%,
    25% 100%,
    0 50%
  );
}

/* 三角 */
.triangle{
  width:0!important;
  height:0!important;

  background:transparent!important;

  border-left:11px solid transparent;
  border-right:11px solid transparent;
  border-bottom:21px solid currentColor;
}

/* 星 */
.star{
  background:transparent!important;

  clip-path:polygon(
    50% 0,
    61% 36%,
    100% 36%,
    69% 58%,
    81% 100%,
    50% 74%,
    19% 100%,
    31% 58%,
    0 36%,
    39% 36%
  );
}

/* 十字 */
.cross{
  clip-path:polygon(
    35% 0,
    65% 0,
    65% 35%,
    100% 35%,
    100% 65%,
    65% 65%,
    65% 100%,
    35% 100%,
    35% 65%,
    0 65%,
    0 35%,
    35% 35%
  );
}

/* しずく */
.drop{
  border-radius:60% 40% 60% 40%;

  transform:
    translate(-50%,-50%)
    rotate(45deg);
}

/* 花型 */
.flower{
  clip-path:polygon(
    50% 0,
    65% 28%,
    100% 25%,
    75% 50%,
    100% 75%,
    65% 72%,
    50% 100%,
    35% 72%,
    0 75%,
    25% 50%,
    0 25%,
    35% 28%
  );
}

/* =================================
   中央ポテちゃん
   ※これは完全固定のマーク
================================= */

.pote{
  position:absolute;

  left:50%;
  top:50%;

  width:48px;
  height:58px;

  transform:translate(-50%,-50%);

  background:#9b653c;

  border-radius:
    48% 52% 46% 54% /
    54% 47% 53% 46%;

  box-shadow:
    inset -4px -6px 0 #80502f,
    inset 4px 4px 0 #b47747,
    0 3px 7px #0003;

  z-index:10;
}

/* ポテちゃんの目 */

.eye{
  position:absolute;

  top:20px;

  width:6px;
  height:9px;

  background:#302017;

  border-radius:50%;
}

.eye.left{
  left:13px;
}

.eye.right{
  right:13px;
}

/* 口 */

.mouth{
  position:absolute;

  left:50%;
  top:34px;

  width:11px;
  height:6px;

  transform:translateX(-50%);

  border-bottom:2px solid #302017;

  border-radius:50%;
}

/* =================================
   下部
================================= */

.result{
  margin-top:15px;
  padding:12px;

  border-radius:12px;

  background:#eee4d0;

  font-size:13px;

  word-break:break-all;
}

.capacity{
  margin-top:8px;

  text-align:center;

  font-size:12px;

  opacity:.6;
}
</style>
</head>

<body>

<div class="wrap">

<h1>🥔 ポテコード</h1>

<div class="subtitle">
カラフルな図形に文字を隠そう
</div>

<textarea
  id="text"
  placeholder="文字やURLを入力

例：
https://x.gd/Ab12
ポテちゃんこんにちは！
POTE-123
"></textarea>

<button onclick="makeCode()">
ポテコードを作る
</button>

<div class="card">

<div id="code">

  <!-- 固定マーカー -->
  <div class="marker m1"></div>
  <div class="marker m2"></div>
  <div class="marker m3"></div>
  <div class="marker m4"></div>

  <!--
    中央ポテちゃん

    手なし
    葉っぱなし
    帽子なし

    完全に固定されたロゴマーク
  -->
  <div class="pote">

    <div class="eye left"></div>
    <div class="eye right"></div>

    <div class="mouth"></div>

  </div>

</div>

<div class="result">
  <b>入力：</b>
  <span id="result">---</span>
</div>

<div
  class="capacity"
  id="capacity">
  まだポテコードは作られていません
</div>

</div>

</div>

<script>

/* =========================================
   読み取りやすい色
========================================= */

const COLORS=[

  "#315f42", // 緑
  "#24577a", // 青
  "#744a8b", // 紫
  "#9a542f", // 茶
  "#a43838", // 赤
  "#876d20", // 黄土
  "#356b70", // 青緑
  "#6f405c"  // 赤紫

];


/* =========================================
   図形
========================================= */

const SHAPES=[

  "circle",
  "square",
  "diamond",
  "hex",
  "triangle",
  "star",
  "cross",
  "drop",
  "flower"

];


/* =========================================
   固定スロット
========================================= */

function createSlots(){

  const slots=[];

  const rings=[

    {r:44,n:24},
    {r:37,n:22},
    {r:30,n:18},
    {r:23,n:14},
    {r:17,n:10}

  ];

  for(const ring of rings){

    for(let i=0;i<ring.n;i++){

      const angle=
        i/ring.n*Math.PI*2;

      const x=
        50+
        Math.cos(angle)*ring.r;

      const y=
        50+
        Math.sin(angle)*ring.r;

      /*
        中央のポテちゃんを
        図形が邪魔しないようにする
      */

      const dx=x-50;
      const dy=y-50;

      if(
        Math.sqrt(dx*dx+dy*dy)>10
      ){

        slots.push({
          x:x,
          y:y
        });

      }

    }

  }

  return slots;
}

const slots=createSlots();


/* =========================================
   UTF-8
========================================= */

function encodeUTF8(text){

  return new TextEncoder().encode(text);

}


/* =========================================
   1バイトを4つの値にする
========================================= */

function toSymbols(bytes){

  const result=[];

  for(const byte of bytes){

    result.push((byte>>6)&3);
    result.push((byte>>4)&3);
    result.push((byte>>2)&3);
    result.push(byte&3);

  }

  return result;

}


/* =========================================
   入力から固定した数値を作る
========================================= */

function hash(text){

  let h=2166136261;

  for(let i=0;i<text.length;i++){

    h^=text.charCodeAt(i);

    h+=
      (h<<1)+
      (h<<4)+
      (h<<7)+
      (h<<8)+
      (h<<24);

  }

  return Math.abs(h>>>0);

}


/* =========================================
   ポテコード生成
========================================= */

function makeCode(){

  const text=
    document.getElementById("text").value;

  if(!text){

    alert("文字を入力してね！");
    return;

  }

  const code=
    document.getElementById("code");


  /*
    古い図形を削除
  */

  code
    .querySelectorAll(".shape")
    .forEach(e=>e.remove());


  const bytes=
    encodeUTF8(text);

  const symbols=
    toSymbols(bytes);

  const seed=
    hash(text);


  /*
    容量チェック
  */

  if(symbols.length>slots.length){

    alert(
      "文字が多すぎます！\n\n"+
      "短い x.gd URL を使うと、"+
      "より多くの情報を入れられます。"
    );

    return;

  }


  /*
    図形を配置
  */

  symbols.forEach((symbol,i)=>{

    const slot=
      slots[i];

    const d=
      document.createElement("div");


    /*
      図形を選ぶ
    */

    const shapeIndex=
      (
        seed+
        i*7+
        symbol*5
      )%SHAPES.length;


    const shape=
      SHAPES[shapeIndex];


    d.classList.add(
      "shape",
      shape
    );


    /*
      色を選ぶ
    */

    const colorIndex=
      (
        seed+
        i*11+
        symbol*3
      )%COLORS.length;

    const color=
      COLORS[colorIndex];


    d.style.background=
      color;

    d.style.color=
      color;


    /*
      大きさ

      多少変化するが、
      全体として統一感を保つ。
    */

    const size=
      15+
      ((seed+i*3)%8);


    d.style.width=
      size+"px";

    d.style.height=
      size+"px";


    /*
      回転

      三角・ひし形・しずく以外
    */

    if(
      shape!=="triangle" &&
      shape!=="diamond" &&
      shape!=="drop"
    ){

      d.style.transform=
        `translate(-50%,-50%)
         rotate(${(seed+i*17)%360}deg)`;

    }


    /*
      固定位置
    */

    d.style.left=
      slot.x+"%";

    d.style.top=
      slot.y+"%";


    code.appendChild(d);

  });


  /*
    入力表示
  */

  document.getElementById("result")
    .textContent=text;


  /*
    容量表示
  */

  document.getElementById("capacity")
    .textContent=
      `使用 ${symbols.length} / ${slots.length} スロット`;

}

</script>

</body>
</html>
