function el(name,attrs={}){

  const e =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      name
    );

  for(const k in attrs){
    e.setAttribute(k,attrs[k]);
  }

  return e;
}


/* ---------------------------------------------------------
   円
--------------------------------------------------------- */

function circle(x,y,r,color){

  svg.appendChild(
    el("circle",{
      cx:x,
      cy:y,
      r:r,
      fill:color
    })
  );

}


/* ---------------------------------------------------------
   四角
--------------------------------------------------------- */

function rect(
  x,y,w,h,color,
  radius=9,
  rotate=0
){

  const e =
    el("rect",{
      x:x-w/2,
      y:y-h/2,
      width:w,
      height:h,
      rx:radius,
      fill:color
    });

  if(rotate){

    e.setAttribute(
      "transform",
      `rotate(${rotate} ${x} ${y})`
    );

  }

  svg.appendChild(e);

}


/* ---------------------------------------------------------
   三角
--------------------------------------------------------- */

function triangle(
  x,y,size,color,rotate=0
){

  const e =
    el("polygon",{

      points:
        `${x},${y-size} `+
        `${x+size},${y+size} `+
        `${x-size},${y+size}`,

      fill:color
    });

  if(rotate){

    e.setAttribute(
      "transform",
      `rotate(${rotate} ${x} ${y})`
    );

  }

  svg.appendChild(e);

}


/* ---------------------------------------------------------
   ダイヤ
--------------------------------------------------------- */

function diamond(x,y,size,color){

  svg.appendChild(
    el("polygon",{

      points:
        `${x},${y-size} `+
        `${x+size},${y} `+
        `${x},${y+size} `+
        `${x-size},${y}`,

      fill:color
    })
  );

}

/* =========================================================
   データ作成
========================================================= */

function makeData(text){

  const bytes =
    new TextEncoder()
      .encode(text);


  /*
    30文字を扱えるように、
    文字列をUTF-8で保存。

    そのままでは長いので、
    4bit単位にする。
  */

  const result=[];


  /*
    POTE HEADER
  */

  result.push(
    0x5,
    0x0,
    0x7,
    0xE
  );


  /*
    長さ
  */

  result.push(
    bytes.length & 15
  );


  /*
    本文
  */

  for(const b of bytes){

    result.push(
      b >> 4,
      b & 15
    );

  }


  /*
    残りを固定パターンで埋める。

    これによって、
    文章によってスカスカになることを防ぐ。
  */

  let seed=17;

  while(
    result.length <
    DATA.length
  ){

    seed =
      (seed*73+41)%16;

    result.push(seed);

  }


  return result.slice(
    0,
    DATA.length
  );

}


/* =========================================================
   データ図形描画
========================================================= */

function dataVisual(values){

  for(
    let i=0;
    i<DATA.length;
    i++
  ){

    const p=DATA[i];

    const value=
      values[i] ?? 0;


    /*
      データごとの色。

      ただし全体のパレットから
      大きく外れない。
    */

    const colors=[

      PALETTE.green,
      PALETTE.yellow,
      PALETTE.orange,
      PALETTE.blue,
      PALETTE.green2,
      PALETTE.orange2

    ];


    const color=
      colors[
        (value+i)%colors.length
      ];


    /*
      小さすぎない。
    */

    const size=
      8 +
      ((i*7)%5);


    /*
      図形タイプも固定パターン。
    */

    const type=i%6;


    if(type===0){

      circle(
        p[0],
        p[1],
        size,
        color
      );

    }

    else if(type===1){

      rect(
        p[0],
        p[1],
        size*2,
        size*2,
        color,
        4
      );

    }

    else if(type===2){

      triangle(
        p[0],
        p[1],
        size,
        color
      );

    }

    else if(type===3){

      diamond(
        p[0],
        p[1],
        size,
        color
      );

    }

    else if(type===4){

      rect(
        p[0],
        p[1],
        size*2.3,
        size*1.35,
        color,
        4
      );

    }

    else{

      circle(
        p[0],
        p[1],
        size*.85,
        color
      );

    }

  }

}

/* =========================================================
   生成
========================================================= */

function makePoteCode(){

  const text =
    document
      .getElementById("input")
      .value;


  if(!text){

    alert("文字を入力してください。");
    return;

  }


  const chars =
    Array.from(text);


  if(chars.length>30){

    alert("30文字までです。");
    return;

  }


  /*
    全消去
  */

  while(svg.firstChild){

    svg.removeChild(
      svg.firstChild
    );

  }


  /*
    描画順

    背景
    ↓
    大きな図形
    ↓
    データ図形
    ↓
    小さい装飾
    ↓
    ポテちゃん
    ↓
    外周
  */

  background();

  largeVisual();

  dataVisual(
    makeData(text)
  );

  smallVisual();

  pote();

  outer();


  document
    .getElementById("info")
    .textContent =
      `${chars.length}文字 / `+
      `ポテコード生成済み`;


  document
    .getElementById("result")
    .textContent =
      "✓ ポテコード生成完了";
}
