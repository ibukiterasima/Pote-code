<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>POTE CODE</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#faf7ee;
  color:#574d41;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.app{
  width:min(720px,100%);
  margin:auto;
  padding:24px 16px 50px;
}

h1{
  text-align:center;
  margin:5px 0 3px;
  font-size:31px;
  letter-spacing:5px;
}

.subtitle{
  text-align:center;
  font-size:12px;
  opacity:.5;
  margin-bottom:22px;
}

.panel{
  background:#fffdf8;
  border:1px solid #e2d8c7;
  border-radius:27px;
  padding:18px;
  box-shadow:
    0 10px 35px rgba(80,60,30,.08);
}

textarea{
  width:100%;
  height:105px;
  resize:none;

  padding:14px;

  border-radius:16px;
  border:2px solid #ded4c2;

  outline:none;

  background:#fffefa;

  font-size:16px;
  line-height:1.5;

  color:#554b40;
}

textarea:focus{
  border-color:#759c78;
}

.counter{
  text-align:right;
  font-size:12px;
  opacity:.5;
  margin-top:5px;
}

button{
  width:100%;
  margin-top:11px;

  padding:15px;

  border:0;
  border-radius:16px;

  background:#759c78;
  color:white;

  font-size:15px;
  font-weight:bold;

  cursor:pointer;
}

button.secondary{
  background:#e8dfd0;
  color:#554b40;
}

#output{
  margin-top:20px;

  width:100%;

  display:flex;
  justify-content:center;
}

#output svg{
  width:100%;
  max-width:680px;
  height:auto;
}

.info{
  text-align:center;
  margin-top:12px;

  font-size:11px;
  line-height:1.6;

  opacity:.5;
}
</style>
</head>


<body>

<div class="app">

<h1>POTE CODE</h1>

<div class="subtitle">
COLORFUL GEOMETRIC CODE
</div>

<div class="panel">

<textarea
  id="text"
  maxlength="50"
  placeholder="50文字まで入力できます
例：ポテちゃんのお店 001"></textarea>

<div class="counter">
<span id="count">0</span> / 50
</div>

<button onclick="generate()">
POTE CODEを生成
</button>

<button
  class="secondary"
  onclick="saveSVG()">
SVGを保存
</button>

<div id="output"></div>

<div class="info">
図形がある＝1<br>
図形がない＝0<br>
英数・日本語 最大50文字対応
</div>

</div>

</div>


<script>

/* =====================================================
   POTE CODE
   PRESENCE / ABSENCE EDITION
   ===================================================== */


/* -----------------------------------------------------
   色
----------------------------------------------------- */

const COLORS = [
  "#78a979",
  "#9abd72",
  "#e4a52f",
  "#d68d43",
  "#5f90a4",
  "#78a394",
  "#b77c42",
  "#6d936d"
];


/* -----------------------------------------------------
   現在のSVG
----------------------------------------------------- */

let currentSVG = "";


/* -----------------------------------------------------
   文字数表示
----------------------------------------------------- */

const textBox =
  document.getElementById("text");

const count =
  document.getElementById("count");

textBox.addEventListener(
  "input",
  ()=>{
    count.textContent =
      [...textBox.value].length;
  }
);


/* =====================================================
   16bitデータ化
   ===================================================== */

/*
   日本語を含めるため、
   JavaScriptのUTF-16コード単位を使う。

   50文字
   × 16bit
   = 800bit

   英数も日本語も同じ規格で扱える。
*/

function textTo16Bits(text){

  const chars =
    [...text];

  if(chars.length > 50){
    return null;
  }

  const bits = [];


  /*
    先頭6bit
    → 文字数
  */

  for(let i=5;i>=0;i--){

    bits.push(
      (chars.length >> i) & 1
    );

  }


  /*
    各文字16bit
  */

  for(const char of chars){

    const code =
      char.charCodeAt(0);

    for(let i=15;i>=0;i--){

      bits.push(
        (code >> i) & 1
      );

    }

  }


  /*
    CRC16
  */

  const crc =
    crc16(chars);


  for(let i=15;i>=0;i--){

    bits.push(
      (crc >> i) & 1
    );

  }


  return bits;
}


/* =====================================================
   CRC16
===================================================== */

function crc16(chars){

  let crc = 0xFFFF;

  for(const char of chars){

    const code =
      char.charCodeAt(0);

    crc ^= code;

    for(let i=0;i<16;i++){

      if(crc & 1){

        crc =
          (crc >> 1) ^
          0xA001;

      }else{

        crc >>= 1;

      }

    }

  }

  return crc & 0xFFFF;
}


/* =====================================================
   固定スロット
===================================================== */

/*
   ここがPOTE CODEの「見えないマス」。

   実際には四角いマスではなく、
   円形に並んだ「図形の候補位置」。

   図形があれば1
   なければ0
*/


function createSlots(){

  const slots = [];


  /*
   * 内側
   */

  const innerCount = 72;

  for(let i=0;i<innerCount;i++){

    const angle =
      -Math.PI/2 +
      i *
      Math.PI*2 /
      innerCount;

    const radius =
      205 +
      Math.sin(i*2.3)*9;

    slots.push({

      x:
        500 +
        Math.cos(angle)*radius,

      y:
        500 +
        Math.sin(angle)*radius,

      ring:0

    });

  }


  /*
   * 中間
   */

  const middleCount = 180;

  for(let i=0;i<middleCount;i++){

    const angle =
      -Math.PI/2 +
      i *
      Math.PI*2 /
      middleCount;

    const radius =
      300 +
      Math.sin(i*1.7)*13;

    slots.push({

      x:
        500 +
        Math.cos(angle)*radius,

      y:
        500 +
        Math.sin(angle)*radius,

      ring:1

    });

  }


  /*
   * 外側
   */

  const outerCount = 300;

  for(let i=0;i<outerCount;i++){

    const angle =
      -Math.PI/2 +
      i *
      Math.PI*2 /
      outerCount;

    const radius =
      395 +
      Math.sin(i*1.37)*15;

    slots.push({

      x:
        500 +
        Math.cos(angle)*radius,

      y:
        500 +
        Math.sin(angle)*radius,

      ring:2

    });

  }


  /*
   * さらに外側の散らし
   */

  const outer2Count = 300;

  for(let i=0;i<outer2Count;i++){

    const angle =
      -Math.PI/2 +
      i *
      Math.PI*2 /
      outer2Count;

    const radius =
      435 +
      Math.sin(i*2.11)*10;

    slots.push({

      x:
        500 +
        Math.cos(angle)*radius,

      y:
        500 +
        Math.sin(angle)*radius,

      ring:3

    });

  }


  return slots;
}


/* =====================================================
   決定論的乱数
===================================================== */

function randomGenerator(seed){

  return function(){

    seed += 0x6D2B79F5;

    let t = seed;

    t =
      Math.imul(
        t ^ (t >>> 15),
        t | 1
      );

    t ^= t +
      Math.imul(
        t ^ (t >>> 7),
        t | 61
      );

    return (
      (t ^ (t >>> 14))
      >>> 0
    ) / 4294967296;

  };

}


/* =====================================================
   ハッシュ
===================================================== */

function hashString(text){

  let h = 2166136261;

  for(let i=0;i<text.length;i++){

    h ^= text.charCodeAt(i);

    h =
      Math.imul(
        h,
        16777619
      );

  }

  return h >>> 0;
}


/* =====================================================
   図形
===================================================== */

function drawShape(
  type,
  x,
  y,
  size,
  color,
  rotation
){

  /*
   * ○
   */

  if(type === 0){

    return `
      <circle
        cx="${x}"
        cy="${y}"
        r="${size/2}"
        fill="${color}"
      />
    `;

  }


  /*
   * △
   */

  if(type === 1){

    const h =
      size * 0.866;

    return `
      <polygon
        points="
          ${x},${y-h/2}
          ${x+size/2},${y+h/2}
          ${x-size/2},${y+h/2}
        "
        fill="${color}"
        transform="
          rotate(
            ${rotation}
            ${x}
            ${y}
          )
        "
      />
    `;

  }


  /*
   * □
   */

  if(type === 2){

    return `
      <rect
        x="${x-size/2}"
        y="${y-size/2}"
        width="${size}"
        height="${size}"
        rx="${size*0.12}"
        fill="${color}"
        transform="
          rotate(
            ${rotation}
            ${x}
            ${y}
          )
        "
      />
    `;

  }


  /*
   * ◇
   */

  return `
    <polygon
      points="
        ${x},${y-size/2}
        ${x+size/2},${y}
        ${x},${y+size/2}
        ${x-size/2},${y}
      "
      fill="${color}"
      transform="
        rotate(
          ${rotation}
          ${x}
          ${y}
        )
      "
    />
  `;

}


/* =====================================================
   ポテちゃん
===================================================== */

function drawPote(){

  return `

    <g>

      <path
        d="
          M500 380
          C442 370 400 415 392 480
          C382 550 408 613 478 628
          C550 643 606 600 612 530
          C618 454 575 392 500 380
          Z
        "
        fill="#b8793d"
      />

      <circle
        cx="466"
        cy="490"
        r="10"
        fill="#574b3c"
      />

      <circle
        cx="534"
        cy="490"
        r="10"
        fill="#574b3c"
      />

      <path
        d="
          M475 535
          Q500 552 525 535
        "
        fill="none"
        stroke="#574b3c"
        stroke-width="7"
        stroke-linecap="round"
      />

      <circle
        cx="430"
        cy="460"
        r="5"
        fill="#9c632f"
        opacity=".4"
      />

      <circle
        cx="570"
        cy="560"
        r="5"
        fill="#9c632f"
        opacity=".4"
      />

    </g>

  `;
}


/* =====================================================
   中央リング
===================================================== */

function drawCenterRing(){

  let out = "";

  const colors = [
    "#e4a52f",
    "#d58c42",
    "#e3a02d",
    "#d78e43",
    "#e2a32f",
    "#d88e42",
    "#e3a42e",
    "#d68c42"
  ];


  for(let i=0;i<8;i++){

    const angle =
      -Math.PI/2 +
      i*Math.PI/4;

    const x =
      500 +
      Math.cos(angle)*155;

    const y =
      500 +
      Math.sin(angle)*155;

    out +=
      drawShape(
        1,
        x,
        y,
        42,
        colors[i],
        i*45+90
      );

  }

  return out;
}


/* =====================================================
   Finder
===================================================== */

function drawFinder(){

  return `

    <g>

      <polygon
        points="
          850,805
          895,850
          850,895
          805,850
        "
        fill="#91b875"
      />

      <circle
        cx="850"
        cy="850"
        r="9"
        fill="#e4a52f"
      />

    </g>

  `;
}


/* =====================================================
   GENERATE
===================================================== */

function generate(){

  const text =
    textBox.value;


  if(!text){

    alert(
      "文字を入力してください。"
    );

    return;
  }


  const chars =
    [...text];


  if(chars.length > 50){

    alert(
      "50文字までです。"
    );

    return;
  }


  /*
    データ
  */

  const bits =
    textTo16Bits(text);


  /*
    固定候補位置
  */

  const slots =
    createSlots();


  /*
    乱数

    これは「ある/ない」を
    データから決めるものではない。

    装飾部分だけに使う。
  */

  const random =
    randomGenerator(
      hashString(text)
    );


  let shapes = "";


  /*
    ---------------------------------------------
    データ部分
    ---------------------------------------------

    1 = 図形あり
    0 = 図形なし

    これがPOTE CODEの本体。
  */


  for(
    let i=0;
    i<bits.length;
    i++
  ){

    if(bits[i] !== 1){

      continue;
    }


    const slot =
      slots[i];


    if(!slot){

      break;
    }


    let size;


    if(slot.ring === 0){

      size =
        30 +
        random()*12;

    }else if(slot.ring === 1){

      size =
        30 +
        random()*18;

    }else{

      size =
        27 +
        random()*22;

    }


    const color =
      COLORS[
        Math.floor(
          random() *
          COLORS.length
        )
      ];


    const rotation =
      random()*360;


    const type =
      Math.floor(
        random()*4
      );


    shapes +=
      drawShape(
        type,
        slot.x,
        slot.y,
        size,
        color,
        rotation
      );

  }


  /*
    ---------------------------------------------
    装飾図形
    ---------------------------------------------

    データとは無関係。

    ただし、
    データの図形と同じ場所には
    絶対に置かない。
  */

  const used =
    bits.length;


  for(
    let i=used;
    i<slots.length;
    i++
  ){

    /*
      全部埋めない。

      ところどころだけ
      装飾を置く。
    */

    if(random() > 0.34){

      continue;
    }


    const slot =
      slots[i];


    let size =
      22 +
      random()*25;


    const color =
      COLORS[
        Math.floor(
          random()*COLORS.length
        )
      ];


    const type =
      Math.floor(
        random()*4
      );


    const rotation =
      random()*360;


    shapes +=
      drawShape(
        type,
        slot.x,
        slot.y,
        size,
        color,
        rotation
      );

  }


  /*
    SVG
  */

  currentSVG = `

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 1000">

  <rect
    width="1000"
    height="1000"
    rx="55"
    fill="#fffaf0"
  />


  <circle
    cx="500"
    cy="500"
    r="466"
    fill="none"
    stroke="#eee4d4"
    stroke-width="3"
  />


  <!--
    POTE CODE DATA

    図形あり = 1
    図形なし = 0
  -->

  ${shapes}


  <!-- center decoration -->

  ${drawCenterRing()}


  <!-- POTE -->

  ${drawPote()}


  <!-- subtle finder -->

  ${drawFinder()}

</svg>
`;


  document.getElementById(
    "output"
  ).innerHTML =
    currentSVG;

}


/* =====================================================
   SVG保存
===================================================== */

function saveSVG(){

  if(!currentSVG){

    alert(
      "先にPOTE CODEを生成してください。"
    );

    return;
  }


  const blob =
    new Blob(
      [currentSVG],
      {
        type:"image/svg+xml"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "pote-code.svg";


  a.click();


  URL.revokeObjectURL(url);

}

</script>

</body>
</html>
