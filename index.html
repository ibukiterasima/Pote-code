<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>POTE CODE</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#faf7ef;
  color:#554b40;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.app{
  width:min(720px,100%);
  margin:auto;
  padding:28px 18px 50px;
}

h1{
  margin:8px 0 4px;
  text-align:center;
  letter-spacing:5px;
  font-size:32px;
}

.sub{
  text-align:center;
  font-size:12px;
  opacity:.5;
  margin-bottom:25px;
}

.panel{
  background:#fffdf8;
  border:1px solid #e0d7c8;
  border-radius:28px;
  padding:18px;
  box-shadow:0 12px 40px rgba(80,60,30,.08);
}

input{
  width:100%;
  padding:15px;
  border:2px solid #ded5c5;
  border-radius:16px;
  background:#fffefa;
  font-size:16px;
  color:#51483d;
  outline:none;
}

input:focus{
  border-color:#739b78;
}

button{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:16px;
  background:#739b78;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:#e7dfd1;
  color:#51483d;
}

#output{
  margin-top:20px;
  display:flex;
  justify-content:center;
}

svg{
  width:100%;
  max-width:650px;
  height:auto;
}

.info{
  text-align:center;
  font-size:12px;
  opacity:.5;
  margin-top:12px;
}
</style>
</head>


<body>

<div class="app">

<h1>POTE CODE</h1>

<div class="sub">
BEAUTIFUL CODE
</div>

<div class="panel">

<input
  id="input"
  type="text"
  placeholder="文字を入力"
/>

<button onclick="generate()">
POTE CODEを生成
</button>

<button
  class="secondary"
  onclick="saveSVG()">
SVGを保存
</button>

<div id="output"></div>

<div class="info">
同じ文字からは同じPOTE CODEが生成されます
</div>

</div>

</div>


<script>

/* =================================================
   POTE CODE BEAUTIFUL v2
   ================================================= */


/* ---------- 基本 ---------- */

const W = 1000;

const COLORS = [
  "#76a879",
  "#8fb77a",
  "#e1a536",
  "#d28b46",
  "#5d8da1",
  "#7aa493",
  "#b78b55",
  "#78966d"
];

let currentSVG = "";


/* ---------- 文字列 → UTF8 ---------- */

function bytes(text){

  return Array.from(
    new TextEncoder().encode(text)
  );

}


/* ---------- hash ---------- */

function hash(text){

  let h = 2166136261;

  for(let i=0;i<text.length;i++){

    h ^= text.charCodeAt(i);

    h =
      Math.imul(
        h,
        16777619
      );

  }

  return h >>> 0;
}


/* ---------- deterministic random ---------- */

function rng(seed){

  return function(){

    seed += 0x6D2B79F5;

    let t = seed;

    t =
      Math.imul(
        t ^ (t >>> 15),
        t | 1
      );

    t ^= t +
      Math.imul(
        t ^ (t >>> 7),
        t | 61
      );

    return (
      (t ^ (t >>> 14))
      >>> 0
    ) / 4294967296;

  };

}


/* =================================================
   DATA
   ================================================= */

function crc8(data){

  let crc = 0;

  for(const b of data){

    crc ^= b;

    for(let i=0;i<8;i++){

      if(crc & 128){

        crc =
          ((crc << 1) ^ 7) & 255;

      }else{

        crc =
          (crc << 1) & 255;

      }

    }

  }

  return crc;
}


function makeSymbols(text){

  const payload = bytes(text);

  if(payload.length > 40){

    alert(
      "現在のPOTE CODEでは40バイトまでです。"
    );

    return null;
  }

  const data = [

    80,
    79,
    84,
    69,

    1,

    payload.length,

    ...payload

  ];

  data.push(
    crc8(data)
  );


  const symbols = [];

  for(const b of data){

    symbols.push(
      (b >> 6) & 3
    );

    symbols.push(
      (b >> 4) & 3
    );

    symbols.push(
      (b >> 2) & 3
    );

    symbols.push(
      b & 3
    );

  }

  return symbols;
}


/* =================================================
   見た目用配置
   ================================================= */

function createPositions(seed){

  const random = rng(seed);

  const result = [];

  /*
    円の中に自然に散らす。
    円周には並べない。
  */

  let attempts = 0;

  while(
    result.length < 68 &&
    attempts < 3000
  ){

    attempts++;

    const angle =
      random() *
      Math.PI * 2;

    const radius =
      Math.sqrt(
        random()
      ) * 415;

    const x =
      500 +
      Math.cos(angle) *
      radius;

    const y =
      500 +
      Math.sin(angle) *
      radius;

    /*
      中央ポテちゃんを避ける
    */

    const dx =
      x - 500;

    const dy =
      y - 500;

    if(
      Math.sqrt(
        dx*dx + dy*dy
      ) < 145
    ){
      continue;
    }

    /*
      右下Finderを避ける
    */

    if(
      Math.sqrt(
        (x-845)**2 +
        (y-845)**2
      ) < 75
    ){
      continue;
    }

    const size =
      28 +
      random()*25;

    let overlap = false;

    for(const p of result){

      const d =
        Math.sqrt(
          (x-p.x)**2 +
          (y-p.y)**2
        );

      if(
        d <
        (size+p.size)*0.65
      ){

        overlap = true;
        break;

      }

    }

    if(overlap) continue;

    result.push({
      x,
      y,
      size,
      rotation:
        random()*360,
      color:
        COLORS[
          Math.floor(
            random()*COLORS.length
          )
        ]
    });

  }

  return result;
}


/* =================================================
   図形
   ================================================= */

function shape(type,p){

  const x = p.x;
  const y = p.y;
  const s = p.size;
  const c = p.color;
  const r = p.rotation;

  if(type === 0){

    return `
      <circle
        cx="${x}"
        cy="${y}"
        r="${s/2}"
        fill="${c}"
      />
    `;

  }


  if(type === 1){

    return `
      <polygon
        points="
          ${x},${y-s/2}
          ${x+s/2},${y+s/2}
          ${x-s/2},${y+s/2}
        "
        fill="${c}"
        transform="
          rotate(${r} ${x} ${y})
        "
      />
    `;

  }


  if(type === 2){

    return `
      <rect
        x="${x-s/2}"
        y="${y-s/2}"
        width="${s}"
        height="${s}"
        rx="${s*.16}"
        fill="${c}"
        transform="
          rotate(${r} ${x} ${y})
        "
      />
    `;

  }


  return `
    <polygon
      points="
        ${x},${y-s/2}
        ${x+s/2},${y}
        ${x},${y+s/2}
        ${x-s/2},${y}
      "
      fill="${c}"
      transform="
        rotate(${r} ${x} ${y})
      "
    />
  `;

}


/* =================================================
   POTEちゃん
   ================================================= */

function pote(){

  return `

    <g>

      <!-- potato -->
      <path
        d="
          M500 372
          C440 370 390 420 382 490
          C374 565 410 632 482 640
          C555 648 620 600 622 520
          C624 440 575 375 500 372
          Z
        "
        fill="#b77b43"
      />

      <!-- eyes -->
      <ellipse
        cx="465"
        cy="485"
        rx="11"
        ry="16"
        fill="#51483d"
      />

      <ellipse
        cx="535"
        cy="485"
        rx="11"
        ry="16"
        fill="#51483d"
      />

      <!-- mouth -->
      <path
        d="
          M465 535
          Q500 560 535 535
        "
        fill="none"
        stroke="#51483d"
        stroke-width="7"
        stroke-linecap="round"
      />

    </g>

  `;
}


/* =================================================
   subtle finder
   ================================================= */

function finder(){

  return `

    <g>

      <!-- 周囲の図形に紛れる -->
      <polygon
        points="
          845,805
          890,850
          845,895
          800,850
        "
        fill="#79a978"
      />

      <circle
        cx="845"
        cy="850"
        r="9"
        fill="#e1a536"
      />

    </g>

  `;
}


/* =================================================
   GENERATE
   ================================================= */

function generate(){

  const text =
    document.getElementById(
      "input"
    ).value;

  if(!text){

    alert(
      "文字を入力してください。"
    );

    return;
  }


  const symbols =
    makeSymbols(text);

  if(!symbols) return;


  const seed =
    hash(text);

  const positions =
    createPositions(seed);


  let dataShapes = "";


  /*
    データを散らして配置。

    同じ入力なら
    同じ配置になる。
  */

  for(
    let i=0;
    i<positions.length;
    i++
  ){

    const p =
      positions[i];

    let type;

    if(i < symbols.length){

      type =
        symbols[i];

    }else{

      /*
        データがない場所は
        装飾図形
      */

      type =
        Math.floor(
          (seed + i*17) % 4
        );

    }

    dataShapes +=
      shape(type,p);

  }


  currentSVG = `

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 1000">

  <!-- background -->
  <rect
    width="1000"
    height="1000"
    rx="60"
    fill="#fffaf0"
  />

  <!-- very subtle boundary -->
  <circle
    cx="500"
    cy="500"
    r="455"
    fill="none"
    stroke="#eadfce"
    stroke-width="3"
  />

  <!-- colorful geometry -->
  ${dataShapes}

  <!-- central POTE -->
  ${pote()}

  <!-- hidden-ish finder -->
  ${finder()}

</svg>
`;


  document.getElementById(
    "output"
  ).innerHTML =
    currentSVG;

}


/* =================================================
   SAVE
   ================================================= */

function saveSVG(){

  if(!currentSVG){

    alert(
      "先にPOTE CODEを生成してください。"
    );

    return;
  }


  const blob =
    new Blob(
      [currentSVG],
      {
        type:"image/svg+xml"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "pote-code.svg";

  a.click();


  URL.revokeObjectURL(url);

}

</script>

</body>
</html>
