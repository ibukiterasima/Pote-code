<script>

/* =========================================================
   POTE CODE 基本仕様
========================================================= */

const SIZE = 1500;

const CENTER = 750;


/*
  データ構造

  493bit
  ↓
  17グループ × 29bit
  ↓
  各グループを32スロットへ変換
  ↓
  32スロット中16個ON
  ↓
  合計544スロット
*/

const PACKET_BITS = 493;

const GROUP_BITS = 29;

const GROUP_COUNT = 17;

const SLOT_BITS = 544;


/*
  30文字 × 16bit
  = 480bit

  文字数5bit
  = 5bit

  CRC8
  = 8bit

  合計493bit
*/


const MAX_TEXT_CHARS = 30;


/* =========================================================
   スロット設定
========================================================= */

const SLOT_COUNT = SLOT_BITS;

const MIN_R = 175;

const MAX_R = 640;

const DISTANCES = [
  42,
  40,
  39,
  38,
  37,
  36
];

const MARKER_EXCLUSION = 105;


/* =========================================================
   色
========================================================= */

const COLORS = [
  "#789B69",
  "#D89D32",
  "#CE7E3F",
  "#4F858F",
  "#939B54",
  "#668D67"
];


/* =========================================================
   固定乱数
========================================================= */

let seed = 9283746;

function random(){

  seed =
    (seed * 1664525 + 1013904223)
    >>> 0;

  return seed / 4294967296;

}


/* =========================================================
   UTF-8変換
========================================================= */

/*
  文字列
  ↓
  UTF-8
  ↓
  Uint8Array
*/

function textToUTF8(text){

  return new TextEncoder().encode(text);

}


/*
  UTF-8
  ↓
  文字列
*/

function utf8ToText(bytes){

  return new TextDecoder(
    "utf-8",
    {
      fatal:true
    }
  ).decode(bytes);

}


/* =========================================================
   文字数チェック
========================================================= */

function getCharacterCount(text){

  return Array.from(text).length;

}


/* =========================================================
   UTF-8を固定領域へ変換
========================================================= */

/*
  現在の493bit構造では、

  文字数
  5bit

  データ
  480bit

  CRC
  8bit

  という構造を維持する。

  UTF-8化すると1文字あたりの
  バイト数が可変になるため、

  30文字 × 16bit

  の旧方式をそのまま使うのではなく、

  UTF-8バイト列を16bit単位で格納する。

  最大30文字でUTF-8が480bit以内の場合に
  そのまま格納できる。

  それを超える場合は生成を停止する。
*/


function makeUTF8Body(text){

  const bytes =
    textToUTF8(text);


  /*
    480bit = 60byte
  */

  const MAX_BYTES = 60;


  if(bytes.length > MAX_BYTES){

    throw new Error(
      "UTF-8データが60バイトを超えています"
    );

  }


  const bodyBytes =
    new Uint8Array(MAX_BYTES);


  bodyBytes.set(bytes);


  const bits=[];


  for(
    let i=0;
    i<bodyBytes.length;
    i++
  ){

    const value =
      bodyBytes[i];


    for(
      let b=7;
      b>=0;
      b--
    ){

      bits.push(
        (value >> b) & 1
      );

    }

  }


  return bits;

}


/* =========================================================
   CRC8
========================================================= */

function crc8(bits){

  let crc=0;


  for(
    const bit of bits
  ){

    const mix =
      ((crc >> 7) & 1) ^ bit;


    crc =
      (crc << 1) & 255;


    if(mix){

      crc ^= 0x07;

    }

  }


  return crc;

}


/* =========================================================
   パケット作成
========================================================= */

function makePacket(text){

  const body =
    makeUTF8Body(text);


  /*
    文字数を5bit
  */

  const lengthBits=[];


  const characterCount =
    getCharacterCount(text);


  for(
    let b=4;
    b>=0;
    b--
  ){

    lengthBits.push(
      (characterCount >> b) & 1
    );

  }


  /*
    CRC
  */

  const crc =
    crc8(body);


  const crcBits=[];


  for(
    let b=7;
    b>=0;
    b--
  ){

    crcBits.push(
      (crc >> b) & 1
    );

  }


  const packet = [
    ...lengthBits,
    ...body,
    ...crcBits
  ];


  /*
    念のため493bitを確認
  */

  if(
    packet.length !== PACKET_BITS
  ){

    throw new Error(
      "パケット長が493bitではありません"
    );

  }


  return packet;

}


/* =========================================================
   組み合わせ計算
========================================================= */

function C(n,k){

  if(
    k<0 ||
    k>n
  ){

    return 0;

  }


  k =
    Math.min(k,n-k);


  let result=1;


  for(
    let i=1;
    i<=k;
    i++
  ){

    result =
      result *
      (n-k+i) /
      i;

  }


  return Math.round(result);

}


/* =========================================================
   bit → 数値
========================================================= */

function bitsToNumber(bits){

  let n=0;


  for(
    const bit of bits
  ){

    n =
      n*2+
      bit;

  }


  return n;

}


/* =========================================================
   数値 → 32bit
   16個ON
========================================================= */

function unrank(rank){

  const bits=[];

  let ones=16;

  let r=rank;


  /*
    29bit最大値

    2^29 - 1

    536870911

    32C16

    601080390

    より小さいので、

    29bit全域を安全に
    16/32パターンへ変換できる。
  */


  if(
    rank<0 ||
    rank>=Math.pow(2,29)
  ){

    throw new Error(
      "29bit値が範囲外です"
    );

  }


  for(
    let i=0;
    i<32;
    i++
  ){

    if(
      ones===0
    ){

      bits.push(0);

      continue;

    }


    if(
      ones===32-i
    ){

      bits.push(1);

      ones--;

      continue;

    }


    const zeroCount =
      C(
        31-i,
        ones
      );


    if(
      r<zeroCount
    ){

      bits.push(0);

    }
    else{

      bits.push(1);

      r -= zeroCount;

      ones--;

    }

  }


  /*
    必ず16個ON
  */

  let count=0;


  for(
    const bit of bits
  ){

    if(bit===1){

      count++;

    }

  }


  if(count!==16){

    throw new Error(
      "16/32変換に失敗しました"
    );

  }


  return bits;

}


/* =========================================================
   エンコード
========================================================= */

function encode(text){

  const packet =
    makePacket(text);


  const output=[];


  for(
    let group=0;
    group<GROUP_COUNT;
    group++
  ){

    const chunk=[];


    for(
      let i=0;
      i<GROUP_BITS;
      i++
    ){

      const index =
        group*GROUP_BITS+i;


      chunk.push(
        packet[index] || 0
      );

    }


    /*
      29bit → 数値
    */

    const value =
      bitsToNumber(chunk);


    /*
      29bit → 32スロット
    */

    const groupBits =
      unrank(value);


    output.push(
      ...groupBits
    );

  }


  /*
    17 × 32
    = 544
  */

  if(
    output.length !== SLOT_BITS
  ){

    throw new Error(
      "スロット数が544ではありません"
    );

  }


  return output;

}


/* =========================================================
   図形種類
========================================================= */

function getShape(i){

  let size;


  if(
    i%23===0
  ){

    size=18;

  }
  else if(
    i%13===0
  ){

    size=16;

  }
  else if(
    i%7===0
  ){

    size=15;

  }
  else{

    size=
      11+
      (i%3);

  }


  return {

    type:
      i%5,

    size

  };

}


/* =========================================================
   マーカー
========================================================= */

const MARKERS = [

  {
    x:255,
    y:275
  },

  {
    x:1245,
    y:275
  },

  {
    x:255,
    y:1245
  }

];


/* =========================================================
   マーカーとの距離
========================================================= */

function tooCloseToMarker(x,y){

  for(
    const m of MARKERS
  ){

    const dx =
      x-m.x;

    const dy =
      y-m.y;


    if(
      Math.sqrt(
        dx*dx+
        dy*dy
      )
      <
      MARKER_EXCLUSION
    ){

      return true;

    }

  }


  return false;

}


/* =========================================================
   固定スロット作成
========================================================= */

function createSlots(){

  seed=9283746;


  for(
    const minDistance
    of DISTANCES
  ){

    const candidates=[];


    for(
      let i=0;
      i<30000;
      i++
    ){

      const angle =
        random()*
        Math.PI*
        2;


      const rr =
        Math.sqrt(random())*
        (MAX_R-MIN_R)+
        MIN_R;


      const x =
        CENTER+
        Math.cos(angle)*
        rr;


      const y =
        CENTER+
        Math.sin(angle)*
        rr;


      const dx =
        x-CENTER;

      const dy =
        y-CENTER;


      const radius =
        Math.sqrt(
          dx*dx+
          dy*dy
        );


      if(
        radius<MIN_R ||
        radius>MAX_R
      ){

        continue;

      }


      if(
        tooCloseToMarker(x,y)
      ){

        continue;

      }


      candidates.push({

        x,
        y,

        angle,

        radius

      });

    }


    /*
      シャッフル
    */

    for(
      let i=candidates.length-1;
      i>0;
      i--
    ){

      const j =
        Math.floor(
          random()*
          (i+1)
        );


      const temp =
        candidates[i];


      candidates[i]=
        candidates[j];


      candidates[j]=
        temp;

    }


    const selected=[];


    /*
      図形同士が重ならないようにする
    */

    for(
      const p of candidates
    ){

      let ok=true;


      for(
        const q of selected
      ){

        const dx =
          p.x-q.x;

        const dy =
          p.y-q.y;


        if(
          dx*dx+
          dy*dy
          <
          minDistance*
          minDistance
        ){

          ok=false;

          break;

        }

      }


      if(!ok){

        continue;

      }


      selected.push(p);


      if(
        selected.length>=
        SLOT_COUNT
      ){

        break;

      }

    }


    /*
      544個完成
    */

    if(
      selected.length>=
      SLOT_COUNT
    ){

      selected.length=
        SLOT_COUNT;


      return selected.map(
        (p,i)=>({

          x:p.x,

          y:p.y,

          type:
            getShape(i).type,

          size:
            getShape(i).size,

          color:
            COLORS[
              i%COLORS.length
            ]

        })
      );

    }

  }


  throw new Error(
    "スロットを作成できませんでした"
  );

}


/* =========================================================
   スロットは最初に1回だけ生成
========================================================= */

let SLOTS=null;


try{

  SLOTS =
    createSlots();

}
catch(error){

  console.error(error);

}


/* =========================================================
   SVG Element
========================================================= */

function svgElement(name){

  return document.createElementNS(
    "http://www.w3.org/2000/svg",
    name
  );

}


/* =========================================================
   データ図形
========================================================= */

function drawShape(svg,s){

  const size =
    s.size;

  const color =
    s.color;


  const g =
    svgElement("g");


  /*
    円
  */

  if(
    s.type===0
  ){

    const e =
      svgElement("circle");


    e.setAttribute(
      "cx",
      s.x
    );

    e.setAttribute(
      "cy",
      s.y
    );

    e.setAttribute(
      "r",
      size
    );

    e.setAttribute(
      "fill",
      color
    );


    g.appendChild(e);

  }


  /*
    丸角長方形
  */

  else if(
    s.type===1
  ){

    const e =
      svgElement("rect");


    e.setAttribute(
      "x",
      s.x-size
    );

    e.setAttribute(
      "y",
      s.y-size*.72
    );

    e.setAttribute(
      "width",
      size*2
    );

    e.setAttribute(
      "height",
      size*1.44
    );

    e.setAttribute(
      "rx",
      size*.5
    );

    e.setAttribute(
      "fill",
      color
    );


    g.appendChild(e);

  }


  /*
    三角
  */

  else if(
    s.type===2
  ){

    const e =
      svgElement("polygon");


    const h =
      size*1.35;


    e.setAttribute(
      "points",
      [
        `${s.x},${s.y-h}`,
        `${s.x-size},${s.y+h*.65}`,
        `${s.x+size},${s.y+h*.65}`
      ].join(" ")
    );


    e.setAttribute(
      "fill",
      color
    );


    g.appendChild(e);

  }


  /*
    ダイヤ
  */

  else if(
    s.type===3
  ){

    const e =
      svgElement("polygon");


    e.setAttribute(
      "points",
      [
        `${s.x},${s.y-size}`,
        `${s.x+size},${s.y}`,
        `${s.x},${s.y+size}`,
        `${s.x-size},${s.y}`
      ].join(" ")
    );


    e.setAttribute(
      "fill",
      color
    );


    g.appendChild(e);

  }


  /*
    横長丸角
  */

  else{

    const e =
      svgElement("rect");


    e.setAttribute(
      "x",
      s.x-size*1.25
    );

    e.setAttribute(
      "y",
      s.y-size*.55
    );

    e.setAttribute(
      "width",
      size*2.5
    );

    e.setAttribute(
      "height",
      size*1.1
    );

    e.setAttribute(
      "rx",
      size*.5
    );

    e.setAttribute(
      "fill",
      color
    );


    g.appendChild(e);

  }


  svg.appendChild(g);

}


/* =========================================================
   マーカー描画
========================================================= */

function drawMarkers(svg){

  for(
    const m of MARKERS
  ){

    const ring =
      svgElement("circle");


    ring.setAttribute(
      "cx",
      m.x
    );

    ring.setAttribute(
      "cy",
      m.y
    );

    ring.setAttribute(
      "r",
      "38"
    );

    ring.setAttribute(
      "fill",
      "#FFFDF5"
    );

    ring.setAttribute(
      "stroke",
      "#51483F"
    );

    ring.setAttribute(
      "stroke-width",
      "7"
    );


    svg.appendChild(ring);


    const inner =
      svgElement("circle");


    inner.setAttribute(
      "cx",
      m.x
    );

    inner.setAttribute(
      "cy",
      m.y
    );

    inner.setAttribute(
      "r",
      "18"
    );

    inner.setAttribute(
      "fill",
      "none"
    );

    inner.setAttribute(
      "stroke",
      "#51483F"
    );

    inner.setAttribute(
      "stroke-width",
      "6"
    );


    svg.appendChild(inner);


    const dot =
      svgElement("circle");


    dot.setAttribute(
      "cx",
      m.x
    );

    dot.setAttribute(
      "cy",
      m.y
    );

    dot.setAttribute(
      "r",
      "5"
    );

    dot.setAttribute(
      "fill",
      "#51483F"
    );


    svg.appendChild(dot);

  }

}


/* =========================================================
   中央ポテちゃん
========================================================= */

function drawPote(svg){

  const pote =
    svgElement("g");


  /*
    本体
  */

  const body =
    svgElement("circle");


  body.setAttribute(
    "cx",
    "750"
  );

  body.setAttribute(
    "cy",
    "750"
  );

  body.setAttribute(
    "r",
    "78"
  );

  body.setAttribute(
    "fill",
    "#D99A3D"
  );


  pote.appendChild(body);


  /*
    目
  */

  for(
    const x of [725,775]
  ){

    const eye =
      svgElement("circle");


    eye.setAttribute(
      "cx",
      x
    );

    eye.setAttribute(
      "cy",
      "748"
    );

    eye.setAttribute(
      "r",
      "5"
    );

    eye.setAttribute(
      "fill",
      "#51483F"
    );


    pote.appendChild(eye);

  }


  /*
    口
  */

  const mouth =
    svgElement("path");


  mouth.setAttribute(
    "d",
    "M735 770 Q750 782 765 770"
  );

  mouth.setAttribute(
    "fill",
    "none"
  );

  mouth.setAttribute(
    "stroke",
    "#51483F"
  );

  mouth.setAttribute(
    "stroke-width",
    "5"
  );

  mouth.setAttribute(
    "stroke-linecap",
    "round"
  );


  pote.appendChild(mouth);


  svg.appendChild(pote);

}


/* =========================================================
   SVG生成
========================================================= */

function createSVG(text){

  if(!SLOTS){

    throw new Error(
      "スロットを作成できません"
    );

  }


  const bits =
    encode(text);


  const svg =
    document.getElementById("svg");


  svg.innerHTML="";


  /*
    背景
  */

  const bg =
    svgElement("rect");


  bg.setAttribute(
    "x",
    "0"
  );

  bg.setAttribute(
    "y",
    "0"
  );

  bg.setAttribute(
    "width",
    SIZE
  );

  bg.setAttribute(
    "height",
    SIZE
  );

  bg.setAttribute(
    "fill",
    "#FFFDF7"
  );


  svg.appendChild(bg);


  /*
    外周円
  */

  const outer =
    svgElement("circle");


  outer.setAttribute(
    "cx",
    CENTER
  );

  outer.setAttribute(
    "cy",
    CENTER
  );

  outer.setAttribute(
    "r",
    "680"
  );

  outer.setAttribute(
    "fill",
    "none"
  );

  outer.setAttribute(
    "stroke",
    "#D7CAB0"
  );

  outer.setAttribute(
    "stroke-width",
    "2"
  );

  outer.setAttribute(
    "opacity",
    ".3"
  );


  svg.appendChild(outer);


  /*
    データ図形
  */

  for(
    let i=0;
    i<SLOT_COUNT;
    i++
  ){

    if(
      bits[i]!==1
    ){

      continue;

    }


    drawShape(
      svg,
      SLOTS[i]
    );

  }


  /*
    マーカー
  */

  drawMarkers(svg);


  /*
    中央ポテちゃん
  */

  drawPote(svg);

}


/* =========================================================
   生成ボタン
========================================================= */

document
  .getElementById("generate")
  .addEventListener(
    "click",
    ()=>{

      const text =
        document
          .getElementById("text")
          .value;


      const status =
        document
          .getElementById("status");


      /*
        空文字
      */

      if(!text){

        status.textContent =
          "文字を入力してください";

        return;

      }


      /*
        見た目上の文字数
      */

      const characterCount =
        getCharacterCount(text);


      if(
        characterCount >
        MAX_TEXT_CHARS
      ){

        status.textContent =
          "30文字以内で入力してください";

        return;

      }


      try{

        /*
          UTF-8サイズ確認
        */

        const bytes =
          textToUTF8(text);


        if(
          bytes.length > 60
        ){

          status.textContent =
            "UTF-8データが大きすぎます";

          return;

        }


        createSVG(text);


        status.textContent =
          "生成しました";

      }
      catch(error){

        console.error(error);


        status.textContent =
          error.message ||
          "生成に失敗しました";

      }

    }
  );


/* =========================================================
   初期表示
========================================================= */

try{

  createSVG("POTE");

}
catch(error){

  console.error(error);

  document
    .getElementById("status")
    .textContent =
      "生成に失敗しました";

}
