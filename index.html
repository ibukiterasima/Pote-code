<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポテコード</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#f4ead7;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  color:#493525;
  display:flex;
  justify-content:center;
}

.wrap{
  width:min(700px,94vw);
  padding:24px 0 40px;
}

h1{
  text-align:center;
  margin:5px 0 20px;
  font-size:30px;
}

textarea{
  width:100%;
  min-height:110px;
  resize:vertical;
  border:3px solid #8d603d;
  border-radius:16px;
  background:#fffaf0;
  padding:14px;
  font-size:17px;
  outline:none;
}

.info{
  margin:8px 4px 16px;
  font-size:13px;
  opacity:.7;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  background:#8d603d;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.card{
  margin-top:22px;
  padding:18px;
  border-radius:22px;
  background:#fffaf0;
  box-shadow:0 5px 18px #0001;
}

#code{
  width:100%;
  aspect-ratio:1;
  max-width:560px;
  margin:auto;
  display:grid;
  place-items:center;
  position:relative;
}

/*
  ポテコード固定配置
  ↓ここを参考画像の配置に合わせて固定スロット化できる
*/
.dot{
  position:absolute;
  width:22px;
  height:22px;
  background:#5b3925;
  border-radius:50%;
  transform:translate(-50%,-50%);
}

.dot.square{
  border-radius:4px;
}

.result{
  margin-top:16px;
  padding:12px;
  background:#f4ead7;
  border-radius:12px;
  word-break:break-all;
  font-size:13px;
}
</style>
</head>

<body>

<div class="wrap">

<h1>🥔 ポテコード</h1>

<textarea id="text"
placeholder="ここに文字・URL・日本語などを入力&#10;&#10;例：&#10;https://x.gd/Ab12&#10;ポテちゃんこんにちは！"></textarea>

<div class="info">
文字・数字・日本語・記号・URLをまとめて入力できます
</div>

<button onclick="makeCode()">ポテコードを作る</button>

<div class="card">
  <div id="code"></div>

  <div class="result">
    <b>入力：</b>
    <span id="result"></span>
  </div>
</div>

</div>

<script>

/*
==================================================
ポテコード設定
==================================================

1文字 = 8bit のUTF-8データとして保存。

実際にはUTF-8のバイト列をビット化するので、
日本語もURLも英数字も同じ仕組みで扱える。

==================================================
*/

const SIZE = 29;

// 固定配置。
// 今は円形に近い配置を自動生成。
// 参考画像の正確な固定配置が分かれば
// この配列を固定座標に置き換えられる。

function createPositions(){

  const positions=[];

  const cx=50;
  const cy=50;

  // 外側から内側へ
  for(let r=46;r>=8;r-=6){

    const count=Math.max(8,Math.floor(2*Math.PI*r/6));

    for(let i=0;i<count;i++){

      const angle=(i/count)*Math.PI*2;

      positions.push({
        x:cx+Math.cos(angle)*r,
        y:cy+Math.sin(angle)*r
      });

    }
  }

  // 中央付近
  for(let y=35;y<=65;y+=6){
    for(let x=35;x<=65;x+=6){

      const dx=x-50;
      const dy=y-50;

      if(Math.sqrt(dx*dx+dy*dy)<22){

        positions.push({x,y});

      }
    }
  }

  return positions;
}

const positions=createPositions();


function utf8Bytes(str){

  return new TextEncoder().encode(str);

}


function bytesToBits(bytes){

  const bits=[];

  for(const b of bytes){

    for(let i=7;i>=0;i--){

      bits.push((b>>i)&1);

    }

  }

  return bits;

}


function makeCode(){

  const text=document.getElementById("text").value;

  if(!text){

    alert("文字を入力してね！");
    return;

  }

  const bytes=utf8Bytes(text);

  const bits=bytesToBits(bytes);

  const code=document.getElementById("code");

  code.innerHTML="";

  /*
    データ量表示
  */

  const maxBits=positions.length;

  if(bits.length>maxBits){

    alert(
      "この配置では容量を超えています。\n"+
      "必要："+bits.length+" bit\n"+
      "最大："+maxBits+" bit"
    );

    return;

  }

  /*
    図形を配置
  */

  positions.forEach((p,i)=>{

    if(i>=bits.length) return;

    if(bits[i]===1){

      const d=document.createElement("div");

      d.className="dot";

      d.style.left=p.x+"%";
      d.style.top=p.y+"%";

      code.appendChild(d);

    }

  });

  document.getElementById("result").textContent=text;

}


</script>

</body>
</html>
