<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ポテコード</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#f7f0e7;
  font-family:-apple-system,BlinkMacSystemFont,
    "Hiragino Sans","Yu Gothic",sans-serif;
  color:#665c58;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:min(92vw,700px);
  text-align:center;
}

h1{
  margin:0 0 7px;
  font-size:30px;
  letter-spacing:.08em;
}

.sub{
  margin-bottom:22px;
  color:#9a908b;
  font-size:14px;
}

textarea{
  width:100%;
  height:100px;
  resize:none;
  border:0;
  outline:none;
  border-radius:22px;
  padding:18px;
  background:#fffaf5;
  color:#665c58;
  font-size:16px;
  box-shadow:0 6px 20px rgba(100,80,60,.08);
}

button{
  margin-top:14px;
  border:0;
  border-radius:999px;
  padding:13px 30px;
  background:#d9bca9;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.card{
  margin-top:28px;
  background:#fffaf5;
  border-radius:34px;
  padding:25px;
  box-shadow:0 12px 35px rgba(100,80,60,.1);
}

#poteCode{
  position:relative;
  width:min(82vw,520px);
  aspect-ratio:1;
  margin:auto;
  overflow:hidden;
  border-radius:25px;
  background:#f4e9df;
}

/* =========================
   図形
========================= */

.shape{
  position:absolute;
  transform-origin:center;
  z-index:3;
}

/* 横長 */

.rect-wide{
  width:35px;
  height:19px;
  border-radius:6px;
}

/* 縦長 */

.rect-tall{
  width:19px;
  height:35px;
  border-radius:6px;
}

/* やわらかい四角 */

.rect-soft{
  width:31px;
  height:24px;
  border-radius:10px 5px 9px 6px;
}

/* ちょっと歪んだ四角 */

.rect-slant{
  width:31px;
  height:21px;
  border-radius:5px 11px 6px 8px;
}

/* ひし形 */

.diamond{
  width:25px;
  height:25px;
  border-radius:5px;
}

/* 三角 */

.triangle{
  width:0;
  height:0;
  background:transparent!important;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-bottom:25px solid currentColor;
}

/* 六角形 */

.hex{
  width:29px;
  height:25px;
  clip-path:polygon(
    25% 0%,
    75% 0%,
    100% 50%,
    75% 100%,
    25% 100%,
    0% 50%
  );
}

/* いびつな形 */

.blob{
  width:29px;
  height:27px;
  clip-path:polygon(
    16% 4%,
    74% 0%,
    100% 35%,
    87% 89%,
    35% 100%,
    0% 63%
  );
}

/* 小さな丸 */

.dot{
  width:17px;
  height:17px;
  border-radius:50%;
}

/* 星 */

.star{
  width:29px;
  height:29px;
  clip-path:polygon(
    50% 0%,
    61% 35%,
    98% 35%,
    68% 57%,
    79% 95%,
    50% 72%,
    21% 95%,
    32% 57%,
    2% 35%,
    39% 35%
  );
}


/* =========================
   ポテちゃん
========================= */

.pote{
  position:absolute;
  left:50%;
  top:50%;
  width:56px;
  height:64px;
  transform:translate(-50%,-50%);
  background:#a96f45;
  border-radius:47% 53% 48% 52% /
               48% 46% 54% 52%;
  z-index:30;
  box-shadow:0 4px 0 rgba(100,65,40,.1);
}

.pote::before,
.pote::after{
  content:"";
  position:absolute;
  width:7px;
  height:9px;
  top:24px;
  background:#493b35;
  border-radius:50%;
}

.pote::before{
  left:16px;
}

.pote::after{
  right:16px;
}

.mouth{
  position:absolute;
  left:50%;
  top:39px;
  width:13px;
  height:7px;
  transform:translateX(-50%);
  border-bottom:3px solid #493b35;
  border-radius:50%;
}


/* =========================
   下の表示
========================= */

.result{
  margin-top:18px;
  font-size:13px;
  color:#968983;
  word-break:break-all;
}

.status{
  margin-top:8px;
  font-size:12px;
  color:#b0a39d;
}
</style>
</head>

<body>

<div class="app">

<h1>ポテコード</h1>

<div class="sub">
文字やURLを、ポテコードに変換
</div>

<textarea
  id="input"
  placeholder="ここに文字・URL・日本語などを入力…"
></textarea>

<button id="make">
ポテコードを作る
</button>

<div class="card">

<div id="poteCode">

  <!-- 中央のポテちゃんだけ -->
  <div class="pote">
    <div class="mouth"></div>
  </div>

</div>

<div class="result" id="result">
まだポテコードがありません
</div>

<div class="status" id="status">
文字を入力してね
</div>

</div>

</div>


<script>

/* ==================================================
   色
================================================== */

const COLORS=[
  "#B8D8D0",
  "#BFD7EA",
  "#D8C4E8",
  "#F1C6C7",
  "#F1D49B",
  "#D2E2B5",
  "#E8BFA7",
  "#C7C2DF",
  "#BFD8C2",
  "#E6C7D5"
];


/* ==================================================
   図形
================================================== */

const SHAPES=[
  "rect-wide",
  "rect-tall",
  "rect-soft",
  "rect-slant",
  "diamond",
  "triangle",
  "hex",
  "blob",
  "dot",
  "star"
];


/* ==================================================
   文字 → UTF-8
================================================== */

function getBytes(text){

  return Array.from(
    new TextEncoder().encode(text)
  );

}


/* ==================================================
   ハッシュ
================================================== */

function hashText(text){

  let h=2166136261;

  for(let i=0;i<text.length;i++){

    h^=text.charCodeAt(i);

    h+=
      (h<<1)+
      (h<<4)+
      (h<<7)+
      (h<<8)+
      (h<<24);

  }

  return Math.abs(h>>>0);

}


/* ==================================================
   データを4段階に変換
================================================== */

function makeSymbols(bytes){

  const symbols=[];

  for(const b of bytes){

    symbols.push((b>>6)&3);
    symbols.push((b>>4)&3);
    symbols.push((b>>2)&3);
    symbols.push(b&3);

  }

  return symbols;

}


/* ==================================================
   候補位置を大量に作る
================================================== */

function makeCandidates(){

  const list=[];

  /*
    円形ではなく、
    少しずつ位置をずらした
    不規則な配置
  */

  const rows=9;
  const cols=9;

  for(let y=0;y<rows;y++){

    for(let x=0;x<cols;x++){

      let px=
        9+
        x*(82/(cols-1));

      let py=
        9+
        y*(82/(rows-1));

      /*
        少しランダムにずらす
      */

      const wiggleX=
        Math.sin(x*4.73+y*2.19)*2.7;

      const wiggleY=
        Math.cos(x*2.71+y*4.31)*2.7;

      px+=wiggleX;
      py+=wiggleY;

      /*
        中央ポテちゃんの場所は除外
      */

      const dx=px-50;
      const dy=py-50;

      if(Math.sqrt(dx*dx+dy*dy)<12){

        continue;

      }

      list.push({
        x:px,
        y:py
      });

    }

  }

  return list;

}


/* ==================================================
   図形の大きさを取得
================================================== */

function getSize(shape){

  const sizes={

    "rect-wide":[35,19],
    "rect-tall":[19,35],
    "rect-soft":[31,24],
    "rect-slant":[31,21],
    "diamond":[25,25],
    "triangle":[28,25],
    "hex":[29,25],
    "blob":[29,27],
    "dot":[17,17],
    "star":[29,29]

  };

  return sizes[shape] || [25,25];

}


/* ==================================================
   重なっているか
================================================== */

function overlaps(a,b){

  const dx=a.x-b.x;
  const dy=a.y-b.y;

  const distance=
    Math.sqrt(dx*dx+dy*dy);

  /*
    画面上の距離を考慮して
    余白をかなり大きめに取る
  */

  return distance <
    (a.radius+b.radius);

}


/* ==================================================
   重ならない位置を生成
================================================== */

function makeSafePositions(seed){

  const candidates=makeCandidates();

  /*
    ハッシュによって順番を変える
  */

  candidates.sort((a,b)=>{

    const aa=
      Math.sin(
        seed+
        a.x*12.73+
        a.y*7.21
      );

    const bb=
      Math.sin(
        seed+
        b.x*12.73+
        b.y*7.21
      );

    return aa-bb;

  });


  const result=[];


  for(const p of candidates){

    /*
      図形サイズを少し大きめに
      見積もる
    */

    const candidate={
      x:p.x,
      y:p.y,
      radius:6.7
    };


    let safe=true;

    for(const existing of result){

      if(overlaps(candidate,existing)){

        safe=false;
        break;

      }

    }


    /*
      ポテちゃんの周囲も空ける
    */

    const dx=p.x-50;
    const dy=p.y-50;

    if(Math.sqrt(dx*dx+dy*dy)<13){

      safe=false;

    }


    if(safe){

      result.push(candidate);

    }

  }


  return result;

}


/* ==================================================
   図形生成
================================================== */

function addShape(
  container,
  position,
  index,
  value,
  seed
){

  const el=
    document.createElement("div");


  const shapeIndex=
    Math.abs(
      seed+
      index*17+
      value*7
    )%SHAPES.length;


  const colorIndex=
    Math.abs(
      seed*3+
      index*11+
      value*13
    )%COLORS.length;


  const shape=
    SHAPES[shapeIndex];


  el.className=
    "shape "+shape;


  el.style.left=
    position.x+"%";

  el.style.top=
    position.y+"%";


  el.style.background=
    COLORS[colorIndex];

  el.style.color=
    COLORS[colorIndex];


  /*
    回転
  */

  let rotation=
    (
      seed+
      index*23+
      value*31
    )%360;


  /*
    三角形はCSSの都合で
    回転をそのまま使用
  */

  el.style.transform=
    "translate(-50%,-50%) rotate("+
    rotation+
    "deg)";


  /*
    大きさを少しだけ変える
  */

  const scale=
    .82+
    (
      Math.abs(
        seed+
        index*5+
        value*3
      )%25
    )/100;


  el.style.scale=scale;


  container.appendChild(el);

}


/* ==================================================
   メイン
================================================== */

function makeCode(){

  const input=
    document.getElementById("input");

  const container=
    document.getElementById("poteCode");

  const result=
    document.getElementById("result");

  const status=
    document.getElementById("status");


  const text=
    input.value;


  /*
    以前の図形を全部削除
  */

  container
    .querySelectorAll(".shape")
    .forEach(el=>el.remove());


  if(!text){

    result.textContent=
      "まだポテコードがありません";

    status.textContent=
      "文字を入力してね";

    return;

  }


  const bytes=
    getBytes(text);

  const symbols=
    makeSymbols(bytes);

  const seed=
    hashText(text);


  /*
    重ならない位置を生成
  */

  const positions=
    makeSafePositions(seed);


  /*
    できるだけたくさん配置
  */

  const count=
    Math.min(
      positions.length,
      68
    );


  for(let i=0;i<count;i++){

    let value;

    if(i<symbols.length){

      value=
        symbols[i];

    }else{

      /*
        ダミーも入力から決定
      */

      value=
        (
          seed+
          i*19+
          i*i*3
        )%4;

    }


    addShape(
      container,
      positions[i],
      i,
      value,
      seed
    );

  }


  result.textContent=text;

  status.textContent=
    "図形が重ならないように配置されています";

}


document
  .getElementById("make")
  .addEventListener(
    "click",
    makeCode
  );

</script>

</body>
</html>
