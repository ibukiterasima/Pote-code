/* =========================================================
   POTE CODE
   =========================================================

   今回は「見た目優先」。

   ・図形は円形範囲全体に散らす
   ・グリッド感をなくす
   ・全コード共通の固定配置

   ・位置は固定
   ・30文字対応
   ・中央ポテちゃん固定
   ・QRの四隅マーカーなし

   ========================================================= */


/* =========================================================

   ========================================================= */

const COLORS = [

/* =========================================================

   ========================================================= */

}

   30文字を扱うため、
   160個の比較的大きな図形を使う。

   1図形 = 4bit

   → 約640bit

   30文字分のUnicode情報を
   圧縮して格納する。

   ========================================================= */


/*
  手作業で「見た目がいい位置」を作るための
  円形ランダム風座標。

  実際には乱数ではなく完全固定。
*/

/*
  中央付近はポテちゃんがいるので、
  データ図形を置かない。
*/


/* =========================================================
   データ圧縮
   =========================================================

   30文字をUTF-8にする。

   そのまま全部を図形にすると多すぎるため、
   Deflate CompressionStream が使えるブラウザでは
   圧縮してから格納する。

   圧縮できない場合は
   UTF-8をそのまま使う。

   ========================================================= */

async function compressData(bytes){

  if(typeof CompressionStream==="undefined"){

    return bytes;

  }

  try{

    const stream =
      new CompressionStream("deflate");

    const writer =
      stream.writable.getWriter();

    writer.write(
      new Uint8Array(bytes)
    );

    writer.close();

    const buffer =
      await new Response(
        stream.readable
      ).arrayBuffer();

    return Array.from(
      new Uint8Array(buffer)
    );

  }catch(e){

    return bytes;

  }

}


/* =========================================================
   CRC32
   ========================================================= */

function crc32(bytes){

  let crc=0xFFFFFFFF;

  for(const b of bytes){

    crc ^= b;

    for(let i=0;i<8;i++){

      crc =
        (crc>>>1) ^
        (
          (crc&1)
          ? 0xEDB88320
          : 0
        );

    }

  }

  return (
    crc ^ 0xFFFFFFFF
  ) >>> 0;

}


/* =========================================================
   bytes → bits
   ========================================================= */

function bytesToBits(bytes){

  const bits=[];

  for(const b of bytes){

    for(let i=7;i>=0;i--){

      bits.push(
        (b>>>i)&1
      );

    }

  }

  return bits;

}


/* =========================================================
   bits → 4bit values
   ========================================================= */

function bitsToNibbles(bits){

  const result=[];

  for(
    let i=0;
    i<bits.length;
    i+=4
  ){

    let n=0;

    for(let j=0;j<4;j++){

      n<<=1;

      if(
        i+j<bits.length
      ){

        n|=bits[i+j];

      }

    }

    result.push(n);

  }

  return result;

}


/* =========================================================
   4bit → 図形カラー
   ========================================================= */

function colorForValue(value,index){

  /*
    色が毎回完全にバラバラにならないよう、
    近い色同士を回避。

    ただし「色そのもの」は
    読み取りデータとして使える。
  */

  return COLORS[
    (value + index*3) %
    COLORS.length
  ];

}


/* =========================================================
   パケット作成
   ========================================================= */

async function createPacket(text){

  const raw =
    Array.from(
      new TextEncoder().encode(text)
    );


  const compressed =
    await compressData(raw);


  /*
    POTE HEADER

    0x50
    0x4F
    0x54
    0x45
  */

  const packet=[
    0x50,
    0x4F,
    0x54,
    0x45,

    raw.length & 255,

    compressed.length & 255,

    ...compressed
  ];


  const crc =
    crc32(raw);


  packet.push(
    crc & 255,
    (crc>>>8)&255,
    (crc>>>16)&255,
    (crc>>>24)&255
  );


  return packet;

}


/* =========================================================

/* =========================================================
   描画：データ図形
   ========================================================= */

function drawData(svg,nibbles){

  /*
    すべての位置に図形を置く。

    これが今回のポイント。

    前の版のように
    「ある・ない」で大量の空白を作らない。

    だからデータが変わっても
    パッと見の密度がほぼ同じ。
  */

  for(
    let i=0;
    i<DATA_POINTS.length;
    i++
  ){

    const p=
      DATA_POINTS[i];

    const value=
      nibbles[i]
      ?? ((i*7)%16);


    const color=
      colorForValue(
        value,
        i
      );


    /*
      大小を少しだけ変える。

      位置は固定。
      大きさも固定パターン。
    */

    const sizePattern=[
      11,14,10,13,12,
      15,10,13,11,14
    ];

    const s=
      sizePattern[
        i%sizePattern.length
      ];


    const type=
      i%5;


    let shape;


    /* 丸 */

    if(type===0){

      shape=
        E("circle",{
          cx:p[0],
          cy:p[1],
          r:s,
          fill:color
        });

    }


    /* 丸角四角 */

    else if(type===1){

      shape=
        E("rect",{
          x:p[0]-s,
          y:p[1]-s,
          width:s*2,
          height:s*2,
          rx:5,
          fill:color
        });

    }


    /* 三角 */

    else if(type===2){

      shape=
        E("polygon",{
          points:
            `${p[0]},${p[1]-s} `+
            `${p[0]+s},${p[1]+s} `+
            `${p[0]-s},${p[1]+s}`,
          fill:color
        });

    }


    /* ダイヤ */

    else if(type===3){

      shape=
        E("polygon",{
          points:
            `${p[0]},${p[1]-s} `+
            `${p[0]+s},${p[1]} `+
            `${p[0]},${p[1]+s} `+
            `${p[0]-s},${p[1]}`,
          fill:color
        });

    }


    /* 横長 */

    else{

      shape=
        E("rect",{
          x:p[0]-s*1.35,
          y:p[1]-s*.7,
          width:s*2.7,
          height:s*1.4,
          rx:5,
          fill:color
        });

    }


    svg.appendChild(shape);

  }

}

/* =========================================================
   生成
   ========================================================= */

let lastPacket=[];
let lastNibbles=[];


async function generate(){

  const text=
    document
      .getElementById("text")
      .value;


  if(!text){

    alert(
      "文字を入力してください"
    );

    return;

  }


  const chars=
    Array.from(text);


  if(chars.length>30){

    alert(
      "最大30文字です。"
    );

    return;

  }


  const packet=
    await createPacket(text);


  const bits=
    bytesToBits(packet);


  const nibbles=
    bitsToNibbles(bits);


  /*
    160図形以上あるので、
    データ量が収まるか確認。
  */

  if(
    nibbles.length>
    DATA_POINTS.length
  ){

    alert(
      "この文字列は現在の見た目用容量を超えました。\n"+
      "短い文章で試してください。"
    );

    return;

  }


  lastPacket=packet;
  lastNibbles=nibbles;


  const svg=
    document.getElementById("code");


  while(svg.firstChild){

    svg.removeChild(
      svg.firstChild
    );

  }


  /*
    背景
  */

  drawBackground(svg);


  /*
    大きな図形
  */

  drawLargeShapes(svg);


  /*
    データ図形

    大きな図形の間に
    自然に散らばる。
  */

  drawData(
    svg,
    nibbles
  );


  /*
    小さな装飾
  */

  drawSmallDecoration(svg);


  /*
    中央
  */

  drawPote(svg);


  /*
    外周
  */

  drawOuter(svg);


  /*
    内部テスト
  */

  const decoded=
    await decodePacket(
      packet
    );


  const result=
    document.getElementById(
      "result"
    );


  if(decoded===text){

    result.innerHTML=
      `<span class="ok">
      ✓ 内部読み取りテスト成功
      </span><br>`+
      `入力：${escapeHtml(text)}<br>`+
      `復号：${escapeHtml(decoded)}<br>`+
      `<span class="small">
      ${chars.length}文字 / `+
      `${packet.length} bytes / `+
      `${nibbles.length}個のデータ図形
      </span>`;

  }else{

    result.innerHTML=
      `<span class="error">
      ✕ 内部読み取りテスト失敗
      </span>`;

  }


  document.getElementById(
    "info"
  ).textContent=
    `${chars.length}/30文字　`+
    `データ図形 ${nibbles.length}個`;

}


/* =========================================================
   復号
   ========================================================= */

async function decodePacket(packet){

  if(
    packet[0]!==0x50 ||
    packet[1]!==0x4F ||
    packet[2]!==0x54 ||
    packet[3]!==0x45
  ){

    return null;

  }


  const originalLength=
    packet[4];

  const compressedLength=
    packet[5];


  const data=
    packet.slice(
      6,
      6+compressedLength
    );


  const crcIndex=
    6+compressedLength;


  const storedCRC=
    (
      packet[crcIndex] |
      (packet[crcIndex+1]<<8) |
      (packet[crcIndex+2]<<16) |
      (packet[crcIndex+3]<<24)
    ) >>> 0;


  let raw;


  if(
    typeof DecompressionStream!=="undefined"
  ){

    try{

      const stream=
        new DecompressionStream(
          "deflate"
        );

      const writer=
        stream.writable.getWriter();

      writer.write(
        new Uint8Array(data)
      );

      writer.close();

      const buffer=
        await new Response(
          stream.readable
        ).arrayBuffer();

      raw=
        Array.from(
          new Uint8Array(buffer)
        );

    }catch(e){

      raw=data;

    }

  }else{

    raw=data;

  }


  if(
    crc32(raw)!==storedCRC
  ){

    return null;

  }


  if(
    raw.length!==originalLength
  ){

    return null;

  }


  return new TextDecoder()
    .decode(
      new Uint8Array(raw)
    );

}

function escapeHtml(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
