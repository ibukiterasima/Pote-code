<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポテコード</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#f7f0e7;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",
              "Yu Gothic",sans-serif;
  color:#665c58;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:min(92vw,700px);
  text-align:center;
}

h1{
  margin:0 0 8px;
  font-size:30px;
  font-weight:700;
  letter-spacing:.08em;
}

.sub{
  margin-bottom:24px;
  font-size:14px;
  color:#9a908b;
}

textarea{
  width:100%;
  height:100px;
  border:0;
  border-radius:22px;
  padding:18px;
  resize:none;
  background:#fffaf5;
  box-shadow:0 6px 20px rgba(100,80,60,.08);
  font-size:16px;
  outline:none;
  color:#665c58;
}

textarea:focus{
  box-shadow:0 0 0 3px #ead8d0;
}

button{
  margin-top:14px;
  border:0;
  border-radius:999px;
  padding:13px 28px;
  background:#dcbfae;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.card{
  margin-top:28px;
  background:#fffaf5;
  border-radius:34px;
  padding:25px;
  box-shadow:0 12px 35px rgba(100,80,60,.10);
}

#poteCode{
  position:relative;
  width:min(82vw,520px);
  aspect-ratio:1;
  margin:auto;
  overflow:hidden;
  background:#f4e9df;
  border-radius:25px;
}

/* --------------------------------
   固定マーカー
-------------------------------- */

.marker{
  position:absolute;
  width:38px;
  height:38px;
  border-radius:11px;
  background:#8c7d76;
  z-index:20;
}

.marker::after{
  content:"";
  position:absolute;
  inset:8px;
  background:#f4e9df;
  border-radius:5px;
}

.m1{
  left:18px;
  top:18px;
}

.m2{
  right:18px;
  top:18px;
}

.m3{
  left:18px;
  bottom:18px;
}

/* --------------------------------
   図形
-------------------------------- */

.shape{
  position:absolute;
  transform-origin:center;
  z-index:3;
  opacity:.93;
}

/* 正方形ではない四角形 */

.rect-wide{
  width:34px;
  height:19px;
  border-radius:5px;
}

.rect-tall{
  width:19px;
  height:35px;
  border-radius:6px;
}

.rect-soft{
  width:31px;
  height:25px;
  border-radius:10px 5px 8px 6px;
}

.rect-slant{
  width:32px;
  height:21px;
  border-radius:4px 10px 5px 7px;
}

/* ひし形 */

.diamond{
  width:25px;
  height:25px;
  transform:rotate(45deg);
  border-radius:5px;
}

/* 三角 */

.triangle{
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-bottom:27px solid currentColor;
  background:transparent!important;
}

/* 六角形 */

.hex{
  width:29px;
  height:25px;
  clip-path:polygon(
    25% 0%,
    75% 0%,
    100% 50%,
    75% 100%,
    25% 100%,
    0% 50%
  );
}

/* いびつな多角形 */

.blob{
  width:29px;
  height:27px;
  clip-path:polygon(
    17% 3%,
    76% 0%,
    100% 36%,
    87% 90%,
    35% 100%,
    0% 63%
  );
}

/* 小さな丸 */

.dot{
  width:17px;
  height:17px;
  border-radius:50%;
}

/* 星っぽい形 */

.star{
  width:29px;
  height:29px;
  clip-path:polygon(
    50% 0%,
    61% 35%,
    98% 35%,
    68% 57%,
    79% 95%,
    50% 72%,
    21% 95%,
    32% 57%,
    2% 35%,
    39% 35%
  );
}

/* --------------------------------
   ポテちゃん
-------------------------------- */

.pote{
  position:absolute;
  left:50%;
  top:50%;
  width:58px;
  height:66px;
  transform:translate(-50%,-50%);
  background:#a96f45;
  border-radius:47% 53% 48% 52% / 48% 46% 54% 52%;
  z-index:30;
  box-shadow:0 4px 0 rgba(100,65,40,.10);
}

.pote::before,
.pote::after{
  content:"";
  position:absolute;
  width:7px;
  height:9px;
  background:#493b35;
  border-radius:50%;
  top:25px;
}

.pote::before{
  left:17px;
}

.pote::after{
  right:17px;
}

.mouth{
  position:absolute;
  left:50%;
  top:39px;
  width:13px;
  height:7px;
  transform:translateX(-50%);
  border-bottom:3px solid #493b35;
  border-radius:50%;
}

/* --------------------------------
   下部表示
-------------------------------- */

.result{
  margin-top:18px;
  font-size:13px;
  color:#968983;
  word-break:break-all;
}

.status{
  margin-top:8px;
  font-size:12px;
  color:#b0a39d;
}
</style>
</head>

<body>

<div class="app">

  <h1>ポテコード</h1>
  <div class="sub">文字やURLを、ポテコードに変換</div>

  <textarea
    id="input"
    placeholder="ここに文字・URL・日本語などを入力…"
  ></textarea>

  <button id="make">
    ポテコードを作る
  </button>

  <div class="card">

    <div id="poteCode">

      <!-- 固定マーカー -->
      <div class="marker m1"></div>
      <div class="marker m2"></div>
      <div class="marker m3"></div>

      <!-- ポテちゃん -->
      <div class="pote">
        <div class="mouth"></div>
      </div>

    </div>

    <div class="result" id="result">
      まだポテコードがありません
    </div>

    <div class="status" id="status">
      文字を入力してね
    </div>

  </div>

</div>


<script>

/* =====================================
   ポテコード
===================================== */

const COLORS = [
  "#B8D8D0", // ミント
  "#BFD7EA", // 水色
  "#D8C4E8", // 紫
  "#F1C6C7", // ピンク
  "#F1D49B", // 黄色
  "#D2E2B5", // 黄緑
  "#E8BFA7", // オレンジ
  "#C7C2DF", // 青紫
  "#BFD8C2", // 緑
  "#E6C7D5"  // ローズ
];

const SHAPES = [
  "rect-wide",
  "rect-tall",
  "rect-soft",
  "rect-slant",
  "diamond",
  "triangle",
  "hex",
  "blob",
  "dot",
  "star"
];


/* -------------------------------------
   文字 → バイト
------------------------------------- */

function getBytes(text){

  const encoder = new TextEncoder();

  return Array.from(
    encoder.encode(text)
  );

}


/* -------------------------------------
   ハッシュ
   同じ文字なら同じ模様
------------------------------------- */

function hashText(text){

  let h = 2166136261;

  for(let i=0;i<text.length;i++){

    h ^= text.charCodeAt(i);

    h +=
      (h << 1) +
      (h << 4) +
      (h << 7) +
      (h << 8) +
      (h << 24);

  }

  return Math.abs(h >>> 0);
}


/* -------------------------------------
   4段階データ化
------------------------------------- */

function makeSymbols(bytes){

  const symbols=[];

  for(const b of bytes){

    symbols.push((b >> 6) & 3);
    symbols.push((b >> 4) & 3);
    symbols.push((b >> 2) & 3);
    symbols.push(b & 3);

  }

  return symbols;
}


/* -------------------------------------
   配置
   正方形グリッドではなく、
   ゆるいリング状
------------------------------------- */

function createPositions(){

  const positions=[];

  const rings=[
    {r:43,n:18},
    {r:37,n:20},
    {r:31,n:22},
    {r:25,n:20},
    {r:19,n:16},
    {r:13,n:10}
  ];

  for(const ring of rings){

    for(let i=0;i<ring.n;i++){

      const angle =
        (Math.PI*2*i/ring.n)
        +
        ((ring.r % 7)*0.025);

      positions.push({

        x:50 + Math.cos(angle)*ring.r,
        y:50 + Math.sin(angle)*ring.r

      });

    }

  }

  return positions;
}


const POSITIONS = createPositions();


/* -------------------------------------
   図形を作る
------------------------------------- */

function addShape(container, index, value, seed){

  const p=POSITIONS[index];

  const el=document.createElement("div");

  let shapeIndex =
    (seed +
     index*17 +
     value*7)
    % SHAPES.length;

  let colorIndex =
    (seed*3 +
     index*11 +
     value*13)
    % COLORS.length;

  let rotation =
    ((seed +
      index*23 +
      value*31)
      % 360);

  el.className =
    "shape " +
    SHAPES[shapeIndex];

  el.style.left =
    p.x + "%";

  el.style.top =
    p.y + "%";

  el.style.background =
    COLORS[colorIndex];

  el.style.color =
    COLORS[colorIndex];

  el.style.transform =
    "translate(-50%,-50%) rotate(" +
    rotation +
    "deg)";

  /*
    図形ごとに微妙に大きさを変える
    正方形感をなくす
  */

  const scale =
    0.82 +
    (
      (seed +
       index*5 +
       value*3)
      % 35
    ) / 100;

  el.style.scale=scale;

  container.appendChild(el);

}


/* -------------------------------------
   ポテコード生成
------------------------------------- */

function makeCode(){

  const text=
    document.getElementById("input").value;

  const code=
    document.getElementById("poteCode");

  const result=
    document.getElementById("result");

  const status=
    document.getElementById("status");


  /*
    前回の図形を消す
  */

  code
    .querySelectorAll(".shape")
    .forEach(el=>el.remove());


  if(!text){

    result.textContent=
      "まだポテコードがありません";

    status.textContent=
      "文字を入力してね";

    return;

  }


  const bytes=
    getBytes(text);

  const symbols=
    makeSymbols(bytes);

  const seed=
    hashText(text);


  /*
    全スロットを必ず埋める
    短い文字でもスカスカにしない
  */

  for(
    let i=0;
    i<POSITIONS.length;
    i++
  ){

    let value;

    if(i < symbols.length){

      value=symbols[i];

    }else{

      /*
        ダミー部分も入力文字から
        決定されるので毎回同じ
      */

      value=
        (
          seed +
          i*19 +
          i*i*3
        ) % 4;

    }

    addShape(
      code,
      i,
      value,
      seed
    );

  }


  /*
    表示
  */

  result.textContent=
    text;

  status.textContent=
    "このポテコードは入力内容から生成されています";

}


/* -------------------------------------
   ボタン
------------------------------------- */

document
  .getElementById("make")
  .addEventListener(
    "click",
    makeCode
  );


/*
  Enterではなく
  Ctrl / Command + Enter
*/

document
  .getElementById("input")
  .addEventListener(
    "keydown",
    e=>{

      if(
        (e.ctrlKey || e.metaKey) &&
        e.key==="Enter"
      ){

        makeCode();

      }

    }
  );

</script>

</body>
</html>
