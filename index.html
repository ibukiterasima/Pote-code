<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POTE CODE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f6f0e4;
  color: #554535;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
}

header {
  text-align: center;
  padding: 30px 20px 10px;
}

h1 {
  margin: 0;
  font-size: 30px;
}

.subtitle {
  color: #917d64;
  margin-top: 6px;
}

.panel {
  width: min(94%, 720px);
  margin: 20px auto;
  padding: 22px;
  background: #fffaf0;
  border: 1px solid #dfd0b8;
  border-radius: 24px;
  box-shadow: 0 10px 35px rgba(70,50,20,.08);
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d7c6aa;
  border-radius: 12px;
  font-size: 17px;
  background: white;
  color: #554535;
}

button {
  margin-top: 12px;
  margin-right: 6px;
  padding: 12px 18px;
  border: none;
  border-radius: 12px;
  background: #96724b;
  color: white;
  font-weight: bold;
  font-size: 15px;
}

button.secondary {
  background: #b6a28a;
}

#preview {
  margin-top: 25px;
  display: flex;
  justify-content: center;
}

#code {
  width: min(92vw, 600px);
  height: min(92vw, 600px);
  background: #fffaf0;
  border-radius: 20px;
}

.info {
  text-align: center;
  margin-top: 15px;
  color: #917d64;
  font-size: 13px;
  line-height: 1.7;
}
</style>
</head>

<body>

<header>
  <h1>🥔 POTE CODE</h1>
  <div class="subtitle">
    ポテちゃん界・幾何学データコード
  </div>
</header>

<div class="panel">

<input
  id="data"
  value="P-04721"
  placeholder="入れたいデータ"
>

<br>

<button onclick="generate()">
ポテコードを生成
</button>

<button
  class="secondary"
  onclick="downloadSVG()"
>
SVG保存
</button>

<div id="preview">

<svg
  id="code"
  viewBox="0 0 1000 1000"
  xmlns="http://www.w3.org/2000/svg">
</svg>

</div>

<div class="info">
図形は重ならず、全体が円形にまとまるように配置されます。<br>
中央がポテマーク、右下には周囲に馴染む読み取り基準マーク。
</div>

</div>


<script>

/* ==================================================
   POTE CODE
   円形クラスターバージョン
================================================== */

const svg =
document.getElementById("code");


/* -----------------------------------------------
   ポテちゃんカラー
------------------------------------------------ */

const COLORS = [
  "#79a978",
  "#91b87b",
  "#e4a52f",
  "#d38d45",
  "#5c8fa2",
  "#76a38a",
  "#b78a52",
  "#6d9072"
];


/* -----------------------------------------------
   ハッシュ
------------------------------------------------ */

function hashString(text) {

  let h = 2166136261;

  for (let i = 0; i < text.length; i++) {

    h ^= text.charCodeAt(i);

    h = Math.imul(
      h,
      16777619
    );

  }

  return h >>> 0;
}


/* -----------------------------------------------
   擬似乱数
------------------------------------------------ */

function random(seed) {

  seed ^= seed << 13;
  seed ^= seed >>> 17;
  seed ^= seed << 5;

  return seed >>> 0;
}


/* -----------------------------------------------
   データをビット化
------------------------------------------------ */

function getBits(text) {

  const bytes =
    new TextEncoder().encode(text);

  const bits = [];

  for (const b of bytes) {

    for (let i = 7; i >= 0; i--) {

      bits.push(
        (b >> i) & 1
      );

    }

  }

  return bits;
}


/* -----------------------------------------------
   SVG
------------------------------------------------ */

function addElement(tag, attrs) {

  const el =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      tag
    );

  for (const key in attrs) {

    el.setAttribute(
      key,
      attrs[key]
    );

  }

  svg.appendChild(el);

  return el;
}


/* -----------------------------------------------
   配置済み図形
------------------------------------------------ */

const placed = [];


/* -----------------------------------------------
   重なり判定
------------------------------------------------ */

function overlaps(x, y, size) {

  const gap = 17;

  for (const p of placed) {

    const dx =
      x - p.x;

    const dy =
      y - p.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    if (
      distance <
      size +
      p.size +
      gap
    ) {

      return true;

    }

  }

  return false;
}


/* -----------------------------------------------
   中央ポテちゃんとの距離
------------------------------------------------ */

function nearPote(x, y, size) {

  const dx =
    x - 500;

  const dy =
    y - 500;

  const d =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  return d < 175 + size;

}


/* -----------------------------------------------
   右下基準マーク
------------------------------------------------ */

function nearFinder(x, y, size) {

  const dx =
    x - 825;

  const dy =
    y - 825;

  const d =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  return d < 55 + size;

}


/* -----------------------------------------------
   円形クラスタの中に入っているか
------------------------------------------------ */

function insideCircle(x, y, size) {

  const dx =
    x - 500;

  const dy =
    y - 500;

  const d =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  return d + size < 450;

}


/* -----------------------------------------------
   配置可能か
------------------------------------------------ */

function canPlace(x, y, size) {

  if (
    !insideCircle(
      x,
      y,
      size
    )
  ) {

    return false;

  }

  if (
    nearPote(
      x,
      y,
      size
    )
  ) {

    return false;

  }

  if (
    nearFinder(
      x,
      y,
      size
    )
  ) {

    return false;

  }

  if (
    overlaps(
      x,
      y,
      size
    )
  ) {

    return false;

  }

  return true;
}


/* -----------------------------------------------
   丸
------------------------------------------------ */

function circle(
  x,
  y,
  s,
  color
) {

  addElement(
    "circle",
    {
      cx:x,
      cy:y,
      r:s,
      fill:color
    }
  );

}


/* -----------------------------------------------
   三角
------------------------------------------------ */

function triangle(
  x,
  y,
  s,
  rotation,
  color
) {

  const points = `
    ${x} ${y-s}
    ${x-s} ${y+s}
    ${x+s} ${y+s}
  `;

  addElement(
    "polygon",
    {
      points:points,
      fill:color,
      transform:
      `rotate(${rotation} ${x} ${y})`
    }
  );

}


/* -----------------------------------------------
   四角
------------------------------------------------ */

function square(
  x,
  y,
  s,
  rotation,
  color
) {

  addElement(
    "rect",
    {
      x:x-s,
      y:y-s,
      width:s*2,
      height:s*2,
      rx:s*.15,
      fill:color,
      transform:
      `rotate(${rotation} ${x} ${y})`
    }
  );

}


/* -----------------------------------------------
   ひし形
------------------------------------------------ */

function diamond(
  x,
  y,
  s,
  rotation,
  color
) {

  const points = `
    ${x} ${y-s}
    ${x+s} ${y}
    ${x} ${y+s}
    ${x-s} ${y}
  `;

  addElement(
    "polygon",
    {
      points:points,
      fill:color,
      transform:
      `rotate(${rotation} ${x} ${y})`
    }
  );

}


/* -----------------------------------------------
   棒
------------------------------------------------ */

function bar(
  x,
  y,
  s,
  rotation,
  color
) {

  addElement(
    "rect",
    {
      x:x-5,
      y:y-s,
      width:10,
      height:s*2,
      rx:5,
      fill:color,
      transform:
      `rotate(${rotation} ${x} ${y})`
    }
  );

}


/* -----------------------------------------------
   ポテちゃん
------------------------------------------------ */

function drawPote() {

  /*
   外側リング
  */

  addElement(
    "circle",
    {
      cx:500,
      cy:500,
      r:110,
      fill:"none",
      stroke:"#e2a43b",
      "stroke-width":18
    }
  );


  /*
   周囲の小さな三角
  */

  const p = [
    [500,365,0],
    [635,500,90],
    [500,635,180],
    [365,500,270]
  ];

  for (const q of p) {

    triangle(
      q[0],
      q[1],
      20,
      q[2],
      "#e2a43b"
    );

  }


  /*
   本体
  */

  addElement(
    "ellipse",
    {
      cx:500,
      cy:505,
      rx:67,
      ry:79,
      fill:"#d89543"
    }
  );


  /*
   顔
  */

  circle(
    480,
    495,
    6,
    "#675039"
  );

  circle(
    520,
    495,
    6,
    "#675039"
  );

  circle(
    500,
    518,
    5,
    "#675039"
  );

}


/* -----------------------------------------------
   右下の基準マーク

   ひし形＋小さな点
   ↓
   周囲の図形に紛れる
------------------------------------------------ */

function drawFinder() {

  const x = 825;
  const y = 825;


  diamond(
    x,
    y,
    25,
    0,
    "#91b87b"
  );


  circle(
    x,
    y,
    6,
    "#e2a43b"
  );

}


/* ==================================================
   生成
================================================== */

function generate() {

  const text =
    document.getElementById("data").value;

  if (!text) {

    alert(
      "データを入力してね！"
    );

    return;

  }


  svg.innerHTML = "";

  placed.length = 0;


  /*
   背景
  */

  addElement(
    "rect",
    {
      x:0,
      y:0,
      width:1000,
      height:1000,
      fill:"#fffaf0"
    }
  );


  /*
   データ
  */

  const bits =
    getBits(text);

  let bitIndex = 0;


  /*
   乱数
  */

  let seed =
    hashString(text);


  /*
   ---------------------------------------------
   円形の中に図形を配置
   ---------------------------------------------

   ポイント：

   中央は空ける

   外側に行くほど
   配置できる範囲が広くなる

   → 全体が自然な円形になる
  */


  const TOTAL = 62;


  for (
    let i=0;
    i<TOTAL;
    i++
  ) {

    let placedSuccessfully = false;


    for (
      let attempt=0;
      attempt<500;
      attempt++
    ) {

      /*
       ランダムな角度
      */

      seed =
        random(seed);

      const angle =
        (seed / 4294967296)
        * Math.PI
        * 2;


      /*
       中心からの距離

       sqrtを使うことで
       面積的に均等にする
      */

      seed =
        random(seed);

      const r =
        190 +
        Math.sqrt(
          seed / 4294967296
        )
        * 245;


      const x =
        500 +
        Math.cos(angle) * r;


      const y =
        500 +
        Math.sin(angle) * r;


      /*
       サイズ
      */

      seed =
        random(seed);

      const size =
        14 +
        (seed % 21);


      /*
       重なりチェック
      */

      if (
        !canPlace(
          x,
          y,
          size
        )
      ) {

        continue;

      }


      /*
       データから
       図形を決定
      */

      const b1 =
        bits[
          bitIndex %
          bits.length
        ];

      const b2 =
        bits[
          (bitIndex + 1)
          %
          bits.length
        ];

      bitIndex += 2;


      const type =
        (b1 << 1) | b2;


      /*
       回転
      */

      seed =
        random(seed);

      const rotation =
        seed % 360;


      /*
       色
      */

      seed =
        random(seed);

      const color =
        COLORS[
          seed %
          COLORS.length
        ];


      /*
       描画
      */

      if (type === 0) {

        circle(
          x,
          y,
          size,
          color
        );

      }

      else if (type === 1) {

        triangle(
          x,
          y,
          size,
          rotation,
          color
        );

      }

      else if (type === 2) {

        square(
          x,
          y,
          size,
          rotation,
          color
        );

      }

      else {

        diamond(
          x,
          y,
          size,
          rotation,
          color
        );

      }


      /*
       登録
      */

      placed.push({
        x:x,
        y:y,
        size:size
      });


      placedSuccessfully = true;

      break;

    }

  }


  /*
   中央ポテちゃん
  */

  drawPote();


  /*
   右下基準マーク
  */

  drawFinder();

}


/* -----------------------------------------------
   SVG保存
------------------------------------------------ */

function downloadSVG() {

  const source =
    new XMLSerializer()
    .serializeToString(svg);


  const blob =
    new Blob(
      [source],
      {
        type:"image/svg+xml"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "pote-code.svg";

  a.click();


  URL.revokeObjectURL(url);

}


/* -----------------------------------------------
   初期生成
------------------------------------------------ */

generate();

</script>

</body>
</html>
