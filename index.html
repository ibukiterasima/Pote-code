<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>POTE CODE</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#faf7ef;
  color:#594d40;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.app{
  width:min(720px,100%);
  margin:auto;
  padding:24px 16px 50px;
}

h1{
  text-align:center;
  margin:4px 0;
  font-size:30px;
  letter-spacing:5px;
}

.sub{
  text-align:center;
  font-size:12px;
  opacity:.5;
  margin-bottom:20px;
}

.panel{
  background:#fffdf8;
  border:1px solid #e2d8c8;
  border-radius:25px;
  padding:17px;
  box-shadow:0 12px 35px rgba(70,55,35,.08);
}

textarea{
  width:100%;
  height:90px;
  resize:none;
  padding:14px;
  border:2px solid #ded4c3;
  border-radius:15px;
  outline:none;
  background:#fffefa;
  font-size:16px;
  color:#55493d;
}

textarea:focus{
  border-color:#789d78;
}

.count{
  text-align:right;
  font-size:12px;
  opacity:.5;
  margin-top:5px;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px;
  margin-top:10px;
  background:#789d78;
  color:white;
  font-weight:bold;
  font-size:15px;
}

button.subbtn{
  background:#e8dfd0;
  color:#55493d;
}

#output{
  margin-top:20px;
  display:flex;
  justify-content:center;
}

#output svg{
  width:100%;
  max-width:650px;
  height:auto;
}
</style>
</head>

<body>

<div class="app">

<h1>POTE CODE</h1>

<div class="sub">
COLORFUL GEOMETRIC CODE
</div>

<div class="panel">

<textarea
  id="text"
  maxlength="50"
  placeholder="POTE CODEに入れる文字"></textarea>

<div class="count">
<span id="count">0</span> / 50
</div>

<button onclick="generate()">
POTE CODEを生成
</button>

<button class="subbtn" onclick="saveSVG()">
SVGを保存
</button>

<div id="output"></div>

</div>
</div>


<script>

/* =====================================================
   POTE CODE
   IMAGE-LIKE LAYOUT
   ===================================================== */


/* -----------------------------------------------------
   色
----------------------------------------------------- */

const COLORS = [
  "#7fae7b",
  "#9fc66e",
  "#e6aa2f",
  "#d58b43",
  "#5d91a6",
  "#7da597",
  "#b77d42",
  "#6d946d"
];

let currentSVG = "";


/* -----------------------------------------------------
   文字数
----------------------------------------------------- */

const input =
  document.getElementById("text");

input.addEventListener(
  "input",
  ()=>{
    document.getElementById("count")
      .textContent =
      [...input.value].length;
  }
);


/* =====================================================
   ハッシュ
===================================================== */

function hashString(text){

  let h = 2166136261;

  for(let i=0;i<text.length;i++){

    h ^= text.charCodeAt(i);

    h = Math.imul(
      h,
      16777619
    );
  }

  return h >>> 0;
}


/* =====================================================
   乱数
===================================================== */

function rng(seed){

  return function(){

    seed += 0x6D2B79F5;

    let t = seed;

    t = Math.imul(
      t ^ (t >>> 15),
      t | 1
    );

    t ^= t +
      Math.imul(
        t ^ (t >>> 7),
        t | 61
      );

    return (
      (t ^ (t >>> 14)) >>> 0
    ) / 4294967296;
  };
}


/* =====================================================
   テキスト → ビット
===================================================== */

function makeBits(text){

  const bytes =
    new TextEncoder().encode(text);

  const bits = [];

  /*
    文字数を8bit
  */

  const length =
    Math.min(bytes.length,255);

  for(let i=7;i>=0;i--){

    bits.push(
      (length >> i) & 1
    );

  }


  /*
    本文
  */

  for(const byte of bytes){

    for(let i=7;i>=0;i--){

      bits.push(
        (byte >> i) & 1
      );

    }

  }

  return bits;
}


/* =====================================================
   あの画像の配置
   -----------------------------------------------------
   数字は「図形を置ける場所」

   左右完全対称にはしない。
   少しズレることで手描きっぽくする。
===================================================== */

const DESIGN_SLOTS = [

  /* ===== 最上段 ===== */

  {x:335,y:105,s:68},
  {x:500,y:75,s:70},
  {x:665,y:105,s:68},


  /* ===== 上段 ===== */

  {x:190,y:190,s:55},
  {x:335,y:205,s:70},
  {x:500,y:210,s:70},
  {x:665,y:205,s:70},
  {x:810,y:190,s:55},


  /* ===== 上中段 ===== */

  {x:105,y:300,s:38},
  {x:205,y:320,s:72},
  {x:330,y:315,s:42},
  {x:405,y:315,s:75},
  {x:595,y:315,s:75},
  {x:670,y:315,s:42},
  {x:795,y:320,s:72},
  {x:895,y:300,s:38},


  /* ===== 中央周辺 ===== */

  {x:75,y:410,s:90},
  {x:205,y:420,s:70},
  {x:305,y:405,s:50},
  {x:370,y:390,s:42},

  {x:630,y:390,s:42},
  {x:695,y:405,s:50},
  {x:795,y:420,s:70},
  {x:925,y:410,s:90},


  /* ===== ポテちゃん周辺 ===== */

  {x:345,y:430,s:43},
  {x:395,y:430,s:38},
  {x:605,y:430,s:38},
  {x:655,y:430,s:43},

  {x:345,y:570,s:43},
  {x:395,y:570,s:38},
  {x:605,y:570,s:38},
  {x:655,y:570,s:43},


  /* ===== 中下段 ===== */

  {x:75,y:590,s:78},
  {x:205,y:600,s:70},
  {x:315,y:610,s:42},
  {x:405,y:625,s:58},

  {x:595,y:625,s:58},
  {x:685,y:610,s:42},
  {x:795,y:600,s:70},
  {x:925,y:590,s:78},


  /* ===== 下中段 ===== */

  {x:105,y:700,s:42},
  {x:205,y:720,s:70},
  {x:330,y:715,s:55},
  {x:405,y:720,s:58},
  {x:595,y:720,s:58},
  {x:670,y:715,s:55},
  {x:795,y:720,s:70},
  {x:895,y:700,s:42},


  /* ===== 下段 ===== */

  {x:175,y:815,s:50},
  {x:335,y:830,s:70},
  {x:500,y:835,s:75},
  {x:665,y:830,s:70},
  {x:825,y:815,s:50},


  /* ===== 最下段 ===== */

  {x:335,y:925,s:62},
  {x:500,y:930,s:70},
  {x:665,y:925,s:62}

];


/* =====================================================
   中央ポテちゃん
===================================================== */

function drawPote(){

  return `

  <g>

    <!-- potato -->

    <path
      d="
        M500 390

        C450 380
        410 410
        398 470

        C385 535
        405 605
        470 625

        C535 645
        595 610
        605 545

        C617 470
        580 405
        500 390

        Z
      "
      fill="#b97a3d"
    />


    <!-- eyes -->

    <circle
      cx="465"
      cy="495"
      r="9"
      fill="#584a39"
    />

    <circle
      cx="535"
      cy="495"
      r="9"
      fill="#584a39"
    />


    <!-- mouth -->

    <path
      d="
        M478 535
        Q500 548 522 535
      "
      fill="none"
      stroke="#584a39"
      stroke-width="6"
      stroke-linecap="round"
    />


    <!-- texture -->

    <circle
      cx="430"
      cy="455"
      r="5"
      fill="#99612e"
      opacity=".45"
    />

    <circle
      cx="570"
      cy="565"
      r="5"
      fill="#99612e"
      opacity=".4"
    />

  </g>

  `;
}


/* =====================================================
   中央リング
===================================================== */

function drawCenterRing(){

  let html = "";

  const ringColors = [
    "#e3a32d",
    "#d78c41",
    "#e5a62e",
    "#d58c42",
    "#e2a12e",
    "#d88e42",
    "#e4a42f",
    "#d58b42"
  ];


  for(let i=0;i<8;i++){

    const angle =
      -Math.PI/2 +
      i * Math.PI/4;

    const x =
      500 +
      Math.cos(angle)*155;

    const y =
      505 +
      Math.sin(angle)*155;


    html +=
      drawShape(
        1,
        x,
        y,
        43,
        ringColors[i],
        i*45+90
      );

  }

  return html;
}


/* =====================================================
   図形
===================================================== */

function drawShape(
  type,
  x,
  y,
  size,
  color,
  rotation
){

  if(type === 0){

    return `
      <circle
        cx="${x}"
        cy="${y}"
        r="${size/2}"
        fill="${color}"
      />
    `;
  }


  if(type === 1){

    const h =
      size * .866;

    return `
      <polygon
        points="
          ${x},${y-h/2}
          ${x+size/2},${y+h/2}
          ${x-size/2},${y+h/2}
        "
        fill="${color}"
        transform="
          rotate(${rotation}
          ${x} ${y})
        "
      />
    `;
  }


  if(type === 2){

    return `
      <rect
        x="${x-size/2}"
        y="${y-size/2}"
        width="${size}"
        height="${size}"
        rx="${size*.1}"
        fill="${color}"
        transform="
          rotate(${rotation}
          ${x} ${y})
        "
      />
    `;
  }


  return `
    <polygon
      points="
        ${x},${y-size/2}
        ${x+size/2},${y}
        ${x},${y+size/2}
        ${x-size/2},${y}
      "
      fill="${color}"
      transform="
        rotate(${rotation}
        ${x} ${y})
      "
    />
  `;
}


/* =====================================================
   重なり判定
===================================================== */

function overlaps(
  x,
  y,
  size,
  placed
){

  /*
    少し大きめに判定して
    「ギリギリ接触」も避ける。
  */

  const r =
    size/2 + 10;


  for(const p of placed){

    const dx =
      x-p.x;

    const dy =
      y-p.y;

    const distance =
      Math.sqrt(
        dx*dx + dy*dy
      );


    if(
      distance <
      r + p.r
    ){

      return true;

    }

  }


  return false;
}


/* =====================================================
   生成
===================================================== */

function generate(){

  const text =
    input.value;

  if(!text){

    alert(
      "文字を入力してください。"
    );

    return;
  }


  /*
    ビット
  */

  const bits =
    makeBits(text);


  /*
    デザイン用乱数
  */

  const random =
    rng(
      hashString(text)
    );


  let shapes = "";

  const placed = [];


  /* -------------------------------------------------
     データ図形
     「1なら置く」
  ------------------------------------------------- */

  for(
    let i=0;
    i<bits.length &&
    i<DESIGN_SLOTS.length;
    i++
  ){

    /*
      0 = 何も置かない
      1 = 図形を置く
    */

    if(bits[i] !== 1){

      continue;

    }


    const slot =
      DESIGN_SLOTS[i];


    let size =
      slot.s;


    /*
      衝突した場合は
      サイズを少しずつ縮める
    */

    let finalSize =
      size;

    let ok = false;


    for(let k=0;k<8;k++){

      if(
        !overlaps(
          slot.x,
          slot.y,
          finalSize,
          placed
        )
      ){

        ok = true;
        break;

      }

      finalSize *= .9;

    }


    if(!ok){

      continue;

    }


    const type =
      Math.floor(
        random()*4
      );


    const color =
      COLORS[
        Math.floor(
          random()*COLORS.length
        )
      ];


    const rotation =
      random()*360;


    shapes +=
      drawShape(
        type,
        slot.x,
        slot.y,
        finalSize,
        color,
        rotation
      );


    placed.push({

      x:slot.x,
      y:slot.y,
      r:finalSize/2+10

    });

  }


  /* -------------------------------------------------
     見た目を画像っぽくする
     装飾図形
     
     ※データ領域とは別に配置
     ※重ならない場所だけ採用
  ------------------------------------------------- */

  const decorativeCandidates = [

    [135,135],
    [245,105],
    [755,105],
    [865,140],

    [120,235],
    [880,240],

    [55,500],
    [945,500],

    [125,760],
    [875,755],

    [235,895],
    [765,900],

    [115,875],
    [890,875]

  ];


  for(
    const [x,y]
    of decorativeCandidates
  ){

    /*
      70%くらいで配置
    */

    if(random() > .72){

      continue;

    }


    let size =
      30 +
      random()*48;


    if(
      overlaps(
        x,
        y,
        size,
        placed
      )
    ){

      continue;

    }


    const type =
      Math.floor(
        random()*4
      );


    const color =
      COLORS[
        Math.floor(
          random()*COLORS.length
        )
      ];


    const rotation =
      random()*360;


    shapes +=
      drawShape(
        type,
        x,
        y,
        size,
        color,
        rotation
      );


    placed.push({

      x:x,
      y:y,
      r:size/2+10

    });

  }


  /* =================================================
     右下の目印
  ================================================= */

  const finder = `

    <g>

      <polygon
        points="
          850,805
          895,850
          850,895
          805,850
        "
        fill="#91b878"
      />

      <circle
        cx="850"
        cy="850"
        r="8"
        fill="#e3a52f"
      />

    </g>

  `;


  /* =================================================
     SVG
  ================================================= */

  currentSVG = `

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 1000">

  <!-- background -->

  <rect
    width="1000"
    height="1000"
    rx="45"
    fill="#fffaf0"
  />


  <!--
    colorful geometric layout
  -->

  ${shapes}


  <!-- center decorative ring -->

  ${drawCenterRing()}


  <!-- Pote -->

  ${drawPote()}


  <!-- subtle reference marker -->

  ${finder}

</svg>

`;


  document.getElementById(
    "output"
  ).innerHTML =
    currentSVG;

}


/* =====================================================
   SVG保存
===================================================== */

function saveSVG(){

  if(!currentSVG){

    alert(
      "先にPOTE CODEを生成してください。"
    );

    return;

  }


  const blob =
    new Blob(
      [currentSVG],
      {
        type:"image/svg+xml"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "pote-code.svg";

  a.click();


  URL.revokeObjectURL(url);

}

</script>

</body>
</html>
