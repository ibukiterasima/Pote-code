<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POTE CODE</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#faf7ee;
  color:#574d41;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.app{
  width:min(720px,100%);
  margin:auto;
  padding:25px 18px 50px;
}

h1{
  text-align:center;
  margin:5px 0 3px;
  font-size:31px;
  letter-spacing:5px;
}

.subtitle{
  text-align:center;
  font-size:12px;
  opacity:.5;
  margin-bottom:22px;
}

.panel{
  background:#fffdf8;
  border:1px solid #e2d8c7;
  border-radius:27px;
  padding:18px;
  box-shadow:
    0 10px 35px rgba(80,60,30,.08);
}

input{
  width:100%;
  padding:15px;
  border-radius:15px;
  border:2px solid #ded4c2;
  outline:none;
  background:#fffefa;
  font-size:16px;
  color:#554b40;
}

input:focus{
  border-color:#759c78;
}

button{
  width:100%;
  margin-top:11px;
  padding:15px;
  border:0;
  border-radius:16px;
  background:#759c78;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:#e8dfd0;
  color:#554b40;
}

#output{
  margin-top:20px;
  width:100%;
  display:flex;
  justify-content:center;
}

#output svg{
  width:100%;
  max-width:650px;
  height:auto;
}

.info{
  text-align:center;
  margin-top:12px;
  font-size:11px;
  opacity:.5;
}
</style>
</head>

<body>

<div class="app">

<h1>POTE CODE</h1>

<div class="subtitle">
COLORFUL GEOMETRIC CODE
</div>

<div class="panel">

<input
  id="text"
  type="text"
  placeholder="文字を入力"
/>

<button onclick="generate()">
POTE CODEを生成
</button>

<button
  class="secondary"
  onclick="saveSVG()">
SVGを保存
</button>

<div id="output"></div>

<div class="info">
同じ文字からは同じPOTE CODEになります
</div>

</div>

</div>


<script>

/* =====================================================
   POTE CODE
   BEAUTIFUL EDITION
   ===================================================== */


/* -----------------------------------------------------
   色
----------------------------------------------------- */

const COLORS = [
  "#7fb37d", // green
  "#a9c66d", // yellow green
  "#e5ad32", // yellow
  "#d48d45", // orange
  "#5f91a5", // blue
  "#7da796", // blue green
  "#b47b42", // brown
  "#6c956f"  // dark green
];


/* -----------------------------------------------------
   現在のSVG
----------------------------------------------------- */

let currentSVG = "";


/* -----------------------------------------------------
   ハッシュ
   同じ文字 → 同じ乱数
----------------------------------------------------- */

function hashString(text){

  let h = 2166136261;

  for(let i=0;i<text.length;i++){

    h ^= text.charCodeAt(i);

    h = Math.imul(
      h,
      16777619
    );
  }

  return h >>> 0;
}


/* -----------------------------------------------------
   決定論的乱数
----------------------------------------------------- */

function randomGenerator(seed){

  return function(){

    seed += 0x6D2B79F5;

    let t = seed;

    t = Math.imul(
      t ^ (t >>> 15),
      t | 1
    );

    t ^= t +
      Math.imul(
        t ^ (t >>> 7),
        t | 61
      );

    return (
      (t ^ (t >>> 14)) >>> 0
    ) / 4294967296;
  };
}


/* -----------------------------------------------------
   UTF-8
----------------------------------------------------- */

function textToBytes(text){

  return Array.from(
    new TextEncoder().encode(text)
  );
}


/* -----------------------------------------------------
   CRC
----------------------------------------------------- */

function crc8(data){

  let crc = 0;

  for(const byte of data){

    crc ^= byte;

    for(let i=0;i<8;i++){

      if(crc & 0x80){

        crc =
          ((crc << 1) ^ 0x07)
          & 255;

      }else{

        crc =
          (crc << 1) & 255;

      }
    }
  }

  return crc;
}


/* -----------------------------------------------------
   データ → 2bit図形
----------------------------------------------------- */

function makeSymbols(text){

  const bytes =
    textToBytes(text);

  /*
    最大40byte
  */

  if(bytes.length > 40){

    alert(
      "文字が長すぎます。\n40バイト以内にしてください。"
    );

    return null;
  }


  /*
    POTE
    version
    length
    data
    CRC
  */

  const data = [

    80,
    79,
    84,
    69,

    1,

    bytes.length,

    ...bytes

  ];


  data.push(
    crc8(data)
  );


  /*
    1byte = 4図形

    00 ○
    01 △
    10 □
    11 ◇
  */

  const symbols = [];

  for(const byte of data){

    symbols.push(
      (byte >> 6) & 3
    );

    symbols.push(
      (byte >> 4) & 3
    );

    symbols.push(
      (byte >> 2) & 3
    );

    symbols.push(
      byte & 3
    );
  }

  return symbols;
}


/* =====================================================
   配置
   ===================================================== */

/*
   ここが今回の重要部分。

   綺麗な円周ではなく、

   内側
   ↓
   中間
   ↓
   外側

   の3層にして、
   角度を少しずつズラす。

   ただし位置そのものは
   データとは無関係。

   → Readerが読める。
*/


function createSlots(){

  const slots = [];


  /* -----------------------------
     内側
  ----------------------------- */

  const inner = [
    -90,
    -45,
    0,
    45,
    90,
    135,
    180,
    225
  ];


  inner.forEach(
    (deg,i)=>{

      const rad =
        deg * Math.PI / 180;

      const radius = 175;

      slots.push({

        x:
          500 +
          Math.cos(rad) *
          radius,

        y:
          500 +
          Math.sin(rad) *
          radius,

        layer:"inner"

      });

    }
  );


  /* -----------------------------
     中間
  ----------------------------- */

  const middle = [
    -112,
    -82,
    -52,
    -22,
    10,
    41,
    72,
    104,
    135,
    166,
    197,
    228,
    259
  ];


  middle.forEach(
    (deg,i)=>{

      const rad =
        deg * Math.PI / 180;

      const radius =
        285 + ((i % 3) * 7);

      slots.push({

        x:
          500 +
          Math.cos(rad) *
          radius,

        y:
          500 +
          Math.sin(rad) *
          radius,

        layer:"middle"

      });

    }
  );


  /* -----------------------------
     外側
  ----------------------------- */

  const outer = [
    -160,
    -137,
    -112,
    -88,
    -64,
    -40,
    -16,
    9,
    34,
    59,
    84,
    109,
    134,
    159,
    184,
    209,
    234,
    259
  ];


  outer.forEach(
    (deg,i)=>{

      const rad =
        deg * Math.PI / 180;

      const radius =
        405 + ((i % 4) * 5);

      slots.push({

        x:
          500 +
          Math.cos(rad) *
          radius,

        y:
          500 +
          Math.sin(rad) *
          radius,

        layer:"outer"

      });

    }
  );


  /*
    さらに追加の
    「散らし図形」
  */

  const extras = [

    [130,180],
    [870,185],

    [90,370],
    [910,370],

    [115,635],
    [885,640],

    [175,825],
    [825,825],

    [355,115],
    [645,115],

    [355,885],
    [645,885]

  ];


  extras.forEach(
    p=>{

      slots.push({

        x:p[0],
        y:p[1],
        layer:"extra"

      });

    }
  );


  return slots;
}


/* =====================================================
   図形
   ===================================================== */

function drawShape(
  type,
  x,
  y,
  size,
  color,
  rotation
){

  /*
    ○
  */

  if(type === 0){

    return `
      <circle
        cx="${x}"
        cy="${y}"
        r="${size/2}"
        fill="${color}"
      />
    `;
  }


  /*
    △
  */

  if(type === 1){

    const h =
      size * 0.866;

    return `
      <polygon
        points="
          ${x},${y-h/2}
          ${x+size/2},${y+h/2}
          ${x-size/2},${y+h/2}
        "
        fill="${color}"
        transform="
          rotate(${rotation}
          ${x}
          ${y})
        "
      />
    `;
  }


  /*
    □
  */

  if(type === 2){

    return `
      <rect
        x="${x-size/2}"
        y="${y-size/2}"
        width="${size}"
        height="${size}"
        rx="${size*0.12}"
        fill="${color}"
        transform="
          rotate(${rotation}
          ${x}
          ${y})
        "
      />
    `;
  }


  /*
    ◇
  */

  return `
    <polygon
      points="
        ${x},${y-size/2}
        ${x+size/2},${y}
        ${x},${y+size/2}
        ${x-size/2},${y}
      "
      fill="${color}"
      transform="
        rotate(${rotation}
        ${x}
        ${y})
      "
    />
  `;
}


/* =====================================================
   ポテちゃん
===================================================== */

function drawPote(){

  return `

    <g>

      <!-- potato -->
      <path
        d="
          M500 385

          C445 375
          405 415
          395 475

          C382 545
          405 610
          475 625

          C545 642
          603 600
          608 530

          C615 455
          575 395
          500 385

          Z
        "
        fill="#b8793d"
      />


      <!-- small potato texture -->

      <circle
        cx="425"
        cy="455"
        r="5"
        fill="#9d642f"
        opacity=".45"
      />

      <circle
        cx="570"
        cy="565"
        r="5"
        fill="#9d642f"
        opacity=".45"
      />

      <circle
        cx="455"
        cy="590"
        r="4"
        fill="#9d642f"
        opacity=".4"
      />


      <!-- eyes -->

      <circle
        cx="466"
        cy="490"
        r="10"
        fill="#574b3c"
      />

      <circle
        cx="534"
        cy="490"
        r="10"
        fill="#574b3c"
      />


      <!-- mouth -->

      <path
        d="
          M475 535
          Q500 552
          525 535
        "
        fill="none"
        stroke="#574b3c"
        stroke-width="7"
        stroke-linecap="round"
      />

    </g>

  `;
}


/* =====================================================
   ポテちゃん周囲のリング
===================================================== */

function drawInnerRing(){

  const pieces = [];

  const colors = [
    "#e3a52d",
    "#d98b42",
    "#e4a932",
    "#d38b43",
    "#e0a02d",
    "#d88f42",
    "#e5aa32",
    "#d68d42"
  ];


  for(let i=0;i<8;i++){

    const angle =
      -Math.PI/2 +
      i * Math.PI/4;

    const x =
      500 +
      Math.cos(angle)*155;

    const y =
      500 +
      Math.sin(angle)*155;


    pieces.push(
      drawShape(
        1,
        x,
        y,
        42,
        colors[i],
        i*45+90
      )
    );

  }

  return pieces.join("");
}


/* =====================================================
   Finder
===================================================== */

/*
   右下にあるけど
   QRっぽくしない。
*/

function drawFinder(){

  return `

    <g>

      <polygon
        points="
          850,805
          895,850
          850,895
          805,850
        "
        fill="#91b875"
      />

      <circle
        cx="850"
        cy="850"
        r="9"
        fill="#e4a52f"
      />

    </g>

  `;
}


/* =====================================================
   GENERATE
===================================================== */

function generate(){

  const text =
    document.getElementById(
      "text"
    ).value;


  if(!text){

    alert(
      "文字を入力してください。"
    );

    return;
  }


  const symbols =
    makeSymbols(text);

  if(!symbols) return;


  /*
    配置は固定
  */

  const slots =
    createSlots();


  /*
    色・サイズ・回転だけ
    入力文字から決定。

    同じ文字なら
    同じ見た目。
  */

  const random =
    randomGenerator(
      hashString(text)
    );


  let shapes = "";


  for(
    let i=0;
    i<slots.length;
    i++
  ){

    const slot =
      slots[i];


    /*
      データ部分
    */

    let type;

    if(i < symbols.length){

      type =
        symbols[i];

    }else{

      /*
        残りは装飾
      */

      type =
        Math.floor(
          random()*4
        );

    }


    let size;


    if(slot.layer === "inner"){

      size =
        38 +
        random()*10;

    }else if(
      slot.layer === "middle"
    ){

      size =
        45 +
        random()*15;

    }else if(
      slot.layer === "outer"
    ){

      size =
        50 +
        random()*22;

    }else{

      size =
        35 +
        random()*30;

    }


    const color =
      COLORS[
        Math.floor(
          random()*COLORS.length
        )
      ];


    const rotation =
      random()*360;


    shapes +=
      drawShape(
        type,
        slot.x,
        slot.y,
        size,
        color,
        rotation
      );

  }


  /* -------------------------------------------------
     SVG
  ------------------------------------------------- */

  currentSVG = `

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 1000">

  <!-- background -->

  <rect
    width="1000"
    height="1000"
    rx="50"
    fill="#fffaf0"
  />


  <!-- very subtle outer boundary -->

  <circle
    cx="500"
    cy="500"
    r="465"
    fill="none"
    stroke="#eee4d4"
    stroke-width="3"
  />


  <!-- colorful outer geometry -->

  ${shapes}


  <!-- center decorative ring -->

  ${drawInnerRing()}


  <!-- Pote -->

  ${drawPote()}


  <!-- subtle finder -->

  ${drawFinder()}

</svg>
`;


  document.getElementById(
    "output"
  ).innerHTML =
    currentSVG;

}


/* =====================================================
   SAVE SVG
===================================================== */

function saveSVG(){

  if(!currentSVG){

    alert(
      "先にPOTE CODEを生成してください。"
    );

    return;
  }


  const blob =
    new Blob(
      [currentSVG],
      {
        type:"image/svg+xml"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "pote-code.svg";


  a.click();


  URL.revokeObjectURL(url);

}

</script>

</body>
</html>
