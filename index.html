<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POTE CODE TEST</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f7f2e3;
  color:#66584d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.wrap{
  width:min(1000px,96vw);
  margin:auto;
  padding:30px 12px 50px;
}

.title{
  text-align:center;
  font-size:46px;
  font-weight:800;
  letter-spacing:.24em;
  margin-left:.24em;
}

.subtitle{
  text-align:center;
  margin-top:8px;
  font-size:14px;
  letter-spacing:.32em;
  opacity:.72;
}

.controls{
  width:min(700px,100%);
  margin:25px auto 10px;
  padding:16px;
  background:rgba(255,255,255,.55);
  border-radius:18px;
}

textarea{
  width:100%;
  min-height:70px;
  resize:vertical;
  border:1px solid #d8cdb9;
  border-radius:12px;
  padding:12px;
  background:#fffdf7;
  color:#5d5147;
  font-size:16px;
  outline:none;
}

button{
  border:0;
  border-radius:999px;
  padding:11px 18px;
  margin-top:9px;
  background:#71866c;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.info{
  margin-top:8px;
  font-size:12px;
  line-height:1.7;
}

.codebox{
  width:min(900px,100%);
  margin:auto;
}

svg{
  display:block;
  width:100%;
  height:auto;
}

.test{
  margin-top:10px;
  text-align:center;
  font-size:13px;
  line-height:1.8;
}

.good{
  color:#58734e;
  font-weight:700;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="title">POTE CODE</div>

  <div class="subtitle">
    COLORFUL GEOMETRIC CODE
  </div>

  <div class="controls">

    <textarea
      id="text"
      maxlength="30"
    >ポテちゃん大冒険2026</textarea>

    <button onclick="generate()">
      ポテコードを生成
    </button>

    <button onclick="sample()">
      別の文字でテスト
    </button>

    <div
      class="info"
      id="info">
    </div>

  </div>

  <div class="codebox">

    <svg
      id="svg"
      viewBox="0 0 1500 1500"
      xmlns="http://www.w3.org/2000/svg">
    </svg>

    <div
      class="test"
      id="test">
    </div>

  </div>

</div>


<script>

/*
============================================================
 POTE CODE
============================================================

【データ】

図形の色       → データではない
図形の種類     → データではない
図形の大きさ   → データではない

図形が存在する → 1
図形が存在しない → 0


【角度合わせマーク】

3つの固定マークを追加。

・左上
・右上
・下側

この3点の位置関係から
スキャナーが

 位置
 回転
 大きさ
 傾き

を判断できるようにする。

角度合わせマークは
544個のデータスロットには含まれない。


============================================================
*/


const SVG =
  document.getElementById("svg");

const CENTER = 750;


/*
------------------------------------------------------------
 色
------------------------------------------------------------
*/

const COLORS = [
  "#8AAA76",
  "#E1A83F",
  "#D78949",
  "#5D9099",
  "#A5AA60",
  "#759B70"
];


/*
------------------------------------------------------------
 固定乱数
------------------------------------------------------------
*/

let seed = 9283746;

function random(){

  seed =
    (seed * 1664525 + 1013904223)
    >>> 0;

  return seed / 4294967296;
}


/*
============================================================
 544個の固定スロット
============================================================
*/

const SLOT_COUNT = 544;

const slots = [];


function createSlots(){

  seed = 9283746;

  const result = [];

  const MIN_R = 150;
  const MAX_R = 675;

  const MIN_DISTANCE = 31;

  let safety = 0;

  while(
    result.length < SLOT_COUNT &&
    safety < 300000
  ){

    safety++;

    const r =
      Math.sqrt(
        random() *
        (
          MAX_R*MAX_R -
          MIN_R*MIN_R
        ) +
        MIN_R*MIN_R
      );

    const angle =
      random() *
      Math.PI * 2;

    const x =
      CENTER +
      Math.cos(angle)*r;

    const y =
      CENTER +
      Math.sin(angle)*r;


    let ok = true;

    for(const p of result){

      const dx=x-p.x;
      const dy=y-p.y;

      if(
        dx*dx+dy*dy <
        MIN_DISTANCE*MIN_DISTANCE
      ){

        ok=false;
        break;

      }

    }


    if(ok){

      result.push({x,y});

    }

  }


  return result;

}


const DATA_SLOTS =
  createSlots();


/*
============================================================
 SVG helper
============================================================
*/

function el(name,attrs={}){

  const e =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      name
    );

  for(const key in attrs){

    e.setAttribute(
      key,
      attrs[key]
    );

  }

  return e;

}


/*
============================================================
 データ
============================================================
*/

function textBits(text){

  const bits=[];

  for(let i=0;i<30;i++){

    const code =
      i<text.length
      ? text.charCodeAt(i)
      : 0;

    for(let b=15;b>=0;b--){

      bits.push(
        (code>>b)&1
      );

    }

  }

  return bits;

}


/*
------------------------------------------------------------
 CRC8
------------------------------------------------------------
*/

function crc8(bits){

  let crc=0;

  for(const bit of bits){

    const mix =
      ((crc>>7)&1)^bit;

    crc =
      ((crc<<1)&255);

    if(mix){

      crc ^= 0x07;

    }

  }

  return crc;

}


/*
------------------------------------------------------------
 bits → 数値
------------------------------------------------------------
*/

function bitsToNumber(bits){

  let n=0;

  for(const b of bits){

    n =
      n*2+b;

  }

  return n;

}


/*
------------------------------------------------------------
 組み合わせ数
------------------------------------------------------------
*/

function C(n,k){

  if(k<0 || k>n){

    return 0;

  }

  k=Math.min(k,n-k);

  let r=1;

  for(let i=1;i<=k;i++){

    r =
      r*(n-k+i)/i;

  }

  return Math.round(r);

}


/*
------------------------------------------------------------
 29bit → 32スロット
------------------------------------------------------------
*/

function unrank(rank){

  const bits=[];

  let ones=16;

  let r=rank;


  for(let i=0;i<32;i++){

    if(ones===0){

      bits.push(0);
      continue;

    }

    if(ones===32-i){

      bits.push(1);
      ones--;

      continue;

    }


    const zeroCount =
      C(
        31-i,
        ones
      );


    if(r < zeroCount){

      bits.push(0);

    }else{

      bits.push(1);

      r -= zeroCount;

      ones--;

    }

  }


  return bits;

}


/*
============================================================
 データパケット
============================================================
*/

function makePacket(text){

  const length =
    text.length;

  const body =
    textBits(text);

  const bits=[];


  for(let i=4;i>=0;i--){

    bits.push(
      (length>>i)&1
    );

  }


  bits.push(...body);


  const crc =
    crc8(body);


  for(let i=7;i>=0;i--){

    bits.push(
      (crc>>i)&1
    );

  }


  return bits;

}


/*
============================================================
 493bit → 544スロット
============================================================
*/

function encode(text){

  const packet =
    makePacket(text);

  const groups=[];


  for(
    let g=0;
    g<17;
    g++
  ){

    const chunk =
      packet.slice(
        g*29,
        g*29+29
      );


    while(chunk.length<29){

      chunk.push(0);

    }


    const value =
      bitsToNumber(chunk);


    groups.push(
      unrank(value)
    );

  }


  return groups.flat();

}


/*
============================================================
 データ図形
============================================================
*/

function drawShape(
  x,y,
  size,
  type,
  color
){

  let shape;


  if(type===0){

    shape =
      el("circle",{
        cx:x,
        cy:y,
        r:size,
        fill:color
      });

  }


  else if(type===1){

    shape =
      el("rect",{
        x:x-size,
        y:y-size,
        width:size*2,
        height:size*2,
        rx:size*.35,
        fill:color
      });

  }


  else if(type===2){

    shape =
      el("polygon",{

        points:
          `${x},${y-size*1.15} `+
          `${x+size},${y+size*.8} `+
          `${x-size},${y+size*.8}`,

        fill:color

      });

  }


  else if(type===3){

    shape =
      el("polygon",{

        points:
          `${x},${y-size} `+
          `${x+size},${y} `+
          `${x},${y+size} `+
          `${x-size},${y}`,

        fill:color

      });

  }


  else{

    shape =
      el("rect",{

        x:x-size*1.35,
        y:y-size*.65,

        width:size*2.7,
        height:size*1.3,

        rx:size*.35,

        fill:color

      });

  }


  return shape;

}


/*
============================================================
 角度合わせマーク
============================================================

QRの四角いファインダーパターンではなく、

「POTE CODEの装飾図形」

として見える3点。

位置関係は固定。

この3点だけをスキャナーが
基準点として使用する。
============================================================
*/

function drawAlignmentMark(
  x,
  y,
  scale,
  rotation,
  color1,
  color2
){

  const g =
    el("g",{
      transform:
        `translate(${x} ${y}) `+
        `rotate(${rotation})`
    });

  /*
    大きめの有機的な丸
  */

  g.appendChild(
    el("circle",{
      cx:0,
      cy:0,
      r:scale,
      fill:color1
    })
  );


  /*
    内側の小さな丸

    完全なQRパターンにはしない。
  */

  g.appendChild(
    el("circle",{
      cx:scale*.05,
      cy:scale*.05,
      r:scale*.32,
      fill:color2,
      opacity:.95
    })
  );


  /*
    ちょっとずらした小粒

    「マーク」感を弱めて
    周囲の装飾に馴染ませる。
  */

  g.appendChild(
    el("circle",{
      cx:scale*.78,
      cy:scale*.55,
      r:scale*.16,
      fill:color2,
      opacity:.9
    })
  );


  g.dataset.alignment =
    "true";


  return g;

}


/*
============================================================
 POTE CODE本体
============================================================
*/

function drawCode(text){

  while(SVG.firstChild){

    SVG.removeChild(
      SVG.firstChild
    );

  }


  /*
  ----------------------------------------------------------
   背景
  ----------------------------------------------------------
  */

  SVG.appendChild(
    el("rect",{
      x:0,
      y:0,
      width:1500,
      height:1500,
      fill:"#FFFDF5"
    })
  );


  /*
  ----------------------------------------------------------
   データ
  ----------------------------------------------------------
  */

  const bits =
    encode(text);


  let onCount=0;


  for(
    let i=0;
    i<SLOT_COUNT;
    i++
  ){

    if(bits[i]!==1){

      continue;

    }


    onCount++;


    const p =
      DATA_SLOTS[i];


    /*
      形は固定
    */

    const type =
      i%5;


    /*
      サイズは固定
    */

    let size;


    if(i%23===0){

      size=22;

    }

    else if(i%13===0){

      size=18;

    }

    else if(i%7===0){

      size=14;

    }

    else{

      size=9+(i%4);

    }


    /*
      色は固定
    */

    const color =
      COLORS[
        (i*7)%COLORS.length
      ];


    const shape =
      drawShape(
        p.x,
        p.y,
        size,
        type,
        color
      );


    shape.dataset.slot=i;
    shape.dataset.bit="1";


    SVG.appendChild(shape);

  }


  /*
  ========================================================
   3つの角度合わせマーク
  ========================================================
  */

  /*
    左上
  */

  SVG.appendChild(
    drawAlignmentMark(
      235,
      350,
      30,
      -18,
      "#759B70",
      "#E1A83F"
    )
  );


  /*
    右上

    左上とは少し形の雰囲気を変えるが
    中心位置は完全固定。
  */

  SVG.appendChild(
    drawAlignmentMark(
      1265,
      350,
      30,
      18,
      "#D78949",
      "#8AAA76"
    )
  );


  /*
    下側

    3点目。
  */

  SVG.appendChild(
    drawAlignmentMark(
      750,
      1270,
      30,
      0,
      "#5D9099",
      "#E1A83F"
    )
  );


  /*
  ========================================================
   中央ポテちゃん
  ========================================================
  */

  const pote =
    el("g",{
      "data-fixed":"pote-mark"
    });


  /*
    本体
  */

  pote.appendChild(
    el("circle",{
      cx:750,
      cy:750,
      r:88,
      fill:"#D99A3D"
    })
  );


  /*
    じゃがいもの陰
  */

  pote.appendChild(
    el("path",{
      d:"M695 700 Q672 750 695 800",
      fill:"none",
      stroke:"#C88340",
      "stroke-width":"8",
      "stroke-linecap":"round",
      opacity:.65
    })
  );


  /*
    目
  */

  pote.appendChild(
    el("circle",{
      cx:722,
      cy:742,
      r:8,
      fill:"#51483F"
    })
  );

  pote.appendChild(
    el("circle",{
      cx:778,
      cy:742,
      r:8,
      fill:"#51483F"
    })
  );


  /*
    ほっぺ
  */

  pote.appendChild(
    el("circle",{
      cx:705,
      cy:776,
      r:9,
      fill:"#C98242",
      opacity:.7
    })
  );

  pote.appendChild(
    el("circle",{
      cx:795,
      cy:776,
      r:9,
      fill:"#C98242",
      opacity:.7
    })
  );


  /*
    口
  */

  pote.appendChild(
    el("path",{
      d:"M734 765 Q750 780 766 765",
      fill:"none",
      stroke:"#51483F",
      "stroke-width":"6",
      "stroke-linecap":"round"
    })
  );


  SVG.appendChild(pote);


  /*
  ========================================================
   外周のごく薄い円
  ========================================================
  */

  SVG.appendChild(
    el("circle",{
      cx:750,
      cy:750,
      r:680,
      fill:"none",
      stroke:"#D7CAB0",
      "stroke-width":"2",
      opacity:.3
    })
  );


  /*
  ========================================================
   情報
  ========================================================
  */

  document.getElementById("info").innerHTML =
    `文字数：${text.length} / 30<br>`+
    `固定スロット：544個<br>`+
    `表示図形：${onCount}個 / 544個<br>`+
    `角度合わせマーク：3個<br>`+
    `データ判定：<b>図形の「ある・ない」のみ</b>`;


  document.getElementById("test").innerHTML =
    `<span class="good">✓ POTE CODE生成成功</span><br>`+
    `3つの角度合わせマークを固定配置しています。<br>`+
    `色・図形種類・大きさはデータ判定に使用していません。`;

}


/*
============================================================
 サンプル
============================================================
*/

function sample(){

  const samples=[

    "ポテちゃん",

    "ポテちゃん大冒険",

    "こんにちはポテちゃん！",

    "POTE CODE",

    "POTE CODE 2026",

    "森のカフェへようこそ",

    "ポテちゃんの世界",

    "ゲームを作っています",

    "1234567890 ABCDEFGHI",

    "ポテゲーム研究部"

  ];


  const value =
    samples[
      Math.floor(
        Math.random()*samples.length
      )
    ];


  document.getElementById("text")
    .value=value;


  generate();

}


/*
============================================================
 生成
============================================================
*/

function generate(){

  const text =
    document.getElementById("text")
      .value;


  if(!text){

    alert("文字を入力してください。");

    return;

  }


  if(text.length>30){

    alert(
      "30文字まで入力できます。"
    );

    return;

  }


  drawCode(text);

}


/*
============================================================
 初期表示
============================================================
*/

generate();

</script>

</body>
</html>
