<script>

/* =========================================================
   POTE CODE
   大きめ図形テスト版

   データ：
   「図形がある」 = 1
   「図形がない」 = 0

   色・形・色の違いはデータではない。
   ========================================================= */


/* ---------------------------------------------------------
   基本設定
--------------------------------------------------------- */

const SVG =
  document.getElementById("svg");

const CENTER = 750;

const SLOT_COUNT = 544;


/* ---------------------------------------------------------
   色
   ※色は完全に装飾用
--------------------------------------------------------- */

const COLORS = [
  "#8AAA76",
  "#E1A83F",
  "#D78949",
  "#5D9099",
  "#A5AA60",
  "#759B70"
];


/* ---------------------------------------------------------
   固定乱数
   --------------------------------------------------------- */

let seed = 9283746;

function random(){

  seed =
    (seed * 1664525 + 1013904223)
    >>> 0;

  return seed / 4294967296;
}


/* =========================================================
   データスロット
   =========================================================

   全ポテコードで同じ位置。

   ただし、データによって
   表示される図形だけが変わる。
   ========================================================= */

function createSlots(){

  seed = 9283746;

  const result = [];

  const MIN_R = 175;
  const MAX_R = 665;

  /*
    図形を大きくしたので、
    スロット同士の距離も確保。
  */
  const MIN_DISTANCE = 34;

  let safety = 0;

  while(
    result.length < SLOT_COUNT &&
    safety < 500000
  ){

    safety++;

    const r =
      Math.sqrt(
        random() *
        (
          MAX_R * MAX_R -
          MIN_R * MIN_R
        ) +
        MIN_R * MIN_R
      );

    const angle =
      random() *
      Math.PI * 2;

    const x =
      CENTER +
      Math.cos(angle) * r;

    const y =
      CENTER +
      Math.sin(angle) * r;


    let ok = true;


    /*
      中央ポテちゃんの領域には
      データ図形を置かない。
    */

    const dx = x - CENTER;
    const dy = y - CENTER;

    if(
      dx*dx + dy*dy <
      150*150
    ){

      ok = false;

    }


    /*
      既存図形との距離
    */

    if(ok){

      for(const p of result){

        const px = x - p.x;
        const py = y - p.y;

        if(
          px*px + py*py <
          MIN_DISTANCE*MIN_DISTANCE
        ){

          ok = false;
          break;

        }

      }

    }


    if(ok){

      result.push({
        x:x,
        y:y
      });

    }

  }


  return result;
}


const DATA_SLOTS =
  createSlots();


/* =========================================================
   SVG部品
========================================================= */

function el(name,attrs={}){

  const e =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      name
    );

  for(const key in attrs){

    e.setAttribute(
      key,
      attrs[key]
    );

  }

  return e;
}


/* =========================================================
   データ変換
========================================================= */


/*
  30文字 × UTF-16 16bit
  = 480bit

  文字数5bit
  CRC8bit

  合計493bit
*/

function textBits(text){

  const bits=[];


  for(let i=0;i<30;i++){

    const code =
      i < text.length
      ? text.charCodeAt(i)
      : 0;


    for(let b=15;b>=0;b--){

      bits.push(
        (code >> b) & 1
      );

    }

  }


  return bits;
}


/* ---------------------------------------------------------
   CRC8
--------------------------------------------------------- */

function crc8(bits){

  let crc=0;


  for(const bit of bits){

    const mix =
      ((crc >> 7) & 1) ^ bit;

    crc =
      ((crc << 1) & 255);


    if(mix){

      crc ^= 0x07;

    }

  }


  return crc;
}


/* ---------------------------------------------------------
   bits → 数値
--------------------------------------------------------- */

function bitsToNumber(bits){

  let n=0;


  for(const b of bits){

    n =
      n * 2 + b;

  }


  return n;
}


/* ---------------------------------------------------------
   組み合わせ
--------------------------------------------------------- */

function C(n,k){

  if(k < 0 || k > n){

    return 0;

  }


  k =
    Math.min(
      k,
      n-k
    );


  let r=1;


  for(
    let i=1;
    i<=k;
    i++
  ){

    r =
      r * (n-k+i) / i;

  }


  return Math.round(r);
}


/* ---------------------------------------------------------
   32スロット中16個をON

   必ず半分が図形になる。
--------------------------------------------------------- */

function unrank(rank){

  const bits=[];

  let ones=16;

  let r=rank;


  for(let i=0;i<32;i++){

    if(ones===0){

      bits.push(0);

      continue;

    }


    if(ones === 32-i){

      bits.push(1);

      ones--;

      continue;

    }


    const zeroCount =
      C(
        31-i,
        ones
      );


    if(r < zeroCount){

      bits.push(0);

    }
    else{

      bits.push(1);

      r -= zeroCount;

      ones--;

    }

  }


  return bits;
}


/* =========================================================
   データパケット
========================================================= */

function makePacket(text){

  const body =
    textBits(text);

  const bits=[];


  /*
    文字数
  */

  for(let i=4;i>=0;i--){

    bits.push(
      (text.length >> i) & 1
    );

  }


  /*
    本文
  */

  bits.push(...body);


  /*
    CRC
  */

  const crc =
    crc8(body);


  for(let i=7;i>=0;i--){

    bits.push(
      (crc >> i) & 1
    );

  }


  return bits;
}


/* =========================================================
   493bit → 544個の固定スロット
========================================================= */

function encode(text){

  const packet =
    makePacket(text);

  const groups=[];


  for(let g=0;g<17;g++){

    const chunk =
      packet.slice(
        g*29,
        g*29+29
      );


    while(chunk.length < 29){

      chunk.push(0);

    }


    const value =
      bitsToNumber(chunk);


    groups.push(
      unrank(value)
    );

  }


  return groups.flat();
}


/* =========================================================
   図形描画
========================================================= */

function drawShape(
  x,
  y,
  size,
  type,
  color
){

  let shape;


  /*
    丸
  */

  if(type === 0){

    shape =
      el("circle",{

        cx:x,
        cy:y,
        r:size,

        fill:color

      });

  }


  /*
    角丸四角
  */

  else if(type === 1){

    shape =
      el("rect",{

        x:x-size,
        y:y-size,

        width:size*2,
        height:size*2,

        rx:size*.32,

        fill:color

      });

  }


  /*
    三角
  */

  else if(type === 2){

    shape =
      el("polygon",{

        points:
          `${x},${y-size*1.15} `+
          `${x+size},${y+size*.8} `+
          `${x-size},${y+size*.8}`,

        fill:color

      });

  }


  /*
    ダイヤ
  */

  else if(type === 3){

    shape =
      el("polygon",{

        points:
          `${x},${y-size} `+
          `${x+size},${y} `+
          `${x},${y+size} `+
          `${x-size},${y}`,

        fill:color

      });

  }


  /*
    横長角丸
  */

  else{

    shape =
      el("rect",{

        x:x-size*1.35,
        y:y-size*.65,

        width:size*2.7,
        height:size*1.3,

        rx:size*.35,

        fill:color

      });

  }


  return shape;
}

function drawDecorations(){

    const d of DECORATIONS
  ){

    SVG.appendChild(
      el("circle",{

        cx:d[0],
        cy:d[1],
        r:d[2],

        fill:d[3]

      })
    );

  }

}


/* =========================================================
   データ図形
========================================================= */

function drawData(text){

  const bits =
    encode(text);


  let count=0;


  for(
    let i=0;
    i<DATA_SLOTS.length;
    i++
  ){

    /*
      0なら何も描かない。

      これが重要。
    */

    if(bits[i] !== 1){

      continue;

    }


    count++;


    const p =
      DATA_SLOTS[i];


    /*
      図形の形は固定。

      データではない。
    */

    const type =
      i % 5;


    /*
      今回は前より大きく。

      小：
      13～16px

      中：
      20px前後

      大：
      25px前後

      特大：
      30px
    */

    let size;


    if(i % 23 === 0){

      size = 30;

    }

    else if(i % 13 === 0){

      size = 25;

    }

    else if(i % 7 === 0){

      size = 20;

    }

    else{

      size =
        13 + (i % 4);

    }


    /*
      色は位置によって固定。

      文章とは無関係。
    */

    const color =
      COLORS[
        (i * 7) %
        COLORS.length
      ];


    const shape =
      drawShape(
        p.x,
        p.y,
        size,
        type,
        color
      );


    /*
      読み取り用。

      ONの場所にだけ
      data-bit="1" が存在。
    */

    shape.dataset.slot = i;
    shape.dataset.bit = "1";


    SVG.appendChild(shape);

  }


  return count;

}

/* =========================================================
   全体生成
========================================================= */

function drawCode(text){

  while(SVG.firstChild){

    SVG.removeChild(
      SVG.firstChild
    );

  }


  /*
    背景
  */

  SVG.appendChild(
    el("rect",{

      x:0,
      y:0,

      width:1500,
      height:1500,

      fill:"#FFFDF5"

    })
  );


  /*
    大きな固定図形
  */

  drawLargeShapes();


  /*
    データ図形

    「ある / ない」
  */

  const count =
    drawData(text);


  /*
    小さい装飾
  */

  drawDecorations();


  /*
    中央ポテちゃん
  */

  drawPote();


  /*
    外周
  */

  drawOuter();


  /*
    情報
  */

  document.getElementById("info")
    .innerHTML =
      `文字数：${text.length} / 30<br>`+
      `固定スロット：544個<br>`+
      `表示図形：約${count}個<br>`+
      `<b>データ判定：図形が「ある / ない」のみ</b>`;


  document.getElementById("test")
    .innerHTML =
      `<span class="good">✓ POTE CODE生成完了</span><br>`+
      `色・図形の種類・大きさはデータに使用していません。`;

}


/* =========================================================
   生成
========================================================= */

function generate(){

  const text =
    document
      .getElementById("text")
      .value;


  if(!text){

    alert(
      "文字を入力してください。"
    );

    return;

  }


  if(
    Array.from(text).length > 30
  ){

    alert(
      "30文字まで入力できます。"
    );

    return;

  }


  drawCode(text);

}

  ];

    .getElementById("text")
    .value =
      samples[
        Math.floor(
          Math.random() *
          samples.length
        )
      ];


  generate();

}
