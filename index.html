/* =====================================================
   小図形データスロット

   528個作る。

   16個 = 1グループ
   33グループ

   ★位置はこのページを開くたび
     同じになる。

   ★データによって移動しない。

===================================================== */

const MICRO_SLOTS = [];


/* =====================================================
   固定乱数
===================================================== */

function fixedRandom(){

  let seed = 739271;

  return function(){

    seed =
      (Math.imul(
        seed ^ (seed >>> 16),
        2246822519
      )) >>> 0;

    seed += 3266489917;

    seed =
      (seed ^ (seed >>> 13)) >>> 0;

    return seed / 4294967296;

  };

}


/* =====================================================
   大図形との距離
===================================================== */

function isNearLargeShape(x,y,r){

  for(const s of LARGE_SHAPES){

    const dx=x-s.x;
    const dy=y-s.y;

    const d=Math.sqrt(
      dx*dx+dy*dy
    );

    /*
      大図形の周囲には
      小図形を置かない
    */

    if(
      d <
      s.s*0.58+r+8
    ){

      return true;

    }

  }

  return false;

}


/* =====================================================
   小図形スロット生成

   ランダムではない。

   固定seedなので
   毎回完全に同じ座標。
===================================================== */

function createMicroSlots(){

  const rand=fixedRandom();

  const slots=[];

  const maxSlots=528;

  let tries=0;

  while(
    slots.length<maxSlots &&
    tries<300000
  ){

    tries++;


    /*
      円形の範囲に配置
    */

    const x=
      60+
      rand()*890;

    const y=
      48+
      rand()*1035;


    /*
      中央ポテちゃんの領域
    */

    const dx=x-505;
    const dy=y-575;

    const centerDistance=
      Math.sqrt(
        dx*dx+dy*dy
      );


    if(centerDistance<155){

      continue;

    }


    /*
      外周の外側には出しすぎない
    */

    const outerX=
      (x-505)/455;

    const outerY=
      (y-575)/535;

    if(
      outerX*outerX+
      outerY*outerY >
      1
    ){

      continue;

    }


    const r=5.3;


    /*
      大図形との重なり防止
    */

    if(
      isNearLargeShape(
        x,y,r
      )
    ){

      continue;

    }


    /*
      小図形同士も重ならない
    */

    let collision=false;

    for(const p of slots){

      const px=x-p.x;
      const py=y-p.y;

      const d=Math.sqrt(
        px*px+py*py
      );

      if(d<14){

        collision=true;
        break;

      }

    }


    if(collision){

      continue;

    }


    slots.push({
      x,
      y,
      size:9,
      type:
        Math.floor(
          rand()*4
        ),
      color:
        COLORS[
          Math.floor(
            rand()*COLORS.length
          )
        ],
      rot:
        Math.floor(
          rand()*12
        )*30
    });

  }


  /*
    足りなかった場合は
    安全な固定格子から追加
  */

  if(slots.length<maxSlots){

    for(
      let y=55;
      y<1080 &&
      slots.length<maxSlots;
      y+=18
    ){

      for(
        let x=55;
        x<980 &&
        slots.length<maxSlots;
        x+=18
      ){

        const r=5.3;

        if(
          isNearLargeShape(
            x,y,r
          )
        ){

          continue;

        }

        const dx=x-505;
        const dy=y-575;

        if(
          Math.sqrt(
            dx*dx+dy*dy
          )<155
        ){

          continue;

        }

        let ok=true;

        for(const p of slots){

          const dx2=x-p.x;
          const dy2=y-p.y;

          if(
            Math.sqrt(
              dx2*dx2+
              dy2*dy2
            )<14
          ){

            ok=false;
            break;

          }

        }

        if(!ok) continue;

        slots.push({
          x,
          y,
          size:9,
          type:
            slots.length%4,
          color:
            COLORS[
              slots.length%
              COLORS.length
            ],
          rot:
            (slots.length%12)*30
        });

      }

    }

  }


  return slots.slice(
    0,
    maxSlots
  );

}


MICRO_SLOTS.push(

/* =====================================================
   組み合わせテーブル

   16個のうち8個だけON。

   C(16,8)=12870通り。

   そのうち8192通りを
   13bitデータに割り当てる。

   ★必ず8個ONになるので、
     どのPOTE CODEも
     小図形の密度が同じ。

===================================================== */

const PATTERNS=[];


function createPatterns(){

  for(
    let mask=0;
    mask<(1<<16);
    mask++
  ){

    let count=0;

    for(let i=0;i<16;i++){

      if(mask&(1<<i)){
        count++;
      }

    }

    if(count===8){

      PATTERNS.push(mask);

      if(PATTERNS.length>=8192){

        break;

      }

    }

  }

}

createPatterns();


/* =====================================================
   CRC16
===================================================== */

function crc16(bytes){

  let crc=0xFFFF;

  for(const b of bytes){

    crc ^= b;

    for(let i=0;i<8;i++){

      if(crc&1){

        crc=
          (crc>>1)^0xA001;

      }else{

        crc>>=1;

      }

    }

  }

  return crc&0xFFFF;

}


/* =====================================================
   16bit
===================================================== */

function bits16(n){

  const result=[];

  for(
    let i=15;
    i>=0;
    i--
  ){

    result.push(
      (n>>i)&1
    );

  }

  return result;

}


/* =====================================================
   データ作成

   UTF-16なので
   日本語1文字=16bit。

   25文字
   =400bit
===================================================== */

function makeBits(text){

  const chars=
    Array.from(text);


  if(chars.length>25){

    return null;

  }


  const bits=[];


  /*
    文字数 8bit
  */

  for(
    let i=7;
    i>=0;
    i--
  ){

    bits.push(
      (chars.length>>i)&1
    );

  }


  /*
    UTF-16 code unit

    普通の日本語は
    1文字=16bit
  */

  const units=[];

  for(const ch of chars){

    const code=
      ch.charCodeAt(0);

    units.push(code);

  }


  for(const code of units){

    bits.push(
      ...bits16(code)
    );

  }


  /*
    CRC

    UTF-16 code unitを
    2byteとして計算
  */

  const crcBytes=[];

  for(const code of units){

    crcBytes.push(
      code>>8,
      code&255
    );

  }


  const crc=
    crc16(crcBytes);


  bits.push(
    (crc>>8)&255,
    crc&255
  );


  return bits;

}


/* =====================================================
   ビットを13bitずつ
   組み合わせに変換
===================================================== */

function encodeBits(bits){

  const result=[];


  /*
    429bitにする
  */

  while(bits.length<429){

    bits.push(0);

  }


  for(
    let start=0;
    start<429;
    start+=13
  ){

    let value=0;

    for(let j=0;j<13;j++){

      value=
        (value<<1)|
        bits[start+j];

    }


    /*
      valueは0〜8191

      それを
      16スロット中8個ON
      のパターンにする。
    */

    result.push(
      PATTERNS[value]
    );

  }


  return result;

}


/* =====================================================
   図形描画
===================================================== */

function drawShape(
  type,
  x,
  y,
  size,
  color,
  rotation
){

  if(type==="circle"){

    return `
      <circle
        cx="${x}"
        cy="${y}"
        r="${size/2}"
        fill="${color}"
      />
    `;

  }


  if(type==="rect"){

    return `
      <rect
        x="${x-size/2}"
        y="${y-size*.31}"
        width="${size}"
        height="${size*.62}"
        rx="${size*.08}"
        fill="${color}"
        transform="
          rotate(
            ${rotation}
            ${x}
            ${y}
          )
        "
      />
    `;

  }


  if(type==="triangle"){

    const h=size*.88;

    return `
      <polygon
        points="
          ${x},${y-h/2}
          ${x+size/2},${y+h/2}
          ${x-size/2},${y+h/2}
        "
        fill="${color}"
        transform="
          rotate(
            ${rotation}
            ${x}
            ${y}
          )
        "
      />
    `;

  }


  if(type==="diamond"){

    return `
      <polygon
        points="
          ${x},${y-size/2}
          ${x+size/2},${y}
          ${x},${y+size/2}
          ${x-size/2},${y}
        "
        fill="${color}"
      />
    `;

  }


  if(type==="line"){

    return `
      <rect
        x="${x-size*.13}"
        y="${y-size/2}"
        width="${size*.26}"
        height="${size}"
        rx="${size*.13}"
        fill="${color}"
        transform="
          rotate(
            ${rotation}
            ${x}
            ${y}
          )
        "
      />
    `;

  }


  if(type==="leaf"){

    return `
      <path
        d="
          M ${x-size*.48} ${y}
          Q ${x-size*.05} ${y-size*.55}
            ${x+size*.48} ${y-size*.1}
          Q ${x+size*.15} ${y+size*.38}
            ${x-size*.48} ${y}
          Z
        "
        fill="${color}"
        transform="
          rotate(
            ${rotation}
            ${x}
            ${y}
          )
        "
      />
    `;

  }


  if(type==="corner"){

    return `
      <path
        d="
          M ${x-size/2} ${y-size/2}
          L ${x+size/2} ${y-size/2}
          L ${x+size/2} ${y+size/2}
          Z
        "
        fill="${color}"
        transform="
          rotate(
            ${rotation}
            ${x}
            ${y}
          )
        "
      />
    `;

  }

  return "";

}


/* =====================================================
   大図形
===================================================== */

function drawLargeShapes(){

  let out="";

  for(const s of LARGE_SHAPES){

    out += drawShape(
      s.type,
      s.x,
      s.y,
      s.s,
      s.color,
      s.rot
    );

  }

  return out;

}


/* =====================================================
   小図形

   ここがデータ本体。

   528スロット
   ↓
   33グループ
   ↓
   各グループ16個中8個ON

   だから毎回
   「小図形の数」は同じ。
===================================================== */

function drawMicroShapes(patterns){

  let out="";


  for(
    let group=0;
    group<33;
    group++
  ){

    const mask=
      patterns[group];


    for(
      let j=0;
      j<16;
      j++
    ){

      /*
        0なら描かない
        1なら描く
      */

      if(
        !(mask&(1<<j))
      ){

        continue;

      }


      const index=
        group*16+j;


      const s=
        MICRO_SLOTS[index];


      if(!s){

        continue;

      }


      out += drawShape(
        s.type===0
          ? "circle"
          : s.type===1
          ? "triangle"
          : s.type===2
          ? "rect"
          : "diamond",

        s.x,
        s.y,

        s.size,

        s.color,

        s.rot
      );

    }

  }


  return out;

}

  viewBox="0 0 1034 1149"
  preserveAspectRatio="xMidYMid meet">

  <!-- background -->

  <rect
    x="0"
    y="0"
    width="1034"
    height="1149"
    fill="#FBF7EC"
  />


  <!--
    =========================================
    ORIGINAL REFERENCE STYLE
    =========================================

    大きな図形は固定。
  -->

  ${drawLargeShapes()}


  <!--
    =========================================
    DATA SHAPES
    =========================================

    小図形だけがデータ。

    位置固定。

    ある = 1
    ない = 0

    各16個中8個だけ表示するため、
    どのコードでも密度がほぼ完全に同じ。
  -->

  ${drawMicroShapes(patterns)}


  <!--
    =========================================
    POTE-CHAN
    =========================================
  -->

  ${drawPote()}

</svg>

`;


  document
    .getElementById("result")
    .innerHTML=
    currentSVG;

}


/* =====================================================
   SVG保存
===================================================== */

function saveSVG(){

  if(!currentSVG){

    alert(
      "先にPOTE CODEを生成してください。"
    );

    return;

  }


  const blob=
    new Blob(
      [currentSVG],
      {
        type:"image/svg+xml"
      }
    );


  const url=
    URL.createObjectURL(blob);


  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "pote-code.svg";


  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}


/* =====================================================
   カウンター
===================================================== */

document
  .getElementById("text")
  .addEventListener(
    "input",
    function(){

      document
        .getElementById("counter")
        .textContent=
        Array.from(
          this.value
        ).length;

    }
  );

</script>
