<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポテコード</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#eee4d0;
  color:#49372a;
  font-family:-apple-system,BlinkMacSystemFont,
    "Helvetica Neue","Noto Sans JP",sans-serif;
}

.container{
  width:94%;
  max-width:680px;
  margin:0 auto;
  padding:25px 0 45px;
}

h1{
  text-align:center;
  font-size:30px;
  margin:0 0 5px;
}

.description{
  text-align:center;
  font-size:14px;
  opacity:.65;
  margin-bottom:20px;
}

textarea{
  display:block;
  width:100%;
  height:125px;

  padding:14px;

  border:3px solid #76543b;
  border-radius:17px;

  background:#fffaf0;

  color:#49372a;

  font-size:16px;

  resize:vertical;

  outline:none;
}

button{
  display:block;

  width:100%;

  margin-top:12px;

  padding:15px;

  border:0;

  border-radius:15px;

  background:#76543b;

  color:#fff;

  font-size:17px;

  font-weight:bold;
}

.code-card{
  margin-top:22px;

  padding:15px;

  border-radius:24px;

  background:#fffaf0;

  box-shadow:0 7px 22px rgba(0,0,0,.12);
}


/* ======================================
   ポテコード本体
====================================== */

#poteCode{

  position:relative;

  width:100%;

  aspect-ratio:1;

  overflow:hidden;

  border-radius:50%;

  background:#e6d3b0;

  box-shadow:
    inset 0 0 0 6px #cfb48a,
    inset 0 0 30px rgba(80,50,20,.10);

}


/* ======================================
   図形
====================================== */

.pote-shape{

  position:absolute;

  left:0;
  top:0;

  transform:translate(-50%,-50%);

}


/* 丸 */

.shape-circle{
  border-radius:50%;
}


/* 四角 */

.shape-square{
  border-radius:5px;
}


/* ひし形 */

.shape-diamond{
  transform:
    translate(-50%,-50%)
    rotate(45deg);

  border-radius:4px;
}


/* 六角形 */

.shape-hex{
  clip-path:polygon(
    25% 0%,
    75% 0%,
    100% 50%,
    75% 100%,
    25% 100%,
    0% 50%
  );
}


/* 三角 */

.shape-triangle{

  width:0 !important;
  height:0 !important;

  background:transparent !important;

  border-left:11px solid transparent;
  border-right:11px solid transparent;
  border-bottom:20px solid currentColor;

}


/* 星 */

.shape-star{

  background:transparent !important;

  clip-path:polygon(
    50% 0%,
    61% 35%,
    100% 35%,
    69% 57%,
    81% 100%,
    50% 74%,
    19% 100%,
    31% 57%,
    0% 35%,
    39% 35%
  );

}


/* 十字 */

.shape-cross{

  clip-path:polygon(
    35% 0%,
    65% 0%,
    65% 35%,
    100% 35%,
    100% 65%,
    65% 65%,
    65% 100%,
    35% 100%,
    35% 65%,
    0% 65%,
    0% 35%,
    35% 35%
  );

}


/* 花 */

.shape-flower{

  clip-path:polygon(
    50% 0%,
    64% 27%,
    100% 25%,
    75% 50%,
    100% 75%,
    64% 73%,
    50% 100%,
    36% 73%,
    0% 75%,
    25% 50%,
    0% 25%,
    36% 27%
  );

}


/* ======================================
   四隅の基準マーク
====================================== */

.corner{
  position:absolute;

  width:27px;
  height:27px;

  background:#3d3027;

  z-index:8;
}

.corner1{
  left:7%;
  top:7%;
  border-radius:7px;
}

.corner2{
  right:7%;
  top:7%;
  border-radius:50%;
}

.corner3{
  left:7%;
  bottom:7%;

  clip-path:polygon(
    50% 0%,
    100% 50%,
    50% 100%,
    0% 50%
  );
}

.corner4{
  right:7%;
  bottom:7%;

  border-radius:7px;

  transform:rotate(45deg);
}


/* ======================================
   中央ポテちゃん
   ★ マーク専用 ★
====================================== */

.pote-mark{

  position:absolute;

  left:50%;
  top:50%;

  width:45px;
  height:54px;

  transform:translate(-50%,-50%);

  background:#9b653c;

  border-radius:
    48% 52% 47% 53% /
    54% 47% 53% 46%;

  box-shadow:
    inset -4px -5px 0 #80502f,
    inset 4px 3px 0 #b47747,
    0 3px 7px rgba(0,0,0,.25);

  z-index:20;
}


/* 目 */

.pote-eye{

  position:absolute;

  top:19px;

  width:6px;
  height:9px;

  border-radius:50%;

  background:#2d2119;

}

.pote-eye-left{
  left:12px;
}

.pote-eye-right{
  right:12px;
}


/* 口 */

.pote-mouth{

  position:absolute;

  left:50%;
  top:33px;

  width:10px;
  height:6px;

  transform:translateX(-50%);

  border-bottom:2px solid #2d2119;

  border-radius:50%;

}


/* ======================================
   入力情報
====================================== */

.output{

  margin-top:14px;

  padding:12px;

  border-radius:12px;

  background:#eee4d0;

  font-size:13px;

  word-break:break-all;

}

.status{

  margin-top:8px;

  text-align:center;

  font-size:12px;

  opacity:.6;

}

</style>
</head>


<body>

<div class="container">

<h1>🥔 ポテコード</h1>

<div class="description">
文字・URL・日本語などをポテコードに
</div>


<textarea
  id="inputText"
  placeholder="ここに文字やURLを入力

例：
こんにちは
POTE-123
https://example.com/
https://x.gd/Ab12
"></textarea>


<button id="makeButton">
ポテコードを作る
</button>


<div class="code-card">

<div id="poteCode">

  <!-- 四隅の固定マーク -->

  <div class="corner corner1"></div>
  <div class="corner corner2"></div>
  <div class="corner corner3"></div>
  <div class="corner corner4"></div>


  <!-- 中央の固定ポテちゃん -->

  <div class="pote-mark">

    <div class="pote-eye pote-eye-left"></div>
    <div class="pote-eye pote-eye-right"></div>

    <div class="pote-mouth"></div>

  </div>

</div>


<div class="output">

  <strong>入力：</strong>

  <span id="outputText">---</span>

</div>


<div
  class="status"
  id="status">

  ポテコードを作ってね

</div>

</div>

</div>


<script>

/* ==========================================
   ポテコード設定
========================================== */


/*
   カメラで判別しやすい濃色。

   赤・青・緑・紫などを使用するが、
   明るすぎる色は避ける。
*/

var COLORS = [

  "#315f42",
  "#24577a",
  "#744a8b",
  "#9a542f",
  "#a43838",
  "#806b20",
  "#356b70",
  "#6f405c"

];


/*
   図形の種類
*/

var SHAPES = [

  "circle",
  "square",
  "diamond",
  "hex",
  "triangle",
  "star",
  "cross",
  "flower"

];


/* ==========================================
   固定位置を作る
========================================== */

function createSlots(){

  var slots=[];


  /*
     円状にたくさん配置。

     すべてのポテコードで
     同じ位置を使用する。
  */

  var rings=[

    {
      radius:44,
      count:24
    },

    {
      radius:38,
      count:22
    },

    {
      radius:32,
      count:20
    },

    {
      radius:26,
      count:16
    },

    {
      radius:20,
      count:12
    },

    {
      radius:15,
      count:8
    }

  ];


  for(
    var r=0;
    r<rings.length;
    r++
  ){

    var ring=rings[r];


    for(
      var i=0;
      i<ring.count;
      i++
    ){

      var angle=
        (i/ring.count)*
        Math.PI*2;


      var x=
        50+
        Math.cos(angle)*
        ring.radius;


      var y=
        50+
        Math.sin(angle)*
        ring.radius;


      /*
         中央ポテちゃんの
         周辺を空ける。
      */

      var dx=x-50;
      var dy=y-50;


      var distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );


      if(distance>9){

        slots.push({
          x:x,
          y:y
        });

      }

    }

  }


  return slots;

}


var SLOTS=createSlots();


/* ==========================================
   文字列 → UTF-8
========================================== */

function getBytes(text){

  /*
     TextEncoderが使える環境では
     UTF-8にする。
  */

  if(
    typeof TextEncoder!=="undefined"
  ){

    return new TextEncoder()
      .encode(text);

  }


  /*
     古い環境用の簡易UTF-8変換
  */

  var encoded=
    unescape(
      encodeURIComponent(text)
    );

  var result=[];

  for(
    var i=0;
    i<encoded.length;
    i++
  ){

    result.push(
      encoded.charCodeAt(i)
    );

  }

  return result;

}


/* ==========================================
   1バイト → 4つの2bit
========================================== */

function toSymbols(bytes){

  var symbols=[];


  for(
    var i=0;
    i<bytes.length;
    i++
  ){

    var b=bytes[i];


    symbols.push(
      (b>>6)&3
    );

    symbols.push(
      (b>>4)&3
    );

    symbols.push(
      (b>>2)&3
    );

    symbols.push(
      b&3
    );

  }


  return symbols;

}


/* ==========================================
   ハッシュ
========================================== */

function makeHash(text){

  var h=2166136261;


  for(
    var i=0;
    i<text.length;
    i++
  ){

    h^=
      text.charCodeAt(i);


    h+=
      (h<<1)+
      (h<<4)+
      (h<<7)+
      (h<<8)+
      (h<<24);

  }


  return Math.abs(
    h>>>0
  );

}


/* ==========================================
   ポテコード生成
========================================== */

function makeCode(){

  var input=
    document.getElementById(
      "inputText"
    );


  var text=input.value;


  if(!text){

    alert(
      "文字やURLを入力してね！"
    );

    return;

  }


  var code=
    document.getElementById(
      "poteCode"
    );


  /*
     前回の図形を削除
  */

  var oldShapes=
    code.querySelectorAll(
      ".pote-shape"
    );


  for(
    var i=0;
    i<oldShapes.length;
    i++
  ){

    oldShapes[i].remove();

  }


  /*
     UTF-8データ
  */

  var bytes=
    getBytes(text);


  var symbols=
    toSymbols(bytes);


  /*
     入力から固定された
     見た目のパターンを作る
  */

  var seed=
    makeHash(text);


  /*
     =====================================
     全スロットを必ず埋める
     =====================================

     データが少なくても
     空白にはしない。

  */

  for(
    var i=0;
    i<SLOTS.length;
    i++
  ){

    var value;


    /*
       本物のデータ
    */

    if(
      i<symbols.length
    ){

      value=
        symbols[i];

    }


    /*
       残りはダミーデータ

       見た目を埋めるためのもの。
    */

    else{

      value=
        (
          seed+
          i*17+
          i*i
        )%4;

    }


    var slot=
      SLOTS[i];


    /*
       図形

       データと入力文字によって
       微妙に変化。
    */

    var shapeIndex=
      (
        seed+
        i*7+
        value*13
      )%SHAPES.length;


    var shape=
      SHAPES[shapeIndex];


    /*
       色
    */

    var colorIndex=
      (
        seed+
        i*11+
        value*5
      )%COLORS.length;


    var color=
      COLORS[colorIndex];


    /*
       要素作成
    */

    var el=
      document.createElement(
        "div"
      );


    el.className=
      "pote-shape shape-"+
      shape;


    /*
       大きさ

       全体の密度は一定。
    */

    var size=
      14+
      (
        (
          seed+
          i*3+
          value
        )%8
      );


    el.style.width=
      size+"px";

    el.style.height=
      size+"px";


    /*
       色
    */

    el.style.background=
      color;

    el.style.color=
      color;


    /*
       回転
    */

    if(
      shape!=="triangle" &&
      shape!=="diamond"
    ){

      var rotation=
        (
          seed+
          i*19
        )%360;


      el.style.transform=
        "translate(-50%,-50%) rotate("+
        rotation+
        "deg)";

    }


    /*
       固定位置
    */

    el.style.left=
      slot.x+"%";

    el.style.top=
      slot.y+"%";


    code.appendChild(el);

  }


  /*
     入力表示
  */

  document
    .getElementById(
      "outputText"
    )
    .textContent=
      text;


  /*
     ステータス
  */

  document
    .getElementById(
      "status"
    )
    .textContent=
      "全"+SLOTS.length+
      "スロット使用";


}


/* ==========================================
   ボタン
========================================== */

document
  .getElementById(
    "makeButton"
  )
  .addEventListener(
    "click",
    makeCode
  );


/*
   最初はコードを生成しない。

   → 開いた瞬間にエラーになりにくい。
*/

</script>

</body>
</html>
