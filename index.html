<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>POTE CODE Generator</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#f7f1e5;
  color:#51483f;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  padding:22px 14px 35px;
}

.app{
  width:min(680px,100%);
}

h1{
  margin:0 0 5px;
  text-align:center;
  font-size:25px;
  letter-spacing:.08em;
}

.sub{
  text-align:center;
  font-size:12px;
  opacity:.65;
  margin-bottom:18px;
}

.card{
  background:rgba(255,255,255,.72);
  border-radius:22px;
  padding:18px;
  box-shadow:0 8px 30px rgba(80,65,45,.08);
}

textarea{
  width:100%;
  min-height:110px;
  resize:vertical;
  border:1px solid #d9cdb9;
  border-radius:15px;
  background:#fffdf8;
  color:#51483f;
  padding:14px;
  font-size:16px;
  outline:none;
}

textarea:focus{
  border-color:#789B69;
}

button{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:15px;
  padding:14px;
  font-size:16px;
  font-weight:700;
  background:#789B69;
  color:white;
  cursor:pointer;
}

button:active{
  transform:scale(.985);
}

.canvasWrap{
  margin-top:18px;
  width:100%;
  aspect-ratio:1;
  background:#fffdf7;
  border-radius:22px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

svg{
  width:100%;
  height:100%;
  display:block;
}

.status{
  margin-top:12px;
  text-align:center;
  font-size:13px;
  min-height:20px;
}

.ver{
  text-align:center;
  margin-top:14px;
  font-size:10px;
  opacity:.42;
  letter-spacing:.08em;
}
</style>
</head>

<body>

<div class="app">

  <h1>POTE CODE</h1>
  <div class="sub">見た目を保ったまま文字をコード化</div>

  <div class="card">

    <textarea id="text"
      maxlength="30"
      placeholder="ここに文字を入力（30文字まで）"></textarea>

    <button id="generate">POTE CODEを生成</button>

    <div class="canvasWrap">
      <svg id="svg"
           viewBox="0 0 1500 1500"
           xmlns="http://www.w3.org/2000/svg">
      </svg>
    </div>

    <div id="status" class="status"></div>

  </div>

  <div class="ver">POTE CODE ver 1.2</div>

</div>


<script>

/* =========================================================
   基本設定
========================================================= */

const SIZE = 1500;
const CENTER = 750;

const SLOT_COUNT = 544;

const MIN_R = 175;
const MAX_R = 640;

/*
  ここが今回の修正版。

  48px固定だと544個を配置できない場合があるため、
  安全な範囲で自動的に少しずつ緩める。
  
  最大図形サイズは18pxなので、
  最終的な36px以上なら基本的に図形同士は接触しない。
*/
const DISTANCES = [
  42,
  40,
  39,
  38,
  37,
  36
];

const MARKER_EXCLUSION = 105;

const COLORS = [
  "#789B69",
  "#D89D32",
  "#CE7E3F",
  "#4F858F",
  "#939B54",
  "#668D67"
];


/* =========================================================
   固定乱数
========================================================= */

let seed = 9283746;

function random(){
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}


/* =========================================================
   文字 → ビット
========================================================= */

function textBits(text){

  const bits = [];

  for(let i=0;i<30;i++){

    const code =
      i < text.length
      ? text.charCodeAt(i)
      : 0;

    for(let b=15;b>=0;b--){
      bits.push((code >> b) & 1);
    }
  }

  return bits;
}


/* =========================================================
   CRC8
========================================================= */

function crc8(bits){

  let crc = 0;

  for(const bit of bits){

    const mix =
      ((crc >> 7) & 1) ^ bit;

    crc = (crc << 1) & 255;

    if(mix){
      crc ^= 0x07;
    }
  }

  return crc;
}


/* =========================================================
   パケット作成
========================================================= */

function makePacket(text){

  const body = textBits(text);

  const lengthBits = [];

  for(let b=4;b>=0;b--){
    lengthBits.push((text.length >> b) & 1);
  }

  const crc = crc8(body);

  const crcBits = [];

  for(let b=7;b>=0;b--){
    crcBits.push((crc >> b) & 1);
  }

  return [
    ...lengthBits,
    ...body,
    ...crcBits
  ];
}


/* =========================================================
   組み合わせ
========================================================= */

function C(n,k){

  if(k<0 || k>n) return 0;

  k=Math.min(k,n-k);

  let result=1;

  for(let i=1;i<=k;i++){
    result =
      result * (n-k+i) / i;
  }

  return Math.round(result);
}


/* =========================================================
   数値化
========================================================= */

function bitsToNumber(bits){

  let n=0;

  for(const bit of bits){
    n = n * 2 + bit;
  }

  return n;
}


/* =========================================================
   29bit → 32スロット中16個ON
========================================================= */

function unrank(rank){

  const bits=[];

  let ones=16;
  let r=rank;

  for(let i=0;i<32;i++){

    if(ones===0){
      bits.push(0);
      continue;
    }

    if(ones===32-i){
      bits.push(1);
      ones--;
      continue;
    }

    const zeroCount =
      C(31-i,ones);

    if(r<zeroCount){

      bits.push(0);

    }else{

      bits.push(1);
      r-=zeroCount;
      ones--;
    }
  }

  return bits;
}


/* =========================================================
   エンコード
========================================================= */

function encode(text){

  const packet = makePacket(text);

  const output=[];

  for(let group=0;group<17;group++){

    const chunk=[];

    for(let i=0;i<29;i++){

      const index =
        group*29+i;

      chunk.push(
        packet[index] || 0
      );
    }

    const value =
      bitsToNumber(chunk);

    const groupBits =
      unrank(value);

    output.push(...groupBits);
  }

  return output;
}


/* =========================================================
   スロット用図形情報
========================================================= */

function getShape(i){

  let size;

  if(i % 23 === 0){
    size=18;
  }
  else if(i % 13 === 0){
    size=16;
  }
  else if(i % 7 === 0){
    size=15;
  }
  else{
    size=11+(i%3);
  }

  return {
    type:i%5,
    size
  };
}


/* =========================================================
   マーカー
========================================================= */

const MARKERS = [
  {x:255,y:275},
  {x:1245,y:275},
  {x:255,y:1245}
];


/* =========================================================
   マーカーとの距離
========================================================= */

function tooCloseToMarker(x,y){

  for(const m of MARKERS){

    const dx=x-m.x;
    const dy=y-m.y;

    if(
      Math.sqrt(dx*dx+dy*dy)
      < MARKER_EXCLUSION
    ){
      return true;
    }
  }

  return false;
}


/* =========================================================
   新しい固定スロット生成
========================================================= */

/*
  以前のランダム配置だけだと、

    「あと数個だけ置けない」
    
  という状態になって

    スロット作成に失敗しました

  になっていた。

  今回は、

  1. 候補点を大量に作る
  2. 円の中だけにする
  3. マーカーを避ける
  4. 一定距離以上を保つ
  5. 544個になるまで選ぶ
  6. もし足りなければ距離を少し緩める

  という方式。
*/

function createSlots(){

  /*
    毎回同じ配置にする
  */
  seed=9283746;

  for(const minDistance of DISTANCES){

    const candidates=[];

    /*
      ランダム候補をかなり多めに作る
    */
    for(let i=0;i<30000;i++){

      const angle =
        random()*Math.PI*2;

      /*
        面積が均等になるように sqrt
      */
      const rr =
        Math.sqrt(
          random()
        ) *
        (MAX_R-MIN_R)
        + MIN_R;

      const x =
        CENTER +
        Math.cos(angle)*rr;

      const y =
        CENTER +
        Math.sin(angle)*rr;

      /*
        円の外側に出ない
      */
      const dx=x-CENTER;
      const dy=y-CENTER;

      const radius =
        Math.sqrt(dx*dx+dy*dy);

      if(
        radius<MIN_R ||
        radius>MAX_R
      ){
        continue;
      }

      /*
        マーカー周辺を空ける
      */
      if(tooCloseToMarker(x,y)){
        continue;
      }

      candidates.push({
        x,
        y,
        angle,
        radius,
        score:Math.abs(
          radius -
          ((MIN_R+MAX_R)/2)
        )
      });
    }


    /*
      外側・内側に偏りすぎないよう、
      ランダム性を残したまま並べる
    */
    candidates.sort(
      (a,b)=>
        a.score-b.score
    );


    const selected=[];

    /*
      先頭から全部選ぶのではなく、
      少しシャッフルする。
    */
    for(let i=candidates.length-1;i>0;i--){

      const j =
        Math.floor(
          random()*(i+1)
        );

      const temp=candidates[i];

      candidates[i]=candidates[j];
      candidates[j]=temp;
    }


    for(const p of candidates){

      let ok=true;

      /*
        既存点との距離チェック
      */
      for(const q of selected){

        const dx=p.x-q.x;
        const dy=p.y-q.y;

        if(
          dx*dx+dy*dy
          <
          minDistance*minDistance
        ){

          ok=false;
          break;
        }
      }

      if(!ok) continue;

      selected.push(p);

      if(selected.length>=SLOT_COUNT){
        break;
      }
    }


    /*
      544個できた！
    */
    if(selected.length>=SLOT_COUNT){

      /*
        位置を安定させるため、
        インデックス順に並べ直す
      */
      selected.length=SLOT_COUNT;

      return selected.map(
        (p,i)=>({

          x:p.x,
          y:p.y,

          /*
            図形情報も固定
          */
          type:getShape(i).type,
          size:getShape(i).size,

          color:
            COLORS[
              i % COLORS.length
            ]
        })
      );
    }
  }


  /*
    通常ここには来ない。
  */
  throw new Error(
    "スロットを作成できませんでした"
  );
}


/* =========================================================
   SVG描画
========================================================= */

function createSVG(text){

  const bits=encode(text);

  const slots=createSlots();

  const svg=
    document.getElementById("svg");

  svg.innerHTML="";


  /* ---------------------------------------------
     背景
  --------------------------------------------- */

  const bg=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

  bg.setAttribute("x","0");
  bg.setAttribute("y","0");
  bg.setAttribute("width","1500");
  bg.setAttribute("height","1500");
  bg.setAttribute("fill","#FFFDF7");

  svg.appendChild(bg);


  /* ---------------------------------------------
     外周円
  --------------------------------------------- */

  const outer=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

  outer.setAttribute("cx","750");
  outer.setAttribute("cy","750");
  outer.setAttribute("r","680");
  outer.setAttribute(
    "fill","none"
  );
  outer.setAttribute(
    "stroke","#D7CAB0"
  );
  outer.setAttribute(
    "stroke-width","2"
  );
  outer.setAttribute(
    "opacity",".3"
  );

  svg.appendChild(outer);


  /* ---------------------------------------------
     データ図形
  --------------------------------------------- */

  for(let i=0;i<SLOT_COUNT;i++){

    if(bits[i]!==1){
      continue;
    }

    const s=slots[i];

    const g=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "g"
      );

    const color=s.color;
    const size=s.size;


    /* 円 */
    if(s.type===0){

      const e=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );

      e.setAttribute("cx",s.x);
      e.setAttribute("cy",s.y);
      e.setAttribute("r",size);

      e.setAttribute(
        "fill",color
      );

      g.appendChild(e);
    }


    /* 丸角長方形 */
    else if(s.type===1){

      const e=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "rect"
        );

      e.setAttribute(
        "x",s.x-size
      );

      e.setAttribute(
        "y",s.y-size*.72
      );

      e.setAttribute(
        "width",size*2
      );

      e.setAttribute(
        "height",size*1.44
      );

      e.setAttribute(
        "rx",size*.5
      );

      e.setAttribute(
        "fill",color
      );

      g.appendChild(e);
    }


    /* 三角 */
    else if(s.type===2){

      const e=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "polygon"
        );

      const h=size*1.35;

      e.setAttribute(
        "points",
        [
          `${s.x},${s.y-h}`,
          `${s.x-size},${s.y+h*.65}`,
          `${s.x+size},${s.y+h*.65}`
        ].join(" ")
      );

      e.setAttribute(
        "fill",color
      );

      g.appendChild(e);
    }


    /* ダイヤ */
    else if(s.type===3){

      const e=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "polygon"
        );

      e.setAttribute(
        "points",
        [
          `${s.x},${s.y-size}`,
          `${s.x+size},${s.y}`,
          `${s.x},${s.y+size}`,
          `${s.x-size},${s.y}`
        ].join(" ")
      );

      e.setAttribute(
        "fill",color
      );

      g.appendChild(e);
    }


    /* 横長丸角 */
    else{

      const e=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "rect"
        );

      e.setAttribute(
        "x",s.x-size*1.25
      );

      e.setAttribute(
        "y",s.y-size*.55
      );

      e.setAttribute(
        "width",size*2.5
      );

      e.setAttribute(
        "height",size*1.1
      );

      e.setAttribute(
        "rx",size*.5
      );

      e.setAttribute(
        "fill",color
      );

      g.appendChild(e);
    }

    svg.appendChild(g);
  }


  /* ---------------------------------------------
     3つの位置合わせマーカー
  --------------------------------------------- */

  for(const m of MARKERS){

    const ring=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );

    ring.setAttribute(
      "cx",m.x
    );

    ring.setAttribute(
      "cy",m.y
    );

    ring.setAttribute(
      "r","38"
    );

    ring.setAttribute(
      "fill","#FFFDF5"
    );

    ring.setAttribute(
      "stroke","#51483F"
    );

    ring.setAttribute(
      "stroke-width","7"
    );

    svg.appendChild(ring);


    const inner=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );

    inner.setAttribute(
      "cx",m.x
    );

    inner.setAttribute(
      "cy",m.y
    );

    inner.setAttribute(
      "r","18"
    );

    inner.setAttribute(
      "fill","none"
    );

    inner.setAttribute(
      "stroke","#51483F"
    );

    inner.setAttribute(
      "stroke-width","6"
    );

    svg.appendChild(inner);


    const dot=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );

    dot.setAttribute(
      "cx",m.x
    );

    dot.setAttribute(
      "cy",m.y
    );

    dot.setAttribute(
      "r","5"
    );

    dot.setAttribute(
      "fill","#51483F"
    );

    svg.appendChild(dot);
  }


  /* ---------------------------------------------
     中央ポテちゃんマーク
  --------------------------------------------- */

  const pote=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "g"
    );


  const body=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

  body.setAttribute(
    "cx","750"
  );

  body.setAttribute(
    "cy","750"
  );

  body.setAttribute(
    "r","78"
  );

  body.setAttribute(
    "fill","#D99A3D"
  );

  pote.appendChild(body);


  /* 左側の小さな飾り */

  const deco=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

  deco.setAttribute(
    "d",
    "M700 705 C675 690 660 700 652 718"
  );

  deco.setAttribute(
    "fill","none"
  );

  deco.setAttribute(
    "stroke","#51483F"
  );

  deco.setAttribute(
    "stroke-width","7"
  );

  deco.setAttribute(
    "stroke-linecap","round"
  );

  pote.appendChild(deco);


  /* 顔 */

  const eye1=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

  eye1.setAttribute(
    "cx","725"
  );

  eye1.setAttribute(
    "cy","748"
  );

  eye1.setAttribute(
    "r","5"
  );

  eye1.setAttribute(
    "fill","#51483F"
  );

  pote.appendChild(eye1);


  const eye2=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

  eye2.setAttribute(
    "cx","775"
  );

  eye2.setAttribute(
    "cy","748"
  );

  eye2.setAttribute(
    "r","5"
  );

  eye2.setAttribute(
    "fill","#51483F"
  );

  pote.appendChild(eye2);


  const mouth=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

  mouth.setAttribute(
    "d",
    "M735 770 Q750 782 765 770"
  );

  mouth.setAttribute(
    "fill","none"
  );

  mouth.setAttribute(
    "stroke","#51483F"
  );

  mouth.setAttribute(
    "stroke-width","5"
  );

  mouth.setAttribute(
    "stroke-linecap","round"
  );

  pote.appendChild(mouth);


  svg.appendChild(pote);
}


/* =========================================================
   生成ボタン
========================================================= */

document
.getElementById("generate")
.addEventListener(
  "click",
  ()=>{
    
    const text=
      document
      .getElementById("text")
      .value;

    const status=
      document
      .getElementById("status");


    if(!text){

      status.textContent=
        "文字を入力してください";

      return;
    }


    try{

      createSVG(text);

      status.textContent=
        "生成しました";

    }
    catch(error){

      console.error(error);

      status.textContent=
        "生成に失敗しました";
    }
  }
);


/* =========================================================
   最初の表示
========================================================= */

try{

  createSVG("POTE");

}
catch(error){

  console.error(error);

}

</script>

</body>
</html>
